<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Kuota Peran | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2">
                <!-- Menu akan dimuat oleh JS -->
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl lg:text-3xl font-bold text-gray-800 flex items-center gap-3">
                        <i data-lucide="users" class="w-8 h-8 text-teal-600"></i>
                        Atur Kuota Peran
                    </h2>
                    <p class="text-gray-500 text-sm mt-1">Batasi jumlah pengguna yang dapat mendaftar untuk setiap peran.</p>
                </div>
                <button onclick="saveQuota()" id="saveBtn" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-6 rounded-lg transition shadow-md flex items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Simpan Pengaturan
                </button>
            </header>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden p-6">
                <div id="loading" class="text-center py-10 text-gray-500">Memuat data kuota...</div>
                
                <div id="quotaContainer" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Form items will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                const allowedMenus = permData.success ? permData.permissions : [];

                if (!allowedMenus.includes('navQuota')) {
                    alert('Anda tidak memiliki izin untuk mengakses halaman ini.');
                    window.location.href = 'dashboard.html';
                    return;
                }
                renderSidebar(allowedMenus);
                loadQuotas();
            } catch (e) { 
                alert('Gagal memuat izin akses.');
            }
        }

        function renderSidebar(allowedMenus) {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = `<div class="bg-gray-50 rounded-lg p-2"><h3 class="px-2 mb-2 text-xs font-bold text-gray-400">MANAJEMEN</h3><a id="navQuota" href="quota_management.html" class="flex items-center gap-3 px-3 py-2.5 text-teal-600 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="users" class="w-5 h-5"></i> Atur Kuota Peran</a></div>`;
            lucide.createIcons();
        }

        async function loadQuotas() {
            try {
                const res = await fetch('sadigs_api_v3/quota.php?t=' + new Date().getTime());
                const data = await res.json();

                if (data.success) {
                    const container = document.getElementById('quotaContainer');
                    container.innerHTML = '';
                    
                    // Filter roles that usually need quota (exclude Santri/Walisantri if desired, but let's show all relevant ones)
                    const roles = Object.keys(data.quotas);
                    
                    roles.forEach(role => {
                        const info = data.quotas[role];
                        const div = document.createElement('div');
                        div.className = 'bg-gray-50 p-4 rounded-lg border border-gray-200';
                        
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <label class="font-bold text-gray-700 block">${role}</label>
                                <span class="text-xs font-medium px-2 py-1 rounded bg-blue-100 text-blue-700">Terisi: ${info.current_count}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="number" min="0" 
                                    class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-teal-500 outline-none"
                                    data-role="${role}"
                                    value="${info.max_limit}" 
                                    placeholder="0 = Tak Terbatas">
                            </div>
                            <p class="text-xs text-gray-400 mt-1">Isi 0 untuk tidak membatasi.</p>
                        `;
                        container.appendChild(div);
                    });

                    document.getElementById('loading').classList.add('hidden');
                    container.classList.remove('hidden');
                }
            } catch (e) {
                document.getElementById('loading').innerHTML = '<span class="text-red-500">Gagal memuat data.</span>';
            }
        }

        async function saveQuota() {
            const btn = document.getElementById('saveBtn');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';

            const inputs = document.querySelectorAll('input[data-role]');
            const updates = {};
            inputs.forEach(input => {
                updates[input.dataset.role] = input.value;
            });

            try {
                const res = await fetch('sadigs_api_v3/update_quota.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quotas: updates })
                });
                const result = await res.json();
                
                if (result.success) {
                    alert('Pengaturan kuota berhasil disimpan!');
                    loadQuotas(); // Reload to refresh data
                } else {
                    alert('Gagal: ' + result.message);
                }
            } catch (e) {
                alert('Terjadi kesalahan koneksi.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
                lucide.createIcons();
            }
        }

        initPage();
    </script>
</body>
</html>
