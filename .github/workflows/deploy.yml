name: Deploy to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP (for optional composer scripts)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 🚀 Ready for Hostinger GIT Deploy
        run: echo "Kode sudah masuk GitHub. Silakan klik Deploy di hPanel Hostinger."
