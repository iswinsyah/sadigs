<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Laporan Tahfidz | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-2xl mx-auto">
                <h1 class="text-2xl font-bold text-gray-800 mb-6">Input Laporan Tahfidz</h1>
                
                <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
                    <form id="tahfizhForm" class="space-y-6">
                        
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Pilih Santri <span class="text-red-500">*</span></label>
                            <select name="student_id" id="studentSelect" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500" required>
                                <option value="">Memuat santri binaan...</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Jenis Laporan <span class="text-red-500">*</span></label>
                            <div class="flex gap-4">
                                <label class="flex items-center"><input type="radio" name="type" value="Ziyadah" class="mr-2" checked> Ziyadah (Hafalan Baru)</label>
                                <label class="flex items-center"><input type="radio" name="type" value="Murajaah" class="mr-2"> Muraja'ah (Pengulangan)</label>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Surat <span class="text-red-500">*</span></label>
                                <select name="surah" id="surahSelect" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500" required>
                                    <option value="">-- Pilih Surat --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Ayat <span class="text-red-500">*</span></label>
                                <input type="text" name="ayat" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500" placeholder="Contoh: 1-10" required>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Kualitas Hafalan <span class="text-red-500">*</span></label>
                            <select name="quality" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500" required>
                                <option value="Mumtaz">Mumtaz (Sangat Lancar)</option>
                                <option value="Jayyid Jiddan">Jayyid Jiddan (Lancar)</option>
                                <option value="Jayyid">Jayyid (Cukup Lancar)</option>
                                <option value="Maqbul">Maqbul (Kurang Lancar)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Catatan (Opsional)</label>
                            <textarea name="notes" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500" placeholder="Contoh: Perlu perbaikan di makhraj huruf..."></textarea>
                        </div>

                        <button type="submit" id="sendBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg shadow-md flex justify-center items-center gap-2">
                            <i data-lucide="save" class="w-5 h-5"></i> Simpan Laporan
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Cek Sesi & Muat Santri
        fetch('sadigs_api_v3/session_check.php').then(r=>r.json()).then(d=>{
            if(!d.success) window.location.href = 'index.html';
            loadStudents();
            loadSurahs();
        });

        function loadSurahs() {
            const surahs = ["Al-Fatihah", "Al-Baqarah", "Ali 'Imran", "An-Nisa'", "Al-Ma'idah", "Al-An'am", "Al-A'raf", "Al-Anfal", "At-Taubah", "Yunus", "Hud", "Yusuf", "Ar-Ra'd", "Ibrahim", "Al-Hijr", "An-Nahl", "Al-Isra'", "Al-Kahf", "Maryam", "Ta-Ha", "Al-Anbiya'", "Al-Hajj", "Al-Mu'minun", "An-Nur", "Al-Furqan", "Asy-Syu'ara'", "An-Naml", "Al-Qasas", "Al-'Ankabut", "Ar-Rum", "Luqman", "As-Sajdah", "Al-Ahzab", "Saba'", "Fatir", "Ya-Sin", "As-Saffat", "Sad", "Az-Zumar", "Ghafir", "Fussilat", "Asy-Syura", "Az-Zukhruf", "Ad-Dukhan", "Al-Jasiyah", "Al-Ahqaf", "Muhammad", "Al-Fath", "Al-Hujurat", "Qaf", "Az-Zariyat", "At-Tur", "An-Najm", "Al-Qamar", "Ar-Rahman", "Al-Waqi'ah", "Al-Hadid", "Al-Mujadilah", "Al-Hasyr", "Al-Mumtahanah", "As-Saff", "Al-Jumu'ah", "Al-Munafiqun", "At-Tagabun", "At-Talaq", "At-Tahrim", "Al-Mulk", "Al-Qalam", "Al-Haqqah", "Al-Ma'arij", "Nuh", "Al-Jinn", "Al-Muzzammil", "Al-Muddassir", "Al-Qiyamah", "Al-Insan", "Al-Mursalat", "An-Naba'", "An-Nazi'at", "'Abasa", "At-Takwir", "Al-Infitar", "Al-Mutaffifin", "Al-Insyiqaq", "Al-Buruj", "At-Tariq", "Al-A'la", "Al-Ghasyiyah", "Al-Fajr", "Al-Balad", "Asy-Syams", "Al-Lail", "Ad-Duha", "Asy-Syarh", "At-Tin", "Al-'Alaq", "Al-Qadr", "Al-Bayyinah", "Az-Zalzalah", "Al-'Adiyat", "Al-Qari'ah", "At-Takasur", "Al-'Asr", "Al-Humazah", "Al-Fil", "Quraisy", "Al-Ma'un", "Al-Kausar", "Al-Kafirun", "An-Nasr", "Al-Lahab", "Al-Ikhlas", "Al-Falaq", "An-Nas"];
            const select = document.getElementById('surahSelect');
            surahs.forEach((s, i) => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = `${i+1}. ${s}`;
                select.appendChild(opt);
            });
        }

        async function loadStudents() {
            const select = document.getElementById('studentSelect');
            try {
                const res = await fetch('sadigs_api_v3/tahfizh_api.php?action=get_my_students');
                const result = await res.json();
                
                if (result.success && result.data.length > 0) {
                    select.innerHTML = '<option value="">-- Pilih Santri --</option>';
                    result.data.forEach(student => {
                        const option = document.createElement('option');
                        option.value = student.user_id;
                        option.textContent = student.full_name;
                        select.appendChild(option);
                    });
                } else {
                    select.innerHTML = '<option value="">Tidak ada santri binaan yang terdaftar</option>';
                    select.disabled = true;
                }
            } catch (e) {
                console.error(e);
                select.innerHTML = '<option value="">Gagal memuat data santri</option>';
                select.disabled = true;
            }
        }

        document.getElementById('tahfizhForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('sendBtn');
            const originalHTML = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Menyimpan...';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('sadigs_api_v3/tahfizh_api.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                alert(result.message);
                if (result.success) {
                    e.target.reset();
                }
            } catch (e) {
                alert('Gagal menyimpan laporan.');
            } finally {
                btn.disabled = false; btn.innerHTML = originalHTML;
            }
        });
    </script>
</body>
</html>
