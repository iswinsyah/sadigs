<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Transaksi Harian | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar"></nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Buku Transaksi Harian</h2>
                    <p class="text-gray-500 text-sm mt-1">Rekapitulasi pemasukan dan pengeluaran operasional.</p>
                </div>
                <button onclick="window.print()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 flex items-center gap-2 text-sm font-medium">
                    <i data-lucide="printer" class="w-4 h-4"></i> Cetak
                </button>
            </header>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Tanggal</th>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Jenis</th>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Kategori</th>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Uraian</th>
                                <th class="px-4 py-3 text-right font-bold text-gray-500 uppercase">Nominal</th>
                                <th class="px-4 py-3 text-center font-bold text-gray-500 uppercase">Bukti</th>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Petugas</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="7" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                const allowedMenus = permData.success ? permData.permissions : [];

                const thisMenuId = 'navTabelTransaksi';
                if (!allowedMenus.includes(thisMenuId)) {
                    alert('Anda tidak memiliki izin untuk mengakses halaman ini.');
                    window.location.href = 'dashboard.html';
                    return;
                }
                renderSidebar(allowedMenus);
            } catch (e) { 
                alert('Gagal memuat izin akses. Silakan coba lagi.');
                window.location.href = 'dashboard.html';
            }

            loadData();
        }

        function renderSidebar(allowedMenus) {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = `<div class="bg-gray-50 rounded-lg p-2 mt-2"><h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase">KEUANGAN</h3><a href="daily_transaction_form.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="pen-tool" class="w-5 h-5"></i> Form Transaksi</a><a href="daily_transaction_list.html" class="flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="book" class="w-5 h-5"></i> Buku Transaksi</a></div>`;
            lucide.createIcons();
        }

        async function loadData() {
            const tbody = document.getElementById('tableBody');
            try {
                const res = await fetch('sadigs_api_v3/get_daily_transactions.php');
                const result = await res.json();
                
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(row => {
                        const isOut = row.type === 'Pengeluaran';
                        const colorClass = isOut ? 'text-red-600' : 'text-green-600';
                        const sign = isOut ? '-' : '+';
                        
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="px-4 py-3 align-top whitespace-nowrap">${row.transaction_date}</td>
                            <td class="px-4 py-3 align-top"><span class="px-2 py-1 rounded text-xs font-bold ${isOut ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">${row.type}</span></td>
                            <td class="px-4 py-3 align-top font-medium">${row.category}</td>
                            <td class="px-4 py-3 align-top text-gray-600">${row.description}</td>
                            <td class="px-4 py-3 align-top text-right font-bold ${colorClass}">${sign} Rp ${parseInt(row.amount).toLocaleString('id-ID')}</td>
                            <td class="px-4 py-3 align-top text-center">
                                ${row.proof_file ? `<a href="sadigs_api_v3/${row.proof_file}" target="_blank" class="text-blue-600 hover:underline text-xs"><i data-lucide="file-text" class="w-4 h-4 inline"></i></a>` : '-'}
                            </td>
                            <td class="px-4 py-3 align-top text-xs text-gray-500">${row.officer_name}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                    lucide.createIcons();
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-gray-500">Belum ada data transaksi.</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>';
            }
        }

        initPage();
    </script>
</body>
</html>
