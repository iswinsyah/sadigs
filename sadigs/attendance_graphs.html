<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafik Absensi | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="max-w-6xl mx-auto p-4 lg:p-8">
        <div class="flex items-center gap-3 mb-6">
            <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
            <h1 class="text-2xl font-bold text-gray-800">Grafik Statistik Absensi</h1>
        </div>

        <!-- Tabs -->
        <div class="flex gap-2 mb-6">
            <button onclick="loadChart('daily')" id="btnDaily" class="px-4 py-2 bg-teal-600 text-white rounded-lg font-bold shadow-sm transition">Harian (30 Hari)</button>
            <button onclick="loadChart('monthly')" id="btnMonthly" class="px-4 py-2 bg-white text-gray-600 hover:bg-gray-100 rounded-lg font-bold shadow-sm transition">Bulanan (Tahun Ini)</button>
        </div>

        <!-- Chart Container -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <canvas id="attendanceChart" class="w-full h-96"></canvas>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let myChart = null;

        async function loadChart(type) {
            // Update Button Styles
            document.getElementById('btnDaily').className = type === 'daily' ? "px-4 py-2 bg-teal-600 text-white rounded-lg font-bold shadow-sm transition" : "px-4 py-2 bg-white text-gray-600 hover:bg-gray-100 rounded-lg font-bold shadow-sm transition";
            document.getElementById('btnMonthly').className = type === 'monthly' ? "px-4 py-2 bg-teal-600 text-white rounded-lg font-bold shadow-sm transition" : "px-4 py-2 bg-white text-gray-600 hover:bg-gray-100 rounded-lg font-bold shadow-sm transition";

            try {
                const res = await fetch(`sadigs_api_v3/get_attendance_stats.php?type=${type}`);
                const result = await res.json();

                if (result.success) {
                    renderChart(result.labels, result.data, type === 'daily' ? 'Jumlah Kehadiran Harian' : 'Jumlah Kehadiran Bulanan');
                }
            } catch (e) { console.error(e); alert('Gagal memuat data grafik.'); }
        }

        function renderChart(labels, data, label) {
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        backgroundColor: 'rgba(13, 148, 136, 0.6)', // Teal-600
                        borderColor: 'rgba(13, 148, 136, 1)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        }

        // Load default
        loadChart('daily');
    </script>
</body>
</html>
