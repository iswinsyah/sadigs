<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafik Rekap Ibadah | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center bg-teal-600 text-white font-bold text-xl tracking-wider">SADIGS</div>
            <div class="p-6">
                <button onclick="window.history.back()" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali
                </button>
                <a href="dashboard.html" class="flex items-center gap-2 mt-4 text-gray-600 hover:text-teal-600">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 lg:p-8 relative">
            <div class="max-w-5xl mx-auto">
                <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Grafik Rekap Ibadah Santri</h1>
                        <p class="text-gray-500 text-sm mt-1">Pemantauan visual tingkat kedisiplinan ibadah (Khusus Yayasan).</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="month" id="filterMonth" class="px-4 py-2 border border-gray-300 rounded-lg text-sm shadow-sm focus:ring-2 focus:ring-teal-500" onchange="loadChartData()">
                    </div>
                </header>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Chart Container -->
                    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center justify-center min-h-[400px]">
                        <div id="loading" class="text-gray-400 flex flex-col items-center"><i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-2"></i> Memuat Grafik...</div>
                        <canvas id="myPieChart" class="hidden w-full max-w-sm"></canvas>
                        <p id="emptyMsg" class="hidden text-gray-400 text-center py-10">Belum ada data laporan di bulan ini.</p>
                    </div>

                    <!-- Stats List -->
                    <div class="space-y-4">
                        <div class="bg-green-50 border border-green-200 p-5 rounded-xl shadow-sm">
                            <p class="text-sm font-bold text-green-600 uppercase">Shalat Jamaah</p>
                            <h3 class="text-3xl font-extrabold text-green-700 mt-1" id="statJamaah">0</h3>
                            <p class="text-xs text-green-600 mt-1 font-medium" id="pctJamaah">0% dari total</p>
                        </div>
                        <div class="bg-yellow-50 border border-yellow-200 p-5 rounded-xl shadow-sm">
                            <p class="text-sm font-bold text-yellow-600 uppercase">Shalat Sendiri</p>
                            <h3 class="text-3xl font-extrabold text-yellow-700 mt-1" id="statSendiri">0</h3>
                            <p class="text-xs text-yellow-600 mt-1 font-medium" id="pctSendiri">0% dari total</p>
                        </div>
                        <div class="bg-red-50 border border-red-200 p-5 rounded-xl shadow-sm">
                            <p class="text-sm font-bold text-red-600 uppercase">Bolong / Ditinggalkan</p>
                            <h3 class="text-3xl font-extrabold text-red-700 mt-1" id="statBolong">0</h3>
                            <p class="text-xs text-red-600 mt-1 font-medium" id="pctBolong">0% dari total</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('filterMonth').value = new Date().toISOString().slice(0, 7);
        let worshipChart = null;

        async function loadChartData() {
            const month = document.getElementById('filterMonth').value;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('myPieChart').classList.add('hidden');
            document.getElementById('emptyMsg').classList.add('hidden');

            try {
                const res = await fetch(`sadigs_api_v3/worship_chart_api.php?month=${month}`);
                const result = await res.json();

                document.getElementById('loading').classList.add('hidden');

                if (result.success && result.total > 0) {
                    document.getElementById('myPieChart').classList.remove('hidden');
                    
                    const data = result.data;
                    const total = result.total;
                    
                    document.getElementById('statJamaah').textContent = data.Jamaah;
                    document.getElementById('pctJamaah').textContent = ((data.Jamaah / total) * 100).toFixed(1) + '% dari total';
                    
                    document.getElementById('statSendiri').textContent = data.Sendiri;
                    document.getElementById('pctSendiri').textContent = ((data.Sendiri / total) * 100).toFixed(1) + '% dari total';
                    
                    document.getElementById('statBolong').textContent = data.Bolong;
                    document.getElementById('pctBolong').textContent = ((data.Bolong / total) * 100).toFixed(1) + '% dari total';

                    renderChart([data.Jamaah, data.Sendiri, data.Bolong, data.Haid]);
                } else {
                    document.getElementById('emptyMsg').classList.remove('hidden');
                    ['statJamaah','statSendiri','statBolong'].forEach(id => document.getElementById(id).textContent = '0');
                    ['pctJamaah','pctSendiri','pctBolong'].forEach(id => document.getElementById(id).textContent = '0%');
                }
            } catch (e) {
                document.getElementById('loading').innerHTML = '<span class="text-red-500">Gagal memuat data.</span>';
            }
        }

        function renderChart(dataArr) {
            const ctx = document.getElementById('myPieChart').getContext('2d');
            if (worshipChart) worshipChart.destroy();

            worshipChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Jamaah', 'Sendiri', 'Bolong', 'Haid/Udzur'],
                    datasets: [{
                        data: dataArr,
                        backgroundColor: ['#10B981', '#F59E0B', '#EF4444', '#EC4899'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { family: 'Inter', weight: 'bold' } } }
                    },
                    cutout: '65%'
                }
            });
        }

        loadChartData();
    </script>
</body>
</html>
