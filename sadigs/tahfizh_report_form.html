<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Laporan Tahfizh | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <aside class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-kedua text-white">
                <img src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" alt="Logo" class="h-9">
            </div>
            <div class="p-6">
                <a href="tahfizh_student_select.html" class="flex items-center gap-2 text-gray-600 hover:text-utama transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Pilih Santri
                </a>
            </div>
        </aside>
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Form Laporan Tahfizh</h2>
                <p id="studentNameHeader" class="text-gray-500 text-sm mt-1">Mengisi laporan untuk santri...</p>
            </header>
            <div class="max-w-3xl bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                <form id="reportForm" class="space-y-8">
                    <div>
                        <label for="report_date" class="block text-sm font-medium text-gray-700 mb-1">Tanggal Laporan</label>
                        <input type="date" id="report_date" name="report_date" class="w-full md:w-1/2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-utama outline-none">
                    </div>

                    <!-- Capaian Kuantitatif -->
                    <div class="border-t pt-6">
                        <h3 class="text-lg font-bold text-kedua mb-4">Capaian Setoran Baru</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Surat</label>
                                <input type="text" name="last_surah_name" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="An-Naba">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Ayat</label>
                                <input type="number" name="last_ayah_number" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="20">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Juz</label>
                                <input type="number" name="last_juz_number" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="30">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Halaman</label>
                                <input type="number" name="last_page_number" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="583">
                            </div>
                        </div>
                    </div>

                    <!-- Penilaian Kualitatif -->
                    <div class="border-t pt-6">
                        <h3 class="text-lg font-bold text-kedua mb-4">Penilaian Kualitatif</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Kelancaran (Fluency)</label>
                                <select name="fluency_grade" class="grade-dropdown w-full px-3 py-2 border border-gray-300 rounded-lg bg-white"></select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Tajwid & Makhraj</label>
                                <select name="tajwid_grade" class="grade-dropdown w-full px-3 py-2 border border-gray-300 rounded-lg bg-white"></select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Adab & Perilaku</label>
                                <select name="adab_grade" class="grade-dropdown w-full px-3 py-2 border border-gray-300 rounded-lg bg-white"></select>
                            </div>
                        </div>
                    </div>

                    <!-- Catatan Naratif -->
                    <div class="border-t pt-6">
                        <h3 class="text-lg font-bold text-kedua mb-4">Catatan Tambahan</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Laporan Muraja'ah (Pengulangan)</label>
                                <textarea name="murajaah_notes" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Contoh: Juz 30 lancar, Juz 29 perlu penguatan."></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Catatan Umum & Rekomendasi</label>
                                <textarea name="musyrif_notes" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Contoh: Ananda Fulan sangat bersemangat minggu ini. Perlu lebih fokus pada hukum bacaan Mad."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end pt-4">
                        <button type="submit" id="saveBtn" class="bg-utama hover:bg-kedua text-white font-bold py-3 px-8 rounded-lg transition shadow-md flex items-center gap-2">
                            <i data-lucide="save" class="w-5 h-5"></i> Simpan Laporan
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        const gradeOptions = `
            <option value="">- Pilih Nilai -</option>
            <option value="A">A (Mumtaz)</option>
            <option value="B">B (Jayyid)</option>
            <option value="C">C (Aslaha)</option>
            <option value="D">D ('Aadiy)</option>
        `;
        document.querySelectorAll('.grade-dropdown').forEach(select => select.innerHTML = gradeOptions);

        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student_id');
        const dateInput = document.getElementById('report_date');
        const form = document.getElementById('reportForm');

        async function initPage() {
            if (!studentId) {
                alert('ID Santri tidak ditemukan.');
                window.location.href = 'tahfizh_student_select.html';
                return;
            }
            
            // Ambil nama santri untuk header
            try {
                // Kita bisa buat API khusus, atau "curi" dari API lain.
                // Untuk efisiensi, kita ambil dari API get_musyrif_students
                const studentsRes = await fetch('sadigs_api_v3/get_musyrif_students.php');
                const studentsResult = await studentsRes.json();
                if(studentsResult.success) {
                    const student = studentsResult.data.find(s => s.user_id == studentId);
                    if(student) {
                        document.getElementById('studentNameHeader').textContent = `Mengisi laporan untuk: ${student.full_name || student.username}`;
                    }
                }
            } catch(e) { /* Biarkan default jika gagal */ }

            dateInput.value = new Date().toISOString().split('T')[0];
            loadReportData(dateInput.value);

            dateInput.addEventListener('change', () => {
                loadReportData(dateInput.value);
            });
        }

        async function loadReportData(date) {
            try {
                const res = await fetch(`sadigs_api_v3/tahfizh_report_api.php?student_id=${studentId}&date=${date}`);
                const result = await res.json();
                
                form.reset();
                dateInput.value = date;

                if (result.success && result.data) {
                    const data = result.data;
                    for (const key in data) {
                        const el = form.elements[key];
                        if (el) {
                           el.value = data[key];
                        }
                    }
                }
            } catch (e) {
                console.error("Gagal memuat data laporan:", e);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Menyimpan...';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.student_id = studentId; // Tambahkan student_id ke data

            try {
                const res = await fetch('sadigs_api_v3/tahfizh_report_api.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.message);
                if(!result.success) {
                    // Jika gagal, jangan reload, biarkan user perbaiki
                }
            } catch (error) {
                alert('Terjadi kesalahan koneksi.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        initPage();
    </script>
</body>
</html>
