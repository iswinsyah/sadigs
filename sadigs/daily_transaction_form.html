<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Transaksi Harian | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar"></nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Formulir Transaksi Harian</h2>
                <p class="text-gray-500 text-sm mt-1">Catat pemasukan dan pengeluaran operasional sekolah.</p>
            </header>

            <div class="max-w-2xl bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                <form id="transForm" class="space-y-6" enctype="multipart/form-data">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Transaksi</label>
                            <input type="date" name="transaction_date" id="tDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Transaksi</label>
                            <select name="type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white" required>
                                <option value="Pengeluaran">Pengeluaran (Keluar)</option>
                                <option value="Pemasukan">Pemasukan (Masuk)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Kategori / Pos Anggaran</label>
                        <input type="text" name="category" list="catList" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Contoh: ATK, Listrik, Konsumsi Rapat" required>
                        <datalist id="catList">
                            <option value="Belanja ATK">
                            <option value="Belanja Dapur/Konsumsi">
                            <option value="Listrik & Air">
                            <option value="Transportasi">
                            <option value="Honorarium">
                            <option value="Donasi Masuk">
                            <option value="Lain-lain">
                        </datalist>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Uraian / Keterangan</label>
                        <textarea name="description" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Detail transaksi..." required></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Jumlah Nominal (Rp)</label>
                        <input type="number" name="amount" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none font-bold text-lg" placeholder="0" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bukti / Nota (Opsional)</label>
                        <input type="file" name="proof_file" accept="image/*,application/pdf" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                    </div>

                    <div class="pt-4 border-t">
                        <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition shadow-md flex justify-center items-center gap-2">
                            <i data-lucide="save" class="w-5 h-5"></i> Simpan Transaksi
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('tDate').value = new Date().toISOString().split('T')[0];

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            if (!sessionData.roles.includes('Bendahara Sekolah')) {
                alert('Halaman ini khusus untuk Bendahara Sekolah.');
                window.location.href = 'dashboard.html';
                return;
            }

            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                renderSidebar(permData.success ? permData.permissions : []);
            } catch (e) { console.error(e); }
        }

        function renderSidebar(allowedMenus) {
            // (Sederhana: inject menu keuangan saja untuk demo)
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = `<div class="bg-gray-50 rounded-lg p-2 mt-2"><h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase">KEUANGAN</h3><a href="daily_transaction_form.html" class="flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="pen-tool" class="w-5 h-5"></i> Form Transaksi</a><a href="daily_transaction_list.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="book" class="w-5 h-5"></i> Buku Transaksi</a></div>`;
            lucide.createIcons();
        }

        document.getElementById('transForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerHTML = 'Menyimpan...';

            try {
                const res = await fetch('sadigs_api_v3/submit_daily_transaction.php', {
                    method: 'POST',
                    body: new FormData(e.target)
                });
                const result = await res.json();
                alert(result.message);
                if(result.success) window.location.href = 'daily_transaction_list.html';
            } catch (err) { alert('Gagal koneksi.'); }
            finally { btn.disabled = false; btn.innerHTML = '<i data-lucide="save" class="w-5 h-5 mr-2"></i> Simpan Transaksi'; lucide.createIcons(); }
        });

        initPage();
    </script>
</body>
</html>
