<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terbitkan Peraturan | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;}
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-2xl mx-auto p-4 lg:p-8">
        <div class="flex items-center gap-3 mb-6">
            <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
            <h1 class="text-2xl font-bold text-gray-800">Terbitkan Peraturan Baru</h1>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <form id="regForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Judul / Perihal</label>
                    <input type="text" name="title" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Kebijakan Libur Semester" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Ditujukan Kepada</label>
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-3 max-h-60 overflow-y-auto custom-scrollbar">
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Kepala Sekolah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Kepala Sekolah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Sekretaris Sekolah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Sekretaris Sekolah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Bendahara Sekolah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Bendahara Sekolah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Admin Sekolah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Admin Sekolah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Kepala Asrama Putra" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Kepala Asrama Putra</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Kepala Asrama Putri" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Kepala Asrama Putri</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Musyrif" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Musyrif</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Musyrifah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Musyrifah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Ustadz" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Ustadz</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Ustadzah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Ustadzah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Santri Rijal" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Santri Rijal</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Santri Nisa'" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Santri Nisa'</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Walisantri" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Walisantri</span>
                        </label>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Pilih satu atau lebih peran yang akan menerima amanah/peraturan ini.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Isi Peraturan / Pengumuman</label>
                    <textarea name="content" rows="6" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Tulis detail peraturan di sini..." required></textarea>
                </div>

                <div class="bg-yellow-50 p-3 rounded-lg text-sm text-yellow-800 flex gap-2">
                    <i data-lucide="info" class="w-5 h-5 flex-shrink-0"></i>
                    <p>Peraturan yang dibuat akan berstatus <strong>Pending</strong> dan tidak akan tampil sebelum divalidasi oleh Ketua Yayasan.</p>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md mt-4 flex justify-center items-center gap-2">
                    <i data-lucide="send" class="w-5 h-5"></i> Terbitkan Peraturan
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';

            const formData = new FormData(e.target);
            const roles = formData.getAll('target_role');

            if (roles.length === 0) {
                alert('Harap pilih setidaknya satu tujuan penerima.');
                btn.disabled = false;
                btn.innerHTML = originalText;
                return;
            }

            const data = {
                title: formData.get('title'),
                content: formData.get('content'),
                target_role: roles.join(', ') // Gabungkan array menjadi string koma
            };

            try {
                const res = await fetch('sadigs_api_v3/create_regulation.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) window.location.href = 'dashboard.html';
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
