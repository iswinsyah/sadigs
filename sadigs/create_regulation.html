<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terbitkan Peraturan | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50">
    <div class="max-w-2xl mx-auto p-4 lg:p-8">
        <div class="flex items-center gap-3 mb-6">
            <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
            <h1 class="text-2xl font-bold text-gray-800">Terbitkan Peraturan Baru</h1>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <form id="regForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Judul / Perihal</label>
                    <input type="text" name="title" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Kebijakan Libur Semester" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ditujukan Kepada</label>
                    <select name="target_role" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        <option value="Semua">Semua Warga Sekolah</option>
                        <option value="Musyrif">Musyrif & Musyrifah</option>
                        <option value="Walisantri">Walisantri</option>
                        <option value="Santri">Santri</option>
                        <option value="Ustadz">Ustadz & Ustadzah</option>
                        <option value="Pegawai">Semua Pegawai</option>
                    </select>
                    <p class="text-xs text-gray-500 mt-1">Peraturan hanya akan muncul di dashboard peran yang dipilih.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Isi Peraturan / Pengumuman</label>
                    <textarea name="content" rows="6" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Tulis detail peraturan di sini..." required></textarea>
                </div>

                <div class="bg-yellow-50 p-3 rounded-lg text-sm text-yellow-800 flex gap-2">
                    <i data-lucide="info" class="w-5 h-5 flex-shrink-0"></i>
                    <p>Peraturan yang dibuat akan berstatus <strong>Pending</strong> dan tidak akan tampil sebelum divalidasi oleh Ketua Yayasan.</p>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md mt-4 flex justify-center items-center gap-2">
                    <i data-lucide="send" class="w-5 h-5"></i> Terbitkan Peraturan
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('sadigs_api_v3/create_regulation.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) window.location.href = 'dashboard.html';
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
