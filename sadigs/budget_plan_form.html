<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Rencana Anggaran | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'utama': '#4FB7B3',
                        'kedua': '#26667F',
                        'tombol-utama': '#3674B5',
                        'tombol-kedua': '#F93827',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- HEADER MOBILE -->
    <div class="lg:hidden flex items-center gap-4 bg-kedua text-white p-4 shadow-md sticky top-0 z-50">
        <button id="mobileMenuBtn" class="focus:outline-none p-1 rounded hover:bg-kedua/80 transition">
            <i data-lucide="menu" class="w-7 h-7"></i>
        </button>
        <div class="font-bold text-xl flex items-center gap-2">
            <img src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" alt="Logo" class="h-8">
        </div>
    </div>

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR STANDAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col transition-transform transform -translate-x-full lg:translate-x-0 fixed lg:static h-full z-40 shadow-2xl lg:shadow-none">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-kedua text-white">
                <img src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" alt="Logo Villa Quran" class="h-9">
            </div>
            <div class="p-6 border-b border-gray-100 bg-utama/10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-utama/20 flex items-center justify-center text-kedua font-bold text-lg shadow-sm"><span id="userInitial">U</span></div>
                    <div class="overflow-hidden">
                        <p id="sidebarUsername" class="font-bold text-gray-800 text-sm truncate">Memuat...</p>
                        <p id="sidebarRole" class="text-xs text-gray-500 truncate font-medium">Role...</p>
                    </div>
                </div>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <div class="bg-gray-50 rounded-lg p-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">UMUM</h3>
                    <a id="navDashboard" href="dashboard.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-utama rounded-md transition font-medium text-sm"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
                    <a id="navProfil" href="profile.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-utama rounded-md transition font-medium text-sm"><i data-lucide="user" class="w-5 h-5"></i> Profil Saya</a>
                </div>
                <div id="groupKeuangan" class="hidden bg-gray-50 rounded-lg p-2 mt-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KEUANGAN</h3>
                    <a id="navFormAnggaran" href="budget_plan_form.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-utama rounded-md transition font-medium text-sm"><i data-lucide="file-plus" class="w-5 h-5"></i> Form Rencana Anggaran</a>
                    <a id="navValidasiAnggaran" href="budget_plan_validation.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-utama rounded-md transition font-medium text-sm"><i data-lucide="check-square" class="w-5 h-5"></i> Validasi Anggaran</a>
                    <a id="navRekapAnggaran" href="budget_plan_recap.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-utama rounded-md transition font-medium text-sm"><i data-lucide="clipboard-list" class="w-5 h-5"></i> Rekap Anggaran</a>
                    <a id="navRkas" href="rkas_table.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-utama rounded-md transition font-medium text-sm"><i data-lucide="archive" class="w-5 h-5"></i> Tabel RKAS</a>
                </div>
                <div class="pt-2">
                    <button id="logoutBtn" class="w-full flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition font-medium"><i data-lucide="log-out" class="w-5 h-5"></i> Keluar</button>
                </div>
            </nav>
        </aside>

        <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden lg:hidden backdrop-blur-sm"></div>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Formulir Rencana Anggaran</h2>
                <p class="text-gray-500 text-sm mt-1">Ajukan rencana anggaran operasional untuk periode mendatang.</p>
            </header>

            <div class="max-w-4xl bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                <form id="budgetForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                            <input type="text" id="usernameDisplay" class="w-full px-4 py-2 border border-gray-200 bg-gray-100 rounded-lg text-gray-500" readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Peran Pengaju</label>
                            <select name="role_sender" id="roleSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white appearance-none" required>
                                <option value="">- Pilih Peran -</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Kategori Anggaran</label>
                        <select name="category" id="category" class="w-full px-4 py-2 border border-gray-200 bg-gray-100 rounded-lg text-gray-500" required disabled>
                            <option value="Sekolah">Sekolah</option>
                            <option value="Asrama Putra">Asrama Putra</option>
                            <option value="Asrama Putri">Asrama Putri</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Periode</label>
                            <select name="period_type" id="periodType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-utama outline-none bg-white appearance-none" required>
                                <option value="">- Pilih Periode -</option>
                                <option value="Bulanan">Bulanan</option>
                                <option value="Semester">Semester</option>
                                <option value="Tahun Ajaran">Tahun Ajaran</option>
                            </select>
                        </div>
                        <div id="periodNameContainer" class="hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Periode</label>
                            <select name="period_name" id="periodName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-utama outline-none bg-white appearance-none">
                                <!-- Options populated by JS -->
                            </select>
                        </div>
                        <div id="yearContainer">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tahun</label>
                            <div id="singleYearInput">
                                <select name="year" id="yearSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-utama outline-none bg-white appearance-none"></select>
                            </div>
                            <div id="academicYearInput" class="hidden flex items-center gap-2">
                                <input type="number" id="yearStart" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="2024">
                                <span>/</span>
                                <input type="number" id="yearEnd" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="2025">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Rincian Anggaran</label>
                        <div class="overflow-x-auto border border-gray-200 rounded-lg">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-4 py-2 text-center text-xs font-bold text-gray-500 uppercase w-12">No</th>
                                        <th class="px-4 py-2 text-left text-xs font-bold text-gray-500 uppercase">Uraian</th>
                                        <th class="px-4 py-2 text-center text-xs font-bold text-gray-500 uppercase w-20">Jumlah</th>
                                        <th class="px-4 py-2 text-center text-xs font-bold text-gray-500 uppercase w-24">Satuan</th>
                                        <th class="px-4 py-2 text-right text-xs font-bold text-gray-500 uppercase w-32">Harga (Rp)</th>
                                        <th class="px-4 py-2 text-right text-xs font-bold text-gray-500 uppercase w-40">Total (Rp)</th>
                                    </tr>
                                </thead>
                                <tbody id="detailsBody" class="bg-white divide-y divide-gray-200">
                                    <!-- Rows generated by JS -->
                                </tbody>
                                <tfoot>
                                    <tr class="bg-gray-100 font-bold">
                                        <td colspan="5" class="px-4 py-2 text-right text-sm">Total</td>
                                        <td class="px-4 py-2 text-right text-sm" id="totalAmount">Rp 0</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                        <button type="button" onclick="addRow()" class="mt-2 text-sm text-teal-600 font-bold hover:underline">+ Tambah Baris</button>
                    </div>

                    <div class="pt-4 border-t">
                        <button type="submit" id="submitBtn" class="w-full bg-utama hover:bg-kedua text-white font-bold py-3 rounded-lg transition shadow-md flex justify-center items-center gap-2">
                            <i data-lucide="send" class="w-5 h-5"></i> Ajukan Rencana Anggaran
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // --- Global Variables ---
        let rowCount = 5;

        // --- UI Element References ---
        const periodType = document.getElementById('periodType');
        const periodNameContainer = document.getElementById('periodNameContainer');
        const periodName = document.getElementById('periodName');
        const singleYearInput = document.getElementById('singleYearInput');
        const academicYearInput = document.getElementById('academicYearInput');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const roleSelect = document.getElementById('roleSelect'); // Moved here to be global in script

        // --- Function Definitions ---

        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }

        function renderRows() {
            const tbody = document.getElementById('detailsBody');
            tbody.innerHTML = '';
            for (let i = 1; i <= rowCount; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-2 py-1 text-center text-sm text-gray-500">${i}</td>
                    <td class="px-2 py-1"><input type="text" class="w-full border-0 focus:ring-0 text-sm desc-input" placeholder="Uraian..."></td>
                    <td class="px-2 py-1"><input type="number" class="w-full border-0 focus:ring-0 text-sm text-center qty-input" placeholder="0" oninput="calcRowTotal(this)"></td>
                    <td class="px-2 py-1"><input type="text" class="w-full border-0 focus:ring-0 text-sm text-center unit-input" placeholder="Satuan"></td>
                    <td class="px-2 py-1"><input type="number" class="w-full border-0 focus:ring-0 text-sm text-right price-input" placeholder="0" oninput="calcRowTotal(this)"></td>
                    <td class="px-2 py-1"><input type="text" class="w-full border-0 focus:ring-0 text-sm text-right font-bold bg-gray-50 amount-input" placeholder="0" readonly></td>
                `;
                tbody.appendChild(tr);
            }
        }

        function addRow() {
            rowCount++;
            renderRows();
        }

        function calcRowTotal(el) {
            const row = el.closest('tr');
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const price = parseFloat(row.querySelector('.price-input').value) || 0;
            const total = qty * price;
            row.querySelector('.amount-input').value = total;
            calcTotal();
        }

        function calcTotal() {
            let total = 0;
            document.querySelectorAll('.amount-input').forEach(inp => total += Number(inp.value) || 0);
            document.getElementById('totalAmount').textContent = 'Rp ' + total.toLocaleString('id-ID');
        }

        function populateYears() {
            const currentYear = new Date().getFullYear();
            const yearSelect = document.getElementById('yearSelect');
            for (let i = currentYear - 1; i <= currentYear + 5; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.text = i;
                if (i === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }
        }

        function handlePeriodChange() {
            const val = periodType.value;
            periodNameContainer.classList.add('hidden');
            singleYearInput.classList.remove('hidden');
            academicYearInput.classList.add('hidden');
            periodName.innerHTML = '';

            if (val === 'Bulanan') {
                periodNameContainer.classList.remove('hidden');
                const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                months.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.text = m;
                    periodName.appendChild(opt);
                });
            } else if (val === 'Semester') {
                periodNameContainer.classList.remove('hidden');
                ['Ganjil', 'Genap'].forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.text = s;
                    periodName.appendChild(opt);
                });
            } else if (val === 'Tahun Ajaran') {
                singleYearInput.classList.add('hidden');
                academicYearInput.classList.remove('hidden');
            }
        }

        function setSubmitButtonState(isSubmitting) {
            const btn = document.getElementById('submitBtn');
            if (isSubmitting) {
                btn.disabled = true;
                btn.innerHTML = 'Mengirim...';
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i> Ajukan Rencana Anggaran';
                lucide.createIcons();
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            setSubmitButtonState(true);

            const details = [];
            const rows = document.getElementById('detailsBody').querySelectorAll('tr');
            rows.forEach(row => {
                const desc = row.querySelector('.desc-input').value;
                const qty = row.querySelector('.qty-input').value;
                const unit = row.querySelector('.unit-input').value;
                const price = row.querySelector('.price-input').value;
                const amt = row.querySelector('.amount-input').value;
                if (desc && amt) details.push({ description: desc, qty, unit, price, amount: amt });
            });

            if (details.length === 0) {
                alert('Isi minimal satu rincian.');
                setSubmitButtonState(false);
                return;
            }

            let yearVal = document.getElementById('yearSelect').value;
            if (periodType.value === 'Tahun Ajaran') {
                yearVal = document.getElementById('yearStart').value + '/' + document.getElementById('yearEnd').value;
            }

            const formData = new FormData(e.target);
            formData.set('year', yearVal); // Use set to overwrite if exists
            formData.append('details', JSON.stringify(details));

            try {
                const res = await fetch('sadigs_api_v3/submit_budget_plan.php', { method: 'POST', body: formData });
                const result = await res.json();
                alert(result.message);
                if (result.success) window.location.reload();
            } catch (err) {
                alert('Error koneksi');
            } finally {
                setSubmitButtonState(false);
            }
        }

        function renderSidebar(allowedMenus, sessionData) {
            document.getElementById('sidebarUsername').textContent = sessionData.username;
            document.getElementById('userInitial').textContent = sessionData.username.charAt(0).toUpperCase();
            const rawRoles = sessionData.raw_roles || [];
            document.getElementById('sidebarRole').textContent = rawRoles.map(r => r.status === 'approved' ? r.role_name : `${r.role_name} (Pending)`).join(', ') || 'User';

            const currentMenuEl = document.getElementById('navFormAnggaran');
            if (currentMenuEl) {
                currentMenuEl.classList.remove('text-gray-600', 'hover:bg-white', 'hover:text-utama', 'font-medium');
                currentMenuEl.classList.add('text-utama', 'bg-white', 'font-semibold', 'shadow-sm');
            }

            allowedMenus.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            });

            const menuGroups = ['groupKeuangan'];
            menuGroups.forEach(groupId => {
                const group = document.getElementById(groupId);
                if (group && group.querySelector('a:not(.hidden)')) {
                    group.classList.remove('hidden');
                }
            });
        }

        function updateCategoryBasedOnRole() {
            const categorySelect = document.getElementById('category');
            const selectedRole = roleSelect.value;
            const sekolahRoles = ['Kepala Sekolah', 'Sekretaris Sekolah', 'Bendahara Sekolah', 'Ustadz', 'Ustadzah'];
            const asramaPutraRoles = ['Kepala Asrama Putra', 'Musyrif'];
            const asramaPutriRoles = ['Kepala Asrama Putri', 'Musyrifah'];

            if (sekolahRoles.includes(selectedRole)) {
                categorySelect.value = 'Sekolah';
            } else if (asramaPutraRoles.includes(selectedRole)) {
                categorySelect.value = 'Asrama Putra';
            } else if (asramaPutriRoles.includes(selectedRole)) {
                categorySelect.value = 'Asrama Putri';
            }
        }

        async function initPage() {
            if (sidebar) sidebar.classList.add('-translate-x-full');
            if (sidebarOverlay) sidebarOverlay.classList.add('hidden');

            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
            const permData = await permRes.json();
            const allowedMenus = permData.success ? permData.permissions : [];

            if (!allowedMenus.includes('navFormAnggaran')) {
                alert('Akses Ditolak. Anda tidak memiliki izin untuk mengakses halaman ini.');
                window.location.href = 'dashboard.html';
                return;
            }

            document.getElementById('usernameDisplay').value = sessionData.username;
            sessionData.roles.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.text = r;
                roleSelect.appendChild(opt);
            });
            // FIX: Jika ada peran, pilih peran pertama secara default.
            if (sessionData.roles.length > 0) {
                roleSelect.value = sessionData.roles[0];
            }

            populateYears();
            renderRows();

            renderSidebar(allowedMenus, sessionData);

            // Set initial category and add listener
            updateCategoryBasedOnRole();
            roleSelect.addEventListener('change', updateCategoryBasedOnRole);

            periodType.addEventListener('change', handlePeriodChange);
            document.getElementById('budgetForm').addEventListener('submit', handleFormSubmit);
            mobileMenuBtn.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);
            document.getElementById('logoutBtn').addEventListener('click', () => {
                if (confirm('Apakah Anda yakin ingin keluar?')) {
                    window.location.href = 'sadigs_api_v3/logout.php';
                }
            });

            lucide.createIcons();
        }

        // --- Start Application ---
        initPage();
    </script>
</body>
</html>
