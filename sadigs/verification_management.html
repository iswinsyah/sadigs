<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Pengguna | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2">
                <!-- Menu akan dimuat oleh JS -->
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Verifikasi Pengguna Baru</h2>
                <p class="text-gray-500 text-sm mt-1">Setujui atau tolak pendaftaran akun baru sesuai kewenangan Anda.</p>
            </header>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left font-bold text-gray-500 uppercase">Nama / Username</th>
                                <th class="px-6 py-3 text-left font-bold text-gray-500 uppercase">Email</th>
                                <th class="px-6 py-3 text-left font-bold text-gray-500 uppercase">Peran yang Diajukan</th>
                                <th class="px-6 py-3 text-center font-bold text-gray-500 uppercase">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="4" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Render Sidebar Sederhana
        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = `
                <div class="bg-gray-50 rounded-lg p-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">MENU</h3>
                    <a href="verification_management.html" class="flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm">
                        <i data-lucide="user-check" class="w-5 h-5"></i> Verifikasi Pengguna
                    </a>
                </div>`;
            lucide.createIcons();
        }

        async function initPage() {
            // Cek Sesi
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            renderSidebar();
            loadData();
        }

        async function loadData() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>Memuat data...</td></tr>';
            lucide.createIcons();

            try {
                const res = await fetch('sadigs_api_v3/verification.php');
                const result = await res.json();
                
                if (result.success) {
                    if (result.pending_users.length > 0) {
                        tbody.innerHTML = '';
                        result.pending_users.forEach(user => {
                            const tr = document.createElement('tr');
                            tr.className = "hover:bg-gray-50 transition";
                            tr.innerHTML = `
                                <td class="px-6 py-4">
                                    <div class="font-bold text-gray-900">${user.username}</div>
                                </td>
                                <td class="px-6 py-4 text-gray-600">${user.email}</td>
                                <td class="px-6 py-4">
                                    <span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-bold border border-yellow-200">${user.roles}</span>
                                </td>
                                <td class="px-6 py-4 text-center space-x-2">
                                    <button onclick="processUser(${user.user_id}, 'activate')" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-green-700 transition shadow-sm">Setujui</button>
                                    <button onclick="processUser(${user.user_id}, 'reject')" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-700 transition shadow-sm">Tolak</button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-gray-500">Tidak ada pengguna baru yang perlu diverifikasi.</td></tr>';
                    }
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-10 text-center text-red-500">${result.message}</td></tr>`;
                }
            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-red-500">Gagal memuat data. Periksa koneksi server.</td></tr>';
            }
        }

        async function processUser(userId, action) {
            const actionText = action === 'activate' ? 'menyetujui' : 'menolak';
            if (!confirm(`Anda yakin ingin ${actionText} pengguna ini?`)) return;

            try {
                const res = await fetch('sadigs_api_v3/verification.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, action: action })
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) loadData();
            } catch (e) {
                alert('Terjadi kesalahan koneksi.');
            }
        }

        initPage();
    </script>
</body>
</html>
