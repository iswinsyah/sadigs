<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Pegawai | SADIGS 3.0</title>
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Styling Sidebar (Menggunakan Gaya Dashboard) */
        body { font-family: 'Inter', sans-serif; }
        .w-64 { width: 16rem; min-width: 16rem; }
        .bg-main { background-color: #4FB7B3; } 
        .menu-link { display: flex; padding: 0.75rem; border-radius: 0.5rem; cursor: pointer; transition: all 150ms ease-in-out; align-items: center; color: #1f2937; }
        .menu-link:hover { background-color: #e0fafa; color: #155e75; }
        .menu-link-active { background-color: #f0fafa; color: #155e75; font-weight: 600; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.3); border-radius: 3px; }
        
        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .w-64 { width: 100%; min-width: 100%; }
            .sidebar-desktop { display: none; }
            main { padding: 1.5rem; }
        }

        /* --- STYLING KHUSUS VERIFIKASI --- */
        .verification-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }
        .data-card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }
        .role-tag {
            display: inline-block;
            padding: 4px 8px;
            margin: 2px;
            border-radius: 4px;
            background-color: #ecfdf5; /* teal-50 */
            color: #0d9488; /* teal-600 */
            font-size: 0.8rem;
            font-weight: 600;
        }
        .btn-activate {
            background-color: #10b981; /* emerald-500 */
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-activate:hover {
            background-color: #059669; /* emerald-600 */
        }
        .message-box {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            display: none;
        }
        .error { background-color: #fef2f2; color: #ef4444; border: 1px solid #fecaca; }
        .success { background-color: #ecfdf5; color: #10b981; border: 1px solid #a7f3d0; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex">

    <!-- Sidebar Kiri (Desktop View) - Struktur Tailwind Dashboard -->
    <div class="w-64 bg-main shadow-2xl p-6 flex flex-col border-r border-gray-300 overflow-y-auto custom-scrollbar sidebar-desktop">
        
        <div class="text-2xl font-extrabold mb-8 text-white flex items-center">
            <img 
                src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" 
                alt="Logo Vila Quran" 
                class="w-8 h-8 rounded-full object-cover mr-3 shadow-md"
                onerror="this.onerror=null; this.src='https://placehold.co/32x32/14B8A6/ffffff?text=VQ'" 
            />
            SADIGS 3.0
        </div>
        
        <div class="text-sm text-white mb-4 border-b border-white/20 pb-4">
            <span class="font-normal block text-white/70">Selamat datang,</span>
            <span id="sidebar-username" class="font-semibold text-lg">Memuat...</span>
        </div>

        <div class="flex flex-col space-y-4 flex-1">
            
            <!-- Kategori 1: UMUM -->
            <div id="menu-group-umum" class="bg-white p-4 rounded-xl shadow-lg border border-gray-100">
                <h3 class="text-xs font-bold tracking-wider uppercase text-gray-500 pb-2 px-1 border-b mb-1">UMUM</h3>
                <div class="space-y-1">
                    <a href="dashboard.html" class="menu-link text-gray-800">
                         <svg class="w-5 h-5 mr-3 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                         <span>Dashboard Utama</span>
                    </a>
                </div>
            </div>
            
            <!-- Kategori 3: KHUSUS (PERAN DINAMIS) -->
            <div id="menu-group-peran" class="bg-white p-4 rounded-xl shadow-lg border border-gray-100">
                <h3 class="text-xs font-bold tracking-wider uppercase text-gray-500 pb-2 px-1 border-b mb-1">MENU PERAN KHUSUS</h3>
                <div id="dynamic-menu-links" class="space-y-1">
                    <!-- Link Kuota dan Verifikasi (Diisi oleh JS) -->
                    <a href="quota_management.html" class="menu-link text-gray-800">
                        <svg class="w-5 h-5 mr-3 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span>Atur Kuota Role</span>
                    </a>
                    <a href="verification_management.html" class="menu-link menu-link-active text-teal-700">
                        <svg class="w-5 h-5 mr-3 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.14-2.052-.403-3.016z"></path></svg>
                        <span>Verifikasi Pegawai</span>
                    </a>
                </div>
            </div>
            
        </div>

        <div class="mt-auto pt-6 border-t border-white/20">
            <button id="logout-btn" class="w-full p-3 bg-red-600 text-white font-semibold rounded-xl shadow-md transition duration-150 hover:bg-red-700 flex items-center justify-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Logout
            </button>
        </div>
    </div>

    <!-- Area Konten Utama -->
    <main id="main-content-area" class="flex-1 p-10 overflow-y-auto">
        <div class="verification-container">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Verifikasi Pendaftaran Pegawai</h1>
            <p class="text-gray-500 mb-8">Daftar akun pegawai baru (Kepala Sekolah, Ustadz, dll.) yang memerlukan persetujuan Yayasan.</p>

            <div id="msg-box" class="message-box success"></div>

            <div class="data-card">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Peran (Role)</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="pending-users-table" class="bg-white divide-y divide-gray-200">
                        <!-- Data will be inserted here -->
                        <tr>
                            <td colspan="4" class="px-6 py-4 text-center text-gray-500">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

<script>
    const API_BASE_URL = '/sadigs_api_v3/'; 
    
    document.addEventListener('DOMContentLoaded', () => {
        
        const usernameDisplay = document.getElementById('sidebar-username');
        const logoutButton = document.getElementById('logout-btn');
        const msgBox = document.getElementById('msg-box');
        const pendingUsersTable = document.getElementById('pending-users-table');
        
        const yayasanRoles = ['Ketua Yayasan', 'Sekretaris Yayasan', 'Bendahara Yayasan'];

        // =========================================================
        // 1. FUNGSI UTAMA: Cek Sesi dan Otorisasi
        // =========================================================

        async function checkSession() {
            const sessionApiUrl = `/sadigs_api_v3/session_check.php`;
            
            try {
                const response = await fetch(sessionApiUrl);
                const data = await response.json();

                if (data.success) {
                    usernameDisplay.textContent = data.username;
                    
                    const hasYayasanAccess = data.roles.some(role => yayasanRoles.includes(role));
                    
                    if (!hasYayasanAccess) {
                         // Redirect jika tidak punya otorisasi Yayasan
                        window.location.href = 'dashboard.html?auth=denied'; 
                        return;
                    }

                    fetchPendingUsers(); // Lanjutkan muat data jika otorisasi sukses
                    return;
                } else {
                    window.location.href = 'index.html'; 
                    return;
                }
            } catch (error) {
                console.error(`Session check failed:`, error);
                window.location.href = 'index.html';
                return;
            }
        }
        
        // =========================================================
        // 2. AMBIL DAFTAR PENDING
        // =========================================================
        async function fetchPendingUsers() {
            pendingUsersTable.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Memuat data...</td></tr>';
            msgBox.style.display = 'none';

            try {
                const response = await fetch(API_BASE_URL + 'verification.php');
                const data = await response.json();
                
                if (data.success) {
                    renderUsers(data.pending_users);
                } else {
                    displayStatus(data.message || 'Gagal memuat daftar verifikasi.', 'error');
                    pendingUsersTable.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-red-500">Error: Gagal memuat data verifikasi.</td></tr>';
                }

            } catch (error) {
                displayStatus(`Kesalahan koneksi: ${error.message}`, 'error');
                pendingUsersTable.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-red-500">Kesalahan Jaringan.</td></tr>';
            }
        }

        // 3. RENDER TABEL
        function renderUsers(users) {
            pendingUsersTable.innerHTML = '';
            if (users.length === 0) {
                pendingUsersTable.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500 font-semibold">Tidak ada akun pegawai yang perlu diverifikasi.</td></tr>';
                return;
            }

            users.forEach(user => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                
                // Pisahkan roles dan buat tag
                const rolesHtml = user.roles.split(', ').map(role => 
                    `<span class="role-tag">${role}</span>`
                ).join('');
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${user.username}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.email}</td>
                    <td class="px-6 py-4 text-sm text-gray-700">${rolesHtml}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-center">
                        <button class="btn-activate" data-user-id="${user.user_id}">
                            Aktifkan Akun
                        </button>
                    </td>
                `;
                pendingUsersTable.appendChild(row);
            });
            
            // Tambahkan event listener untuk tombol aktivasi
            document.querySelectorAll('.btn-activate').forEach(button => {
                button.addEventListener('click', handleActivate);
            });
        }
        
        // 4. HANDLE AKTIVASI
        async function handleActivate(e) {
            const button = e.target;
            const userId = button.dataset.userId;
            
            // Simpan state tombol
            const originalText = button.textContent;
            button.textContent = 'Memproses...';
            button.disabled = true;

            try {
                const response = await fetch(API_BASE_URL + 'verification.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId }),
                });

                const data = await response.json();

                if (data.success) {
                    displayStatus(`Akun ${userId} berhasil diaktifkan!`, 'success');
                    fetchPendingUsers(); // Muat ulang daftar
                } else {
                    displayStatus(data.message || 'Gagal mengaktifkan akun.', 'error');
                    button.textContent = originalText;
                    button.disabled = false;
                }
            } catch (error) {
                displayStatus('Kesalahan jaringan saat mengaktifkan akun.', 'error');
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        // 5. UTILITY DISPLAY
        function displayStatus(message, type) {
            msgBox.className = `message-box ${type}`;
            msgBox.textContent = message;
            msgBox.style.display = 'block';
            setTimeout(() => {
                msgBox.style.display = 'none';
            }, 5000);
        }

        // 6. Handle Logout Button
        if (logoutButton) {
            logoutButton.addEventListener('click', () => {
                window.location.href = API_BASE_URL + 'logout.php';
            });
        }

        checkSession(); 
    });
</script>
</body>
</html>
