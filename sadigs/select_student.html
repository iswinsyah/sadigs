<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Santri | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <!-- Div 4: KESANTRIAN -->
                <div id="groupSantri" class="bg-gray-50 rounded-lg p-2 mt-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KESANTRIAN</h3>
                    <a id="navMentoring" href="mentoring_groups.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="users-round" class="w-5 h-5"></i> Kelompok Mentoring</a>
                    <a id="navValidasiIbadah" href="daily_worship_validation.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="check-square" class="w-5 h-5"></i> Validasi Ibadah</a>
                </div>
            </nav>
        </aside>
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Pilih Data Santri</h2>
                <p class="text-gray-500 text-sm mt-1">Pilih putra/putri Anda yang datanya ingin Anda lihat atau perbarui.</p>
            </header>
            <div id="studentListContainer" class="max-w-2xl space-y-3">
                <!-- Daftar santri akan dimuat di sini -->
                <div class="text-center p-8 text-gray-500">Memuat data...</div>
            </div>
        </main>
    </div>
    <script>
        lucide.createIcons();
        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }
            if (!sessionData.roles.includes('Walisantri')) {
                alert('Halaman ini khusus untuk Walisantri.');
                window.location.href = 'dashboard.html';
                return;
            }
            loadChildren();
        }
        async function loadChildren() {
            const container = document.getElementById('studentListContainer');
            try {
                const res = await fetch('sadigs_api_v3/get_my_children.php');
                const result = await res.json();
                if (result.success && result.children.length > 0) {
                    container.innerHTML = '';
                    result.children.forEach(child => {
                        const card = document.createElement('a');
                        card.href = `student_data.html?id=${child.user_id}`;
                        card.className = 'flex items-center gap-4 p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md hover:border-teal-300 transition cursor-pointer';
                        card.innerHTML = `
                            <div class="w-12 h-12 rounded-full bg-teal-100 flex items-center justify-center">
                                <i data-lucide="user" class="w-6 h-6 text-teal-600"></i>
                            </div>
                            <div>
                                <p class="font-bold text-gray-800">${child.full_name || 'Nama Belum Diisi'}</p>
                                <p class="text-sm text-gray-500">Username: ${child.username}</p>
                            </div>
                            <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 ml-auto"></i>
                        `;
                        container.appendChild(card);
                    });
                    lucide.createIcons();
                } else {
                    container.innerHTML = `
                        <div class="text-center p-8 bg-white rounded-lg border border-gray-200">
                            <i data-lucide="search-x" class="w-12 h-12 text-gray-400 mx-auto mb-4"></i>
                            <h3 class="font-bold text-lg">Data Tidak Ditemukan</h3>
                            <p class="text-gray-500 mt-1">Tidak ada data santri yang terhubung dengan akun Anda. Pastikan username Anda sudah diisi di biodata putra/putri Anda.</p>
                        </div>
                    `;
                    lucide.createIcons();
                }
            } catch (e) {
                container.innerHTML = '<div class="text-center p-8 text-red-500">Gagal memuat data anak.</div>';
            }
        }
        initPage();
    </script>
</body>
</html>
