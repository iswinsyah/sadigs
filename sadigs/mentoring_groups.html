<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelompok Mentoring | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'utama': '#4FB7B3',
                        'kedua': '#26667F',
                        'tombol-utama': '#3674B5',
                        'tombol-kedua': '#F93827',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white text-gray-800 font-sans antialiased">

    <!-- HEADER MOBILE -->
    <div class="lg:hidden flex items-center gap-4 bg-kedua text-white p-4 shadow-md sticky top-0 z-50">
        <button id="mobileMenuBtn" class="focus:outline-none p-1 rounded hover:bg-kedua/80 transition"><i data-lucide="menu" class="w-7 h-7"></i></button>
        <div class="font-bold text-xl flex items-center gap-2">
            <img src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" alt="Logo" class="h-8">
        </div>
    </div>

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR (Placeholder, akan di-load via JS jika menggunakan komponen terpisah, tapi disini kita hardcode sesuai template) -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-kedua text-white">
                <img src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" alt="Logo" class="h-9">
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-utama transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-white p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Pembagian Kelompok Mentoring</h2>
                <p class="text-gray-500 text-sm mt-1">Daftar pembagian kelompok mentoring santri dan musyrif.</p>
            </header>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">No</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Nama Santri</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Musyrif Pembimbing</th>
                            </tr>
                        </thead>
                        <tbody id="mentoringTableBody" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="3" class="px-6 py-10 text-center text-gray-500">Memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Mobile Menu Logic
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }
        mobileMenuBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        let availableMusyrifs = [];
        let canEdit = false;

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            // FIX: Arahkan Walisantri langsung ke halaman pemilihan anak
            if (sessionData.roles.includes('Walisantri')) {
                const biodataLink = document.getElementById('navBiodataSantri');
                if (biodataLink) {
                    biodataLink.href = 'select_student.html';
                }
            }

            document.getElementById('sidebarUsername').textContent = sessionData.username;
            document.getElementById('userInitial').textContent = sessionData.username.charAt(0).toUpperCase();
            document.getElementById('sidebarRole').textContent = sessionData.roles[0] || 'User';

            // --- LOGIKA MENU DINAMIS (DATABASE) ---
            // Ini memastikan halaman ini hanya bisa diakses jika diizinkan di Manajemen Akses
            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                if (permData.success) {
                    const allowedMenus = permData.permissions || [];
                    
                    // 1. Cek Izin Halaman Ini
                    if (!allowedMenus.includes('navMentoring')) {
                        alert('Akses Ditolak. Anda tidak memiliki izin untuk mengakses fitur Kelompok Mentoring.');
                        window.location.href = 'dashboard.html';
                        return;
                    }

                    // 2. Tampilkan Menu Sidebar
                    allowedMenus.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.classList.remove('hidden');
                    });
                    if (document.querySelector('#menuYayasan a:not(.hidden)')) document.getElementById('menuYayasan').classList.remove('hidden');
                    if (document.querySelector('#groupKhusus a:not(.hidden)')) document.getElementById('groupKhusus').classList.remove('hidden');
                    if (document.querySelector('#groupSantri a:not(.hidden)')) document.getElementById('groupSantri').classList.remove('hidden');
                }
            } catch (e) { console.error("Gagal memuat izin menu:", e); }

            // Cek hak akses edit (Hanya Yayasan, Kepala Sekolah, Kepala Asrama)
            const editRoles = ['Ketua Yayasan', 'Kepala Sekolah', 'Kepala Asrama'];
            canEdit = sessionData.roles.some(r => editRoles.includes(r));

            if (canEdit) {
                await loadMusyrifs();
            }
            loadMentoringData();
        }

        async function loadMusyrifs() {
            try {
                const res = await fetch('sadigs_api_v3/get_musyrifs.php');
                const result = await res.json();
                if (result.success) {
                    availableMusyrifs = result.data;
                }
            } catch (e) { console.error("Gagal memuat musyrif", e); }
        }

        async function loadMentoringData() {
            const tbody = document.getElementById('mentoringTableBody');
            try {
                const res = await fetch('sadigs_api_v3/get_mentoring_groups.php');
                const result = await res.json();

                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach((row, index) => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition";
                        
                        // Render Dropdown jika punya akses edit, Text biasa jika tidak
                        let musyrifCellContent = '';
                        if (canEdit) {
                            let options = `<option value="">-- Pilih Musyrif --</option>`;
                            availableMusyrifs.forEach(m => {
                                const selected = (row.musyrif_id == m.user_id) ? 'selected' : '';
                                options += `<option value="${m.user_id}" ${selected}>${m.username} - ${m.full_name}</option>`;
                            });
                            
                            musyrifCellContent = `
                                <select onchange="assignMusyrif(${row.student_id}, this.value)" class="w-full px-3 py-1.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-utama outline-none bg-white">
                                    ${options}
                                </select>
                            `;
                        } else {
                            musyrifCellContent = row.musyrif_username 
                                ? `<span class="px-2 py-1 bg-blue-50 text-blue-700 rounded-md font-medium text-xs">${row.musyrif_username}</span>` 
                                : '<span class="text-gray-400 italic">Belum ditentukan</span>';
                        }

                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${index + 1}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                                <div class="font-bold text-gray-900">${row.student_name || '-'}</div>
                                <div class="text-xs text-gray-500">${row.student_username}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${musyrifCellContent}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-10 text-center text-gray-500">Belum ada data santri.</td></tr>';
                }
            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>';
            }
        }

        async function assignMusyrif(studentId, musyrifId) {
            if (!musyrifId) return; // Jangan proses jika memilih opsi kosong

            try {
                const res = await fetch('sadigs_api_v3/assign_mentor.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_id: studentId, musyrif_id: musyrifId })
                });
                const result = await res.json();
                
                if (result.success) {
                    // Opsional: Tampilkan notifikasi kecil (toast)
                    // alert('Berhasil disimpan'); 
                } else {
                    alert('Gagal menyimpan: ' + result.message);
                }
            } catch (e) {
                alert('Terjadi kesalahan koneksi.');
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm('Keluar aplikasi?')) window.location.href = 'sadigs_api_v3/logout.php';
        });

        initPage();
    </script>
</body>
</html>
