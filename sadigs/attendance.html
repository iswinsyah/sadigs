<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Absensi | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-teal-600 p-6 text-white text-center relative">
            <a href="dashboard.html" class="absolute left-4 top-6 p-1 hover:bg-teal-700 rounded-full transition"><i data-lucide="arrow-left" class="w-6 h-6"></i></a>
            <h1 class="text-xl font-bold tracking-wide">Absensi Pegawai</h1>
            <p class="text-teal-100 text-sm mt-1" id="currentDate">Memuat tanggal...</p>
        </div>

        <!-- Content -->
        <div class="flex-1 p-6 flex flex-col items-center justify-center space-y-8">
            
            <!-- Jam Digital -->
            <div class="text-center">
                <div id="clock" class="text-5xl font-extrabold text-gray-800 tracking-wider font-mono">00:00:00</div>
                <p class="text-gray-500 text-sm mt-2">Waktu Server</p>
            </div>

            <!-- Info Pegawai -->
            <div class="w-full text-center">
                <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">Nama Pegawai</p>
                <h2 id="employeeName" class="text-xl font-bold text-gray-800">Memuat...</h2>
            </div>

            <!-- Pilihan Kategori Absensi -->
            <div class="w-full">
                <label class="block text-sm font-bold text-gray-700 mb-1">Jenis Absensi</label>
                <select id="attendanceCategory" onchange="updateUI()" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none bg-white font-bold text-gray-700">
                    <option value="Absensi Harian">Absensi Harian Kerja</option>
                    <option value="Absensi Rapat">Absensi Rapat</option>
                </select>
            </div>

            <!-- Status Hari Ini -->
            <div id="statusContainer" class="w-full bg-gray-50 rounded-xl p-4 border border-gray-200 text-center">
                <p class="text-sm text-gray-500 mb-1">Status Kehadiran Anda</p>
                <h3 id="statusText" class="text-lg font-bold text-gray-800">Belum Absen</h3>
                <div class="flex justify-center gap-4 mt-3 text-sm">
                    <div class="bg-white px-3 py-1 rounded border border-gray-200 shadow-sm">
                        <span class="block text-xs text-gray-400">Masuk</span>
                        <span id="checkInTime" class="font-bold text-teal-600">--:--</span>
                    </div>
                    <div class="bg-white px-3 py-1 rounded border border-gray-200 shadow-sm">
                        <span class="block text-xs text-gray-400">Pulang</span>
                        <span id="checkOutTime" class="font-bold text-red-600">--:--</span>
                    </div>
                </div>
            </div>

            <!-- Form -->
            <form id="attendanceForm" class="w-full space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Catatan / Aktivitas (Opsional)</label>
                    <textarea name="notes" rows="2" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none text-sm" placeholder="Contoh: Mengajar kelas 10, Rapat guru..."></textarea>
                </div>
                
                <!-- Lokasi (Hidden) -->
                <input type="hidden" name="latitude" id="lat">
                <input type="hidden" name="longitude" id="long">
                <input type="hidden" name="address" id="address">

                <button type="submit" id="actionBtn" disabled class="w-full py-4 rounded-xl font-bold text-white text-lg shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2 bg-gray-400 cursor-not-allowed">
                    <i data-lucide="loader" class="w-6 h-6 animate-spin"></i> Memuat...
                </button>
            </form>

        </div>
    </div>

    <script>
        lucide.createIcons();

        // Jam & Tanggal
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID', {hour12: false});
            document.getElementById('currentDate').textContent = now.toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Load User Info
        fetch('sadigs_api_v3/session_check.php').then(r=>r.json()).then(d=>{
            if(d.success) {
                document.getElementById('employeeName').textContent = d.full_name || d.username;
            }
        });

        let todayData = []; // Menyimpan data absensi hari ini (array)

        // Geolocation
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async pos => {
                const lat = pos.coords.latitude;
                const long = pos.coords.longitude;
                document.getElementById('lat').value = lat;
                document.getElementById('long').value = long;

                // Reverse Geocoding (Ambil Alamat)
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${long}`);
                    const data = await response.json();
                    if(data.display_name) {
                        document.getElementById('address').value = data.display_name;
                        // Tampilkan info lokasi ke user
                        const statusContainer = document.getElementById('statusContainer');
                        const locInfo = document.createElement('p');
                        locInfo.className = "text-xs text-gray-500 mt-3 italic px-2";
                        locInfo.innerHTML = `<i data-lucide="map-pin" class="w-3 h-3 inline mr-1"></i> ${data.display_name}`;
                        statusContainer.appendChild(locInfo);
                        lucide.createIcons();
                    }
                } catch(e) { console.log("Gagal ambil alamat otomatis"); }
            }, err => console.log("Lokasi tidak diizinkan"));
        }

        // Load Status Hari Ini
        async function loadStatus() {
            try {
                const res = await fetch('sadigs_api_v3/get_today_status.php');
                const data = await res.json();
                
                if (data.success) {
                    todayData = data.data || [];
                    updateUI(); // Update tampilan berdasarkan kategori yang dipilih
                }
            } catch (e) { console.error(e); }
        }

        function updateUI() {
            const category = document.getElementById('attendanceCategory').value;
            const att = todayData.find(r => r.category === category); // Cari data sesuai kategori
            
            const btn = document.getElementById('actionBtn');
            const statusText = document.getElementById('statusText');
            const checkInEl = document.getElementById('checkInTime');
            const checkOutEl = document.getElementById('checkOutTime');
            const textArea = document.querySelector('textarea');

            // Reset Tampilan
            checkInEl.textContent = '--:--';
            checkOutEl.textContent = '--:--';
            textArea.disabled = false;

            if (!att) {
                // Belum Absen
                statusText.textContent = "Belum Absen (" + category + ")";
                statusText.className = "text-lg font-bold text-gray-500";
                btn.className = "w-full py-4 rounded-xl font-bold text-white text-lg shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2 bg-teal-600 hover:bg-teal-700";
                btn.innerHTML = `<i data-lucide="log-in" class="w-6 h-6"></i> ABSEN MASUK`;
                btn.disabled = false;
            } else {
                // Sudah Absen Masuk
                checkInEl.textContent = att.check_in_time.substring(0, 5);
                
                if (!att.check_out_time) {
                    // Belum Pulang
                    statusText.textContent = "Sudah Masuk (" + category + ")";
                    statusText.className = "text-lg font-bold text-teal-600";
                    btn.className = "w-full py-4 rounded-xl font-bold text-white text-lg shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700";
                    btn.innerHTML = `<i data-lucide="log-out" class="w-6 h-6"></i> ABSEN PULANG`;
                    btn.disabled = false;
                } else {
                    // Sudah Selesai
                    checkOutEl.textContent = att.check_out_time.substring(0, 5);
                    statusText.textContent = "Selesai (" + category + ")";
                    statusText.className = "text-lg font-bold text-green-600";
                    btn.className = "w-full py-4 rounded-xl font-bold text-white text-lg shadow-lg flex items-center justify-center gap-2 bg-green-500 cursor-default";
                    btn.innerHTML = `<i data-lucide="check-circle" class="w-6 h-6"></i> SUDAH LENGKAP`;
                    btn.disabled = true;
                    textArea.disabled = true;
                }
            }
            lucide.createIcons();
        }

        loadStatus();

        // Submit Form
        document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('actionBtn');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Memproses...';

            const formData = new FormData(e.target);
            formData.append('category', document.getElementById('attendanceCategory').value);

            try {
                const res = await fetch('sadigs_api_v3/submit_attendance.php', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) loadStatus();
            } catch (e) { alert('Gagal memproses absensi.'); }
            finally { btn.disabled = false; btn.innerHTML = originalContent; }
        });
    </script>
</body>
</html>
