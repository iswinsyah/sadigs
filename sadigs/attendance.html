<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Pegawai | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- HEADER MOBILE -->
    <div class="lg:hidden flex justify-between items-center bg-teal-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="font-bold text-xl flex items-center gap-2"><span>SADIGS 3.0</span></div>
        <button id="mobileMenuBtn" class="focus:outline-none p-1 rounded hover:bg-teal-700 transition"><i data-lucide="menu" class="w-7 h-7"></i></button>
    </div>

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col transition-transform transform -translate-x-full lg:translate-x-0 fixed lg:static h-full z-40 shadow-2xl lg:shadow-none">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6 border-b border-gray-100 bg-teal-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-teal-200 flex items-center justify-center text-teal-800 font-bold text-lg shadow-sm"><span id="userInitial">U</span></div>
                    <div class="overflow-hidden">
                        <p id="sidebarUsername" class="font-bold text-gray-800 text-sm truncate">Memuat...</p>
                        <p id="sidebarRole" class="text-xs text-gray-500 truncate font-medium">Role...</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                
                <!-- Div 1: UMUM -->
                <div class="bg-gray-50 rounded-lg p-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">UMUM</h3>
                    <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                    </a>
                    <a href="calendar_view.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm">
                        <i data-lucide="table" class="w-5 h-5"></i> Tabel Kalender
                    </a>
                    <a href="profile.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm">
                        <i data-lucide="user" class="w-5 h-5"></i> Profil Saya
                    </a>
                </div>

                <!-- Container untuk menu Yayasan -->
                <div id="menuYayasan" class="hidden space-y-2">
                    <!-- Div 2: KEPEGAWAIAN -->
                    <div class="bg-gray-50 rounded-lg p-2">
                        <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KEPEGAWAIAN</h3>
                        <a id="navAbsensi" href="attendance.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="map-pin" class="w-5 h-5"></i> Absensi Pegawai</a>
                        <a id="navRapat" href="meeting_invitation.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="mail" class="w-5 h-5"></i> Formulir Undang Rapat</a>
                    </div>

                    <!-- Div 3: KHUSUS -->
                    <div id="groupKhusus" class="hidden bg-gray-50 rounded-lg p-2">
                        <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KHUSUS</h3>
                        <a id="navVerifikasi" href="verification_management.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="users" class="w-5 h-5"></i> Verifikasi Pegawai</a>
                        <a id="navQuota" href="quota_management.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="user-cog" class="w-5 h-5"></i> Atur Kuota</a>
                        <a id="navCalendarSettings" href="calendar_settings.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="calendar-cog" class="w-5 h-5"></i> Atur Kalender</a>
                    </div>
                </div>
                
                <!-- Tombol Logout -->
                <div class="pt-2">
                    <button id="logoutBtn" class="w-full flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition font-medium"><i data-lucide="log-out" class="w-5 h-5"></i> Keluar</button>
                </div>
            </nav>
        </aside>
        <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden lg:hidden backdrop-blur-sm"></div>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative flex flex-col items-center justify-center min-h-screen lg:min-h-0">
            
            <div class="w-full max-w-md">
                <!-- Jam Realtime -->
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-black text-gray-800 tracking-tight" id="realtimeClock">00:00:00</h2>
                    <p class="text-gray-500 text-sm mt-1" id="currentDate">Senin, 1 Januari 2024</p>
                </div>

                <!-- Kartu Absensi -->
                <div class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-teal-600">
                    <h3 class="text-xl font-bold text-gray-800 mb-6 text-center">Formulir Absensi</h3>
                    
                    <form id="attendanceForm" class="space-y-5">
                        <!-- 1. Nama (Readonly) -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Pegawai</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i data-lucide="user" class="w-5 h-5 text-gray-400"></i>
                                </div>
                                <input type="text" id="formName" class="w-full pl-10 pr-4 py-2 border border-gray-200 bg-gray-100 rounded-lg text-gray-600 font-medium cursor-not-allowed" readonly value="Memuat...">
                            </div>
                        </div>

                        <!-- 2. Password -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi Password</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i data-lucide="lock" class="w-5 h-5 text-gray-400"></i>
                                </div>
                                <input type="password" id="formPassword" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none transition" placeholder="Masukkan password Anda" required>
                            </div>
                        </div>

                        <!-- 3. Jenis Absensi -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Absensi</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i data-lucide="list" class="w-5 h-5 text-gray-400"></i>
                                </div>
                                <select id="formCategory" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none transition bg-white appearance-none cursor-pointer">
                                    <option value="Absensi Harian">Absensi Harian</option>
                                    <option value="Absensi Rapat Pekanan">Absensi Rapat Pekanan</option>
                                    <option value="Absensi Rapat Khusus">Absensi Rapat Khusus</option>
                                </select>
                                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none"><i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i></div>
                            </div>
                        </div>

                        <!-- Lokasi (Otomatis) -->
                        <div class="bg-blue-50 p-3 rounded-lg flex items-start gap-3 text-sm text-blue-800">
                            <i data-lucide="map-pin" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
                            <div>
                                <p class="font-bold text-xs uppercase tracking-wide mb-1">Lokasi Terdeteksi:</p>
                                <p id="locationText" class="italic">Mencari lokasi...</p>
                            </div>
                        </div>

                        <!-- 3. Pilihan Absen -->
                        <div class="grid grid-cols-2 gap-4 pt-2">
                            <button type="button" onclick="submitAttendance('Masuk')" class="flex flex-col items-center justify-center p-4 border-2 border-teal-100 bg-teal-50 hover:bg-teal-100 hover:border-teal-300 rounded-xl transition group">
                                <div class="bg-teal-200 p-3 rounded-full mb-2 group-hover:scale-110 transition">
                                    <i data-lucide="log-in" class="w-6 h-6 text-teal-800"></i>
                                </div>
                                <span class="font-bold text-teal-800">Absen Masuk</span>
                            </button>

                            <button type="button" onclick="submitAttendance('Pulang')" class="flex flex-col items-center justify-center p-4 border-2 border-orange-100 bg-orange-50 hover:bg-orange-100 hover:border-orange-300 rounded-xl transition group">
                                <div class="bg-orange-200 p-3 rounded-full mb-2 group-hover:scale-110 transition">
                                    <i data-lucide="log-out" class="w-6 h-6 text-orange-800"></i>
                                </div>
                                <span class="font-bold text-orange-800">Absen Pulang</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Mobile Menu Logic
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }
        mobileMenuBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // --- JAM REALTIME ---
        function updateClock() {
            const now = new Date();
            document.getElementById('realtimeClock').textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':');
            document.getElementById('currentDate').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- GEOLOCATION ---
        let currentLat = null;
        let currentLng = null;
        let currentAddress = "Lokasi tidak ditemukan";

        function initLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    
                    // Reverse Geocoding (Optional: Menggunakan OpenStreetMap Nominatim)
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLng}`);
                        const data = await res.json();
                        currentAddress = data.display_name || `${currentLat}, ${currentLng}`;
                        document.getElementById('locationText').textContent = currentAddress;
                    } catch (e) {
                        currentAddress = `${currentLat}, ${currentLng}`;
                        document.getElementById('locationText').textContent = `Lat: ${currentLat}, Lng: ${currentLng}`;
                    }
                }, (error) => {
                    document.getElementById('locationText').textContent = "Gagal mendeteksi lokasi. Pastikan GPS aktif.";
                    document.getElementById('locationText').classList.add('text-red-600');
                });
            } else {
                document.getElementById('locationText').textContent = "Browser tidak mendukung Geolocation.";
            }
        }

        // --- INIT PAGE ---
        async function initPage() {
            try {
                const sessionRes = await fetch('sadigs_api_v3/session_check.php');
                const sessionData = await sessionRes.json();

                if (!sessionData.success) {
                    window.location.href = 'index.html';
                    return;
                }

                document.getElementById('sidebarUsername').textContent = sessionData.username;
                document.getElementById('userInitial').textContent = sessionData.username.charAt(0).toUpperCase();
                document.getElementById('sidebarRole').textContent = sessionData.roles[0] || 'User';
                document.getElementById('formName').value = sessionData.username; // Isi Nama Otomatis

                // Cek Peran Pegawai
                const pegawaiRoles = ['Kepala Sekolah', 'Kepala Asrama', 'Sekretaris Sekolah', 'Bendahara Sekolah', 'Musyrif', 'Ustadz'];
                const yayasanRoles = ['Ketua Yayasan', 'Sekretaris Yayasan', 'Bendahara Yayasan'];
                
                const isPegawai = sessionData.roles.some(r => pegawaiRoles.includes(r));
                const isYayasan = sessionData.roles.some(r => yayasanRoles.includes(r));

                if (!isPegawai) {
                    alert('Halaman ini khusus Pegawai.');
                    window.location.href = 'dashboard.html';
                    return;
                }

                // Tampilkan menu sesuai peran
                if (isYayasan || isPegawai) document.getElementById('menuYayasan').classList.remove('hidden');
                if (isYayasan) {
                    document.getElementById('navVerifikasi').classList.remove('hidden');
                    document.getElementById('navQuota').classList.remove('hidden');
                    document.getElementById('groupKhusus').classList.remove('hidden');
                }
                if (isPegawai) {
                    document.getElementById('navAbsensi').classList.remove('hidden');
                }
                // Menu Rapat
                const meetingRoles = ['Ketua Yayasan', 'Sekretaris Yayasan', 'Bendahara Yayasan', 'Kepala Sekolah', 'Kepala Asrama', 'Sekretaris Sekolah', 'Bendahara Sekolah', 'Musyrif', 'Ustadz'];
                if (sessionData.roles.some(r => meetingRoles.includes(r))) {
                    document.getElementById('navRapat').classList.remove('hidden');
                }

                // Mulai deteksi lokasi
                initLocation();

            } catch (error) {
                console.error(error);
            }
        }

        // --- SUBMIT ABSENSI ---
        window.submitAttendance = async function(type) {
            const password = document.getElementById('formPassword').value;
            const category = document.getElementById('formCategory').value;
            
            if (!password) {
                alert('Harap masukkan password untuk konfirmasi.');
                return;
            }
            if (!currentLat || !currentLng) {
                alert('Lokasi belum terdeteksi. Tunggu sebentar atau izinkan akses lokasi.');
                return;
            }

            if (!confirm(`Apakah Anda yakin ingin absen ${type} sekarang?`)) return;

            try {
                const res = await fetch('sadigs_api_v3/attendance.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        password: password,
                        type: type,
                        category: category,
                        latitude: currentLat,
                        longitude: currentLng,
                        address: currentAddress
                    })
                });
                const result = await res.json();

                if (result.success) {
                    alert(result.message);
                    document.getElementById('formPassword').value = ''; // Reset password
                } else {
                    alert('Gagal: ' + result.message);
                }
            } catch (error) {
                alert('Terjadi kesalahan koneksi.');
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm('Keluar aplikasi?')) window.location.href = 'sadigs_api_v3/logout.php';
        });

        initPage();
    </script>
</body>
</html>
