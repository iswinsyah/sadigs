<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Kurikulum | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-4xl mx-auto">
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-gray-800">Pengaturan Beban Mengajar (Kurikulum)</h1>
                    <p class="text-sm text-gray-500">Tentukan jumlah Jam Pelajaran (JP) per minggu untuk setiap mata pelajaran di setiap kelas.</p>
                </div>

                <!-- FORM TAMBAH -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
                    <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5 text-teal-600"></i> Tambah / Update Data</h3>
                    <div class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Kelas</label>
                            <select id="gradeInput" class="w-full p-2 border border-gray-300 rounded-lg bg-white">
                                <option value="7">Kelas 7</option>
                                <option value="8">Kelas 8</option>
                                <option value="9">Kelas 9</option>
                                <option value="10">Kelas 10</option>
                                <option value="11">Kelas 11</option>
                                <option value="12">Kelas 12</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1">Mata Pelajaran</label>
                            <select id="subjectInput" class="w-full p-2 border border-gray-300 rounded-lg bg-white">
                                <option value="">Pilih Mapel</option>
                                <option value="Al Quran">Al Quran</option>
                                <option value="Lughohtul Quran">Lughohtul Quran</option>
                                <option value="Syakhshiyah">Syakhshiyah</option>
                                <option value="Fiqh">Fiqh</option>
                                <option value="PKn">PKn</option>
                                <option value="Bahasa">Bahasa</option>
                                <option value="English">English</option>
                                <option value="Matematika">Matematika</option>
                                <option value="IPA">IPA</option>
                                <option value="Biologi">Biologi</option>
                                <option value="Fisika">Fisika</option>
                                <option value="Kimia">Kimia</option>
                                <option value="IPS">IPS</option>
                                <option value="Sejarah">Sejarah</option>
                                <option value="Ekonomi">Ekonomi</option>
                                <option value="Geografi">Geografi</option>
                                <option value="Sosiologi">Sosiologi</option>
                                <option value="Pend. Jasmani">Pend. Jasmani</option>
                                <option value="Kreator Konten">Kreator Konten</option>
                                <option value="Digital Enterpreneur">Digital Enterpreneur</option>
                                <option value="Mentoring">Mentoring</option>
                                <option value="Panahan">Panahan</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Jenis Mapel</label>
                            <select id="typeInput" class="w-full p-2 border border-gray-300 rounded-lg bg-white">
                                <option value="Diknas">Diknas</option>
                                <option value="Diniyah">Diniyah</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Metode</label>
                            <select id="methodInput" class="w-full p-2 border border-gray-300 rounded-lg bg-white">
                                <option value="Luring">Luring</option>
                                <option value="Daring">Daring</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">JP / Minggu</label>
                            <input type="number" id="hoursInput" class="w-full p-2 border border-gray-300 rounded-lg" placeholder="4">
                        </div>
                    </div>
                    <div class="mt-4 flex justify-end">
                        <button onclick="saveItem()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-sm">Simpan</button>
                    </div>
                </div>

                <!-- TABEL DATA -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Kelas</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Mata Pelajaran</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Jenis</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Metode</th>
                                <th class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">JP / Minggu</th>
                                <th class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="curriculumTableBody" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="6" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        async function loadData() {
            try {
                const res = await fetch('sadigs_api_v3/schedule_api.php?action=get_curriculum');
                const result = await res.json();
                
                const tbody = document.getElementById('curriculumTableBody');
                tbody.innerHTML = '';

                if(result.success && result.data.length > 0) {
                    result.data.forEach(item => {
                        const tr = document.createElement('tr');
                        const typeBadge = item.subject_type === 'Diniyah' 
                            ? '<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full font-bold">Diniyah</span>' 
                            : '<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full font-bold">Diknas</span>';
                        const methodBadge = item.method === 'Daring' 
                            ? '<span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded-full font-bold">Daring</span>' 
                            : '<span class="bg-gray-100 text-gray-800 text-xs px-2 py-1 rounded-full font-bold">Luring</span>';
                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap font-bold text-gray-700">Kelas ${item.grade}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-600">${item.subject}</td>
                            <td class="px-6 py-4 whitespace-nowrap">${typeBadge}</td>
                            <td class="px-6 py-4 whitespace-nowrap">${methodBadge}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-center font-bold text-blue-600">${item.hours_per_week} JP</td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">
                                <button onclick="deleteItem(${item.id})" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                    lucide.createIcons();
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-400 italic">Belum ada data kurikulum. Silakan tambah di atas.</td></tr>';
                }
            } catch(e) {
                console.error(e);
            }
        }

        async function saveItem() {
            const grade = document.getElementById('gradeInput').value;
            const subject = document.getElementById('subjectInput').value.trim();
            const subjectType = document.getElementById('typeInput').value;
            const method = document.getElementById('methodInput').value;
            const hours = document.getElementById('hoursInput').value;

            if(!subject || !hours) { alert("Mohon lengkapi data."); return; }

            try {
                const res = await fetch('sadigs_api_v3/schedule_api.php?action=save_curriculum_item', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ grade, subject, hours, subject_type: subjectType, method: method })
                });
                const result = await res.json();
                if(result.success) {
                    document.getElementById('subjectInput').value = ''; // Clear input
                    loadData();
                } else {
                    alert(result.message);
                }
            } catch(e) { alert("Gagal menyimpan."); }
        }

        async function deleteItem(id) {
            if(!confirm("Hapus data ini?")) return;
            try {
                const res = await fetch('sadigs_api_v3/schedule_api.php?action=delete_curriculum_item', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id })
                });
                loadData();
            } catch(e) { alert("Gagal menghapus."); }
        }

        loadData();
    </script>
</body>
</html>
