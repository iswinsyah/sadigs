<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Nilai Santri | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;}
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6 border-b border-gray-100 bg-teal-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-teal-200 flex items-center justify-center text-teal-800 font-bold text-lg shadow-sm"><span id="userInitial">U</span></div>
                    <div class="overflow-hidden">
                        <p id="sidebarUsername" class="font-bold text-gray-800 text-sm truncate">Memuat...</p>
                        <p id="sidebarRole" class="text-xs text-gray-500 truncate font-medium">Role...</p>
                    </div>
                </div>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <div class="p-4 text-center text-gray-400 text-sm">Memuat menu...</div>
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-2xl mx-auto">
        <div class="flex items-center gap-3 mb-6">
            <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
            <h1 class="text-2xl font-bold text-gray-800">Input Nilai Rapot</h1>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <form id="gradeForm" class="space-y-4">
                <!-- Pilih Santri -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Santri</label>
                    <select id="student_id" name="student_id" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        <option value="">Memuat daftar santri...</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tahun Ajaran</label>
                        <select name="academic_year" class="w-full p-2 border border-gray-300 rounded-lg">
                            <option value="2024/2025">2024/2025</option>
                            <option value="2025/2026">2025/2026</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Semester</label>
                        <select name="semester" class="w-full p-2 border border-gray-300 rounded-lg">
                            <option value="Ganjil">Ganjil</option>
                            <option value="Genap">Genap</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mata Pelajaran</label>
                    <input type="text" name="subject" list="subjects" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Tahfizh Al-Quran" required>
                    <datalist id="subjects">
                        <option value="Tahfizh Al-Quran">
                        <option value="Bahasa Arab">
                        <option value="Fiqih Ibadah">
                        <option value="Aqidah Akhlak">
                        <option value="Matematika">
                        <option value="Bahasa Inggris">
                    </datalist>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nilai (0-100)</label>
                        <input type="number" name="score" min="0" max="100" step="0.01" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Catatan (Opsional)</label>
                        <input type="text" name="notes" class="w-full p-2 border border-gray-300 rounded-lg" placeholder="Singkat & padat">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md mt-4 flex justify-center items-center gap-2">
                    <i data-lucide="save" class="w-5 h-5"></i> Simpan Nilai
                </button>
            </form>
        </div>
    </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // --- SIDEBAR LOGIC ---
        async function initSidebar() {
            try {
                const sessionRes = await fetch('sadigs_api_v3/session_check.php');
                const sessionData = await sessionRes.json();
                if (!sessionData.success) { window.location.href = 'index.html'; return; }

                document.getElementById('sidebarUsername').textContent = sessionData.username;
                document.getElementById('userInitial').textContent = sessionData.username.charAt(0).toUpperCase();
                const rawRoles = sessionData.raw_roles || [];
                let rolesText = 'User';
                if (rawRoles.length > 0) {
                    rolesText = rawRoles.map(r => r.status === 'approved' ? r.role_name : `${r.role_name} (Pending)`).join(', ');
                }
                document.getElementById('sidebarRole').textContent = rolesText;

                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                if (permData.success) {
                    const sidebarNav = document.getElementById('sidebarNav');
                    sidebarNav.innerHTML = '';
                    const allowedMenus = permData.permissions || [];
                    const categories = permData.categories || {};
                    const menuNames = permData.menu_names || {};
                    const menuIcons = permData.menu_icons || {};
                    const menuLinks = permData.menu_links || {};

                    for (const [catId, cat] of Object.entries(categories)) {
                        const visibleMenus = cat.menus.filter(mId => allowedMenus.includes(mId));
                        if (visibleMenus.length > 0) {
                            const groupDiv = document.createElement('div');
                            groupDiv.className = "bg-gray-50 rounded-lg p-2 mt-2";
                            const title = document.createElement('h3');
                            title.className = "px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider";
                            title.textContent = cat.label;
                            groupDiv.appendChild(title);
                            visibleMenus.forEach(menuId => {
                                if (menuId === 'navYayasanWidget' || menuId === 'navMusyrifWidget') return;
                                const link = document.createElement('a');
                                link.href = menuLinks[menuId] || '#';
                                const isActive = window.location.pathname.includes(link.href) && link.href !== '#';
                                link.className = isActive ? "flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm" : "flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm";
                                const iconName = menuIcons[menuId] || 'circle';
                                link.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5"></i> ${menuNames[menuId] || menuId}`;
                                groupDiv.appendChild(link);
                            });
                            sidebarNav.appendChild(groupDiv);
                        }
                    }
                    const logoutDiv = document.createElement('div');
                    logoutDiv.className = "pt-2";
                    logoutDiv.innerHTML = `<button onclick="if(confirm('Keluar aplikasi?')) window.location.href='sadigs_api_v3/logout.php'" class="w-full flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition font-medium"><i data-lucide="log-out" class="w-5 h-5"></i> Keluar</button>`;
                    sidebarNav.appendChild(logoutDiv);
                    lucide.createIcons();
                }
            } catch (e) { console.error(e); }
        }
        initSidebar();

        // Load Students (Binaan Musyrif)
        async function loadStudents() {
            try {
                // Gunakan API get_my_students.php yang sudah ada
                const res = await fetch('sadigs_api_v3/get_my_students.php');
                const result = await res.json();
                const select = document.getElementById('student_id');
                
                if (result.success && result.data.length > 0) {
                    select.innerHTML = '<option value="">-- Pilih Santri --</option>';
                    result.data.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.user_id;
                        opt.textContent = s.full_name;
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="">Tidak ada santri binaan</option>';
                }
            } catch (err) {
                console.error(err);
                alert('Gagal memuat data santri.');
            }
        }

        loadStudents();

        // Handle Submit
        document.getElementById('gradeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('sadigs_api_v3/save_student_grade.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) e.target.reset();
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
