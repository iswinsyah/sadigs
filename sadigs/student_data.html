<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Santri | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR (Akan diisi oleh JS yang sama dengan dashboard) -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Biodata Santri</h2>
                <p class="text-gray-500 text-sm mt-1">Lengkapi data diri untuk keperluan akademik dan pembagian kelas.</p>
            </header>

            <div class="max-w-3xl bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                <!-- PENTING: enctype diperlukan untuk upload file -->
                <form id="studentForm" class="space-y-6" enctype="multipart/form-data">
                    
                    <!-- UPLOAD DOKUMEN -->
                    <div class="border-b pb-6">
                        <h3 class="text-lg font-bold text-teal-800 mb-4 flex items-center gap-2"><i data-lucide="upload-cloud" class="w-5 h-5"></i> Upload Dokumen (Opsional)</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                            <!-- Foto Santri -->
                            <div class="flex flex-col items-center">
                                <label class="block text-sm font-medium text-gray-700 mb-2">1. Foto Santri (3x4)</label>
                                <img id="photo_preview" src="https://via.placeholder.com/150x200.png?text=Foto+Santri" alt="Preview Foto" class="w-32 h-40 object-cover rounded-lg shadow-md mb-2 bg-gray-100">
                                <input type="file" name="student_photo" accept="image/*" class="text-xs text-gray-600 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                            </div>
                            <!-- Dokumen Lain -->
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">2. Foto Kartu Keluarga</label>
                                    <div id="kk_status" class="flex items-center gap-2 text-sm text-gray-500"></div>
                                    <input type="file" name="kk_photo" accept="image/*,application/pdf" class="text-xs text-gray-600 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">3. Foto Akte Kelahiran</label>
                                    <div id="birth_cert_status" class="flex items-center gap-2 text-sm text-gray-500"></div>
                                    <input type="file" name="birth_cert_photo" accept="image/*,application/pdf" class="text-xs text-gray-600 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">4. Foto Ijazah Terakhir</label>
                                    <div id="ijazah_status" class="flex items-center gap-2 text-sm text-gray-500"></div>
                                    <input type="file" name="ijazah_photo" accept="image/*,application/pdf" class="text-xs text-gray-600 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 1. DATA DIRI SANTRI -->
                    <div class="border-b pb-4">
                        <h3 class="text-lg font-bold text-teal-800 mb-4 flex items-center gap-2"><i data-lucide="user" class="w-5 h-5"></i> Data Diri Santri</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- 1. Username -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">1. Username Santri</label>
                                <input type="text" name="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Username untuk login">
                            </div>
                            <!-- 2. Nama Lengkap -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">2. Nama Lengkap (Sesuai Ijazah)</label>
                                <input type="text" name="full_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
                            </div>
                            <!-- 3. Jenis Kelamin -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">3. Jenis Kelamin</label>
                                <select name="gender" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                                    <option value="Laki-laki">Laki-laki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                            <!-- 4. Tempat Lahir -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">4. Tempat Lahir</label>
                                <input type="text" name="birth_place" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 5. Tanggal Lahir -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">5. Tanggal Lahir</label>
                                <input type="date" name="birth_date" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 6. NIK -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">6. NIK (Sesuai KK)</label>
                                <input type="text" name="nik" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="16 digit angka">
                            </div>
                            <!-- 7. NISN -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">7. NISN</label>
                                <input type="text" name="nisn" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 9. No HP -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">8. No HP/WA Aktif Santri</label>
                                <input type="text" name="student_phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                        </div>
                        <div class="mt-4">
                            <!-- 10. Alamat -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">9. Alamat Tinggal (Domisili)</label>
                            <textarea name="address" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
                        </div>
                    </div>

                    <!-- 2. DATA SEKOLAH & KELUARGA -->
                    <div class="border-b pb-4">
                        <h3 class="text-lg font-bold text-teal-800 mb-4 flex items-center gap-2"><i data-lucide="school" class="w-5 h-5"></i> Data Sekolah & Keluarga</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- 11. Sekolah Asal -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">10. Sekolah Asal</label>
                                <input type="text" name="previous_school" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 12. Alamat Sekolah Asal -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">11. Alamat Sekolah Asal</label>
                                <input type="text" name="previous_school_address" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 13. Anak ke -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">12. Anak ke-</label>
                                <input type="number" name="child_order" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 14. Jml Saudara Kandung -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">13. Jml Saudara Kandung</label>
                                <input type="number" name="siblings_count" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 15. Jml Saudara Tiri -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">14. Jml Saudara Tiri</label>
                                <input type="number" name="step_siblings_count" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                        </div>
                        <div class="mt-4">
                            <!-- 16. Riwayat Penyakit -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">15. Riwayat Penyakit Berat</label>
                            <textarea name="medical_history" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Tulis '-' jika tidak ada"></textarea>
                        </div>
                    </div>

                    <!-- 3. DATA ORANG TUA (AYAH) -->
                    <div class="border-b pb-4">
                        <h3 class="text-lg font-bold text-teal-800 mb-4 flex items-center gap-2"><i data-lucide="user-check" class="w-5 h-5"></i> Data Ayah</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- 19. Nama Ayah -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">18. Nama Ayah</label>
                                <input type="text" name="father_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 20. No HP Ayah -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">19. No HP/WA Ayah</label>
                                <input type="text" name="father_phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 21. Pekerjaan Ayah -->
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">20. Pekerjaan Ayah</label>
                                <input type="text" name="father_job" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                        </div>
                        <div class="mt-4">
                            <!-- 22. Alamat Ayah -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">21. Alamat Ayah</label>
                            <textarea name="father_address" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
                        </div>
                    </div>

                    <!-- 4. DATA ORANG TUA (IBU) -->
                    <div class="border-b pb-4">
                        <h3 class="text-lg font-bold text-teal-800 mb-4 flex items-center gap-2"><i data-lucide="user-check" class="w-5 h-5"></i> Data Ibu</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- 23. Nama Ibu -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">22. Nama Ibu</label>
                                <input type="text" name="mother_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 24. No HP Ibu -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">23. No HP/WA Ibu</label>
                                <input type="text" name="mother_phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 25. Pekerjaan Ibu -->
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">24. Pekerjaan Ibu</label>
                                <input type="text" name="mother_job" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                        </div>
                        <div class="mt-4">
                            <!-- 26. Alamat Ibu -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">25. Alamat Ibu</label>
                            <textarea name="mother_address" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
                        </div>
                    </div>

                    <!-- 5. DATA WALISANTRI & PENANGGUNGJAWAB -->
                    <div>
                        <h3 class="text-lg font-bold text-teal-800 mb-4 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5"></i> Data Walisantri & Penanggungjawab</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                            <!-- 17. Penanggungjawab -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">16. Penanggungjawab Santri</label>
                                <select name="responsible_party" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                                    <option value="">- Pilih -</option>
                                    <option value="Ayah">Ayah</option>
                                    <option value="Ibu">Ibu</option>
                                    <option value="Wali">Wali</option>
                                </select>
                            </div>
                            <!-- 18. Username Wali -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">17. Username (Akun Wali)</label>
                                <input type="text" name="parent_username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Jika ada">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- 27. Nama Walisantri -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">26. Nama Walisantri</label>
                                <input type="text" name="parent_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 28. No HP Walisantri -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">27. No HP/WA Walisantri</label>
                                <input type="text" name="parent_phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <!-- 29. Pekerjaan Walisantri -->
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">28. Pekerjaan Walisantri</label>
                                <input type="text" name="guardian_job" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                        </div>
                        <div class="mt-4">
                            <!-- 30. Alamat Walisantri -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">29. Alamat Walisantri</label>
                            <textarea name="guardian_address" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
                        </div>
                    </div>

                    <div class="flex justify-end pt-4">
                        <button type="submit" id="saveBtn" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-lg transition shadow-md flex items-center gap-2">
                            <i data-lucide="save" class="w-5 h-5"></i> Simpan Biodata
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        async function initPage() {
            // Cek Sesi
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            // Load Data
            try {
                const res = await fetch('sadigs_api_v3/student_data.php');
                const result = await res.json();
                if (result.success && result.data) {
                    const d = result.data;
                    const form = document.getElementById('studentForm');
                    
                    // 1-10
                    if(d.username) form.querySelector('[name="username"]').value = d.username;
                    if(d.full_name) form.querySelector('[name="full_name"]').value = d.full_name;
                    if(d.gender) form.querySelector('[name="gender"]').value = d.gender;
                    if(d.birth_place) form.querySelector('[name="birth_place"]').value = d.birth_place;
                    if(d.birth_date) form.querySelector('[name="birth_date"]').value = d.birth_date;
                    if(d.nik) form.querySelector('[name="nik"]').value = d.nik;
                    if(d.nisn) form.querySelector('[name="nisn"]').value = d.nisn;
                    if(d.student_phone) form.querySelector('[name="student_phone"]').value = d.student_phone;
                    if(d.address) form.querySelector('[name="address"]').value = d.address;
                    
                    // 11-16
                    if(d.previous_school) form.querySelector('[name="previous_school"]').value = d.previous_school;
                    if(d.previous_school_address) form.querySelector('[name="previous_school_address"]').value = d.previous_school_address;
                    if(d.child_order) form.querySelector('[name="child_order"]').value = d.child_order;
                    if(d.siblings_count) form.querySelector('[name="siblings_count"]').value = d.siblings_count;
                    if(d.step_siblings_count) form.querySelector('[name="step_siblings_count"]').value = d.step_siblings_count;
                    if(d.medical_history) form.querySelector('[name="medical_history"]').value = d.medical_history;
                    
                    // 17-30
                    if(d.responsible_party) form.querySelector('[name="responsible_party"]').value = d.responsible_party;
                    if(d.parent_username) form.querySelector('[name="parent_username"]').value = d.parent_username;
                    if(d.father_name) form.querySelector('[name="father_name"]').value = d.father_name;
                    if(d.father_phone) form.querySelector('[name="father_phone"]').value = d.father_phone;
                    if(d.father_job) form.querySelector('[name="father_job"]').value = d.father_job;
                    if(d.father_address) form.querySelector('[name="father_address"]').value = d.father_address;
                    if(d.mother_name) form.querySelector('[name="mother_name"]').value = d.mother_name;
                    if(d.mother_phone) form.querySelector('[name="mother_phone"]').value = d.mother_phone;
                    if(d.mother_job) form.querySelector('[name="mother_job"]').value = d.mother_job;
                    if(d.mother_address) form.querySelector('[name="mother_address"]').value = d.mother_address;
                    if(d.parent_name) form.querySelector('[name="parent_name"]').value = d.parent_name;
                    if(d.parent_phone) form.querySelector('[name="parent_phone"]').value = d.parent_phone;
                    if(d.guardian_job) form.querySelector('[name="guardian_job"]').value = d.guardian_job;
                    if(d.guardian_address) form.querySelector('[name="guardian_address"]').value = d.guardian_address;

                    // Update UI untuk file yang sudah ada
                    if(d.student_photo_path) {
                        document.getElementById('photo_preview').src = d.student_photo_path + '?t=' + new Date().getTime(); // Cache busting
                    }
                    updateFileStatus('kk_status', d.kk_photo_path, 'Kartu Keluarga');
                    updateFileStatus('birth_cert_status', d.birth_cert_photo_path, 'Akte Kelahiran');
                    updateFileStatus('ijazah_status', d.ijazah_photo_path, 'Ijazah');
                }
            } catch (e) { console.error(e); }
        }

        // Helper untuk menampilkan status file
        function updateFileStatus(elementId, path, docName) {
            const el = document.getElementById(elementId);
            if (path) {
                el.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i> <a href="${path}" target="_blank" class="text-green-600 hover:underline">Sudah terupload. Lihat file.</a>`;
            } else {
                el.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4 text-gray-400"></i> Belum ada file.`;
            }
            lucide.createIcons();
        }

        // Preview foto santri saat dipilih
        document.querySelector('[name="student_photo"]').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => document.getElementById('photo_preview').src = event.target.result;
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Menyimpan...';

            // Gunakan FormData langsung karena ada file
            const formData = new FormData(e.target);

            try {
                const res = await fetch('sadigs_api_v3/student_data.php', {
                    method: 'POST',
                    // Hapus header Content-Type, browser akan set otomatis untuk FormData
                    body: formData
                });
                const result = await res.json();
                if (result.success) alert('Biodata berhasil disimpan!');
                else alert('Gagal: ' + result.message);
                window.location.reload(); // Reload halaman untuk lihat perubahan
            } catch (error) { alert('Terjadi kesalahan koneksi.'); }
            finally { btn.disabled = false; btn.innerHTML = originalText; }
        });

        initPage();
    </script>
</body>
</html>
