<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Pegawai | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <div class="bg-gray-50 rounded-lg p-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KEPEGAWAIAN</h3>
                    <a href="attendance.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="map-pin" class="w-5 h-5"></i> Absensi Pegawai</a>
                    <a href="employee_data.html" class="flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="file-badge" class="w-5 h-5"></i> Biodata Pegawai</a>
                </div>
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Biodata Pegawai</h2>
                <p class="text-gray-500 text-sm mt-1">Lengkapi data diri dan dokumen kepegawaian Anda.</p>
            </header>

            <form id="employeeForm" class="space-y-8" enctype="multipart/form-data">
                
                <!-- DATA PRIBADI -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2"><i data-lucide="user" class="w-5 h-5 text-teal-600"></i> Data Pribadi</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                            <input type="text" name="username" class="w-full px-4 py-2 border border-gray-200 bg-gray-100 rounded-lg text-gray-500 cursor-not-allowed" readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                            <input type="text" name="full_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">NIK (Sesuai KTP/KK)</label>
                            <input type="number" name="nik" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tempat Lahir</label>
                            <input type="text" name="birth_place" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Lahir</label>
                            <input type="date" name="birth_date" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Status Pernikahan</label>
                            <select name="marital_status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                                <option value="">- Pilih Status -</option>
                                <option value="Belum Menikah">Belum Menikah</option>
                                <option value="Menikah">Menikah</option>
                                <option value="Pernah Menikah">Pernah Menikah</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">No. HP / WhatsApp Aktif</label>
                            <input type="text" name="phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="08..." required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email Aktif</label>
                            <input type="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Rumah Tinggal</label>
                            <textarea name="address" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
                        </div>
                    </div>
                </div>

                <!-- PENDIDIKAN -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2"><i data-lucide="graduation-cap" class="w-5 h-5 text-teal-600"></i> Pendidikan Terakhir</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Jenjang Pendidikan</label>
                            <select name="last_education" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                                <option value="">- Pilih Jenjang -</option>
                                <option value="SMA/SMK/MA">SMA/SMK/MA</option>
                                <option value="D3">D3</option>
                                <option value="S1">S1</option>
                                <option value="S2">S2</option>
                                <option value="S3">S3</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tahun Lulus</label>
                            <input type="number" name="graduation_year" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Contoh: 2020">
                        </div>
                    </div>
                </div>

                <!-- MEDIA SOSIAL -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2"><i data-lucide="share-2" class="w-5 h-5 text-teal-600"></i> Media Sosial</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Instagram <span class="text-red-500">*</span></label>
                            <input type="url" name="instagram_url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="https://instagram.com/username" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tiktok <span class="text-red-500">*</span></label>
                            <input type="url" name="tiktok_url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="https://tiktok.com/@username" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Facebook (Opsional)</label>
                            <input type="url" name="facebook_url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="https://facebook.com/username">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Threads (Opsional)</label>
                            <input type="url" name="threads_url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="https://threads.net/@username">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Youtube (Opsional)</label>
                            <input type="url" name="youtube_url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="https://youtube.com/@channel">
                        </div>
                    </div>
                </div>

                <!-- DOKUMEN UPLOAD -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2"><i data-lucide="upload-cloud" class="w-5 h-5 text-teal-600"></i> Upload Dokumen</h3>
                    <p class="text-sm text-gray-500 mb-4">Format: JPG, PNG, atau PDF. Maksimal 2MB per file.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Helper Function untuk Input File -->
                        <div class="file-input-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Foto Surat Lamaran</label>
                            <input type="file" name="file_lamaran" accept=".jpg,.jpeg,.png,.pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                            <div id="preview_application_letter_path" class="mt-1 text-xs text-teal-600 font-medium"></div>
                        </div>

                        <div class="file-input-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Foto CV (Curriculum Vitae)</label>
                            <input type="file" name="file_cv" accept=".jpg,.jpeg,.png,.pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                            <div id="preview_cv_path" class="mt-1 text-xs text-teal-600 font-medium"></div>
                        </div>

                        <div class="file-input-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Foto Ijazah Legalisir</label>
                            <input type="file" name="file_ijazah" accept=".jpg,.jpeg,.png,.pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                            <div id="preview_ijazah_path" class="mt-1 text-xs text-teal-600 font-medium"></div>
                        </div>

                        <div class="file-input-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Foto Kartu Keluarga (KK)</label>
                            <input type="file" name="file_kk" accept=".jpg,.jpeg,.png,.pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                            <div id="preview_kk_path" class="mt-1 text-xs text-teal-600 font-medium"></div>
                        </div>

                        <div class="file-input-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Foto KTP</label>
                            <input type="file" name="file_ktp" accept=".jpg,.jpeg,.png,.pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                            <div id="preview_ktp_path" class="mt-1 text-xs text-teal-600 font-medium"></div>
                        </div>

                        <div class="file-input-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Sertifikat Keahlian (Opsional)</label>
                            <input type="file" name="file_sertifikat" accept=".jpg,.jpeg,.png,.pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                            <div id="preview_certificate_skill_path" class="mt-1 text-xs text-teal-600 font-medium"></div>
                        </div>

                        <div class="file-input-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Piagam Penghargaan (Opsional)</label>
                            <input type="file" name="file_piagam" accept=".jpg,.jpeg,.png,.pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                            <div id="preview_certificate_award_path" class="mt-1 text-xs text-teal-600 font-medium"></div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end pt-4">
                    <button type="button" id="editBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition shadow-md flex items-center gap-2">
                        <i data-lucide="edit" class="w-5 h-5"></i> Edit Data
                    </button>
                    <button type="button" id="cancelBtn" class="hidden ml-2 bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-lg transition shadow-md flex items-center gap-2">
                        <i data-lucide="x" class="w-5 h-5"></i> Batal
                    </button>
                    <button type="submit" id="saveBtn" class="hidden ml-2 bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-lg transition shadow-md flex items-center gap-2">
                        <i data-lucide="save" class="w-5 h-5"></i> Simpan Biodata
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script>
        lucide.createIcons();

        function setFormReadOnly(isReadOnly) {
            const form = document.getElementById('employeeForm');
            const inputs = form.querySelectorAll('input, select, textarea');
            
            inputs.forEach(input => {
                // Jangan disable username field karena sudah readonly
                if (input.name !== 'username') {
                    input.disabled = isReadOnly;
                }
            });

            document.getElementById('editBtn').classList.toggle('hidden', !isReadOnly);
            document.getElementById('cancelBtn').classList.toggle('hidden', isReadOnly);
            document.getElementById('saveBtn').classList.toggle('hidden', isReadOnly);
        }

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            // Otorisasi: Hanya Pegawai yang bisa akses
            const pegawaiRoles = ['Kepala Sekolah', 'Kepala Asrama', 'Sekretaris Sekolah', 'Bendahara Sekolah', 'Musyrif', 'Ustadz', 'Ketua Yayasan', 'Sekretaris Yayasan', 'Bendahara Yayasan'];
            if (!sessionData.roles.some(r => pegawaiRoles.includes(r))) {
                alert('Halaman ini khusus untuk Pegawai.');
                window.location.href = 'dashboard.html';
                return;
            }

            // Cek Izin Menu
            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                if (permData.success) {
                    const allowedMenus = permData.permissions || [];
                    allowedMenus.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.classList.remove('hidden');
                    });
                }
            } catch (e) { console.error(e); }

            loadData();
        }

        async function loadData() {
            try {
                const res = await fetch('sadigs_api_v3/employee_data.php');
                const result = await res.json();
                
                if (result.success && result.data) {
                    const d = result.data;
                    const form = document.getElementById('employeeForm');
                    
                    // Isi field text/select
                    const fields = ['username', 'full_name', 'nik', 'birth_place', 'birth_date', 'marital_status', 'phone', 'email', 'address', 'last_education', 'graduation_year', 'instagram_url', 'tiktok_url', 'facebook_url', 'threads_url', 'youtube_url'];
                    fields.forEach(f => {
                        if (form.elements[f]) form.elements[f].value = d[f] || '';
                    });

                    // Tampilkan status file yang sudah ada
                    const fileFields = ['application_letter_path', 'cv_path', 'ijazah_path', 'kk_path', 'ktp_path', 'certificate_skill_path', 'certificate_award_path'];
                    fileFields.forEach(f => {
                        if (d[f]) {
                            const previewDiv = document.getElementById('preview_' + f);
                            if (previewDiv) {
                                previewDiv.innerHTML = `<a href="sadigs_api_v3/${d[f]}" target="_blank" class="flex items-center gap-1 hover:underline"><i data-lucide="check-circle" class="w-3 h-3"></i> File tersimpan (Klik untuk lihat)</a>`;
                            }
                        }
                    });
                    lucide.createIcons();
                }
            } catch (e) { 
                console.error("Gagal memuat data", e); 
            } finally {
                setFormReadOnly(true); // Kunci form setelah data dimuat
            }
        }

        document.getElementById('employeeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Menyimpan...';

            const formData = new FormData(e.target);

            try {
                const res = await fetch('sadigs_api_v3/employee_data.php', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                alert(result.message);
                if(result.success) loadData(); // Reload untuk update status file
            } catch (error) { alert('Terjadi kesalahan koneksi.'); }
            finally { btn.disabled = false; btn.innerHTML = originalText; }
        });

        document.getElementById('editBtn').addEventListener('click', () => {
            setFormReadOnly(false);
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            if (confirm('Anda yakin ingin membatalkan perubahan? Data yang belum disimpan akan hilang.')) {
                window.location.reload();
            }
        });

        initPage();
    </script>
</body>
</html>
