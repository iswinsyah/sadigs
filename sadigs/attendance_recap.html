<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Absensi Pegawai | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;}
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6 border-b border-gray-100 bg-teal-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-teal-200 flex items-center justify-center text-teal-800 font-bold text-lg shadow-sm"><span id="userInitial">U</span></div>
                    <div class="overflow-hidden">
                        <p id="sidebarUsername" class="font-bold text-gray-800 text-sm truncate">Memuat...</p>
                        <p id="sidebarRole" class="text-xs text-gray-500 truncate font-medium">Role...</p>
                    </div>
                </div>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <div class="p-4 text-center text-gray-400 text-sm">Memuat menu...</div>
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-6xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
                        <div>
                            <h1 class="text-2xl font-bold text-gray-800">Tabel Rekap Absensi Pegawai</h1>
                            <p class="text-sm text-gray-500">Data kehadiran guru dan staf.</p>
                        </div>
                    </div>
                    <button onclick="window.print()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 flex items-center gap-2 text-sm font-medium shadow-sm">
                        <i data-lucide="printer" class="w-4 h-4"></i> Cetak
                    </button>
                </div>

                <!-- Filter -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 items-end">
                    <div class="flex-1 w-full">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Dari Tanggal</label>
                        <input type="date" id="startDate" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
                    </div>
                    <div class="flex-1 w-full">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Sampai Tanggal</label>
                        <input type="date" id="endDate" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
                    </div>
                    <button onclick="loadData()" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-lg font-bold text-sm shadow-md w-full md:w-auto">
                        Tampilkan
                    </button>
                </div>

                <!-- Tabel -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left font-bold text-gray-500 uppercase">Tanggal</th>
                                    <th class="px-6 py-3 text-left font-bold text-gray-500 uppercase">Nama Pegawai</th>
                                    <th class="px-6 py-3 text-center font-bold text-gray-500 uppercase">Jam Masuk</th>
                                    <th class="px-6 py-3 text-center font-bold text-gray-500 uppercase">Jam Pulang</th>
                                    <th class="px-6 py-3 text-center font-bold text-gray-500 uppercase">Status</th>
                                    <th class="px-6 py-3 text-center font-bold text-gray-500 uppercase">Lokasi</th>
                                    <th class="px-6 py-3 text-left font-bold text-gray-500 uppercase">Catatan</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                                <tr><td colspan="7" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Set default date (bulan ini)
        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        document.getElementById('startDate').valueAsDate = firstDay;
        document.getElementById('endDate').valueAsDate = today;

        async function initSidebar() {
            try {
                const sessionRes = await fetch('sadigs_api_v3/session_check.php');
                const sessionData = await sessionRes.json();
                if (!sessionData.success) { window.location.href = 'index.html'; return; }

                document.getElementById('sidebarUsername').textContent = sessionData.username;
                document.getElementById('userInitial').textContent = sessionData.username.charAt(0).toUpperCase();
                const rawRoles = sessionData.raw_roles || [];
                document.getElementById('sidebarRole').textContent = rawRoles.length > 0 ? rawRoles.map(r => r.role_name).join(', ') : 'User';

                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                // Render sidebar logic (simplified for brevity, same as other pages)
                // ... (Kode render sidebar sama seperti halaman lain) ...
            } catch (e) { console.error(e); }
        }
        initSidebar();

        async function loadData() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const tbody = document.getElementById('tableBody');
            
            tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-gray-500">Memuat...</td></tr>';

            try {
                const res = await fetch(`sadigs_api_v3/get_attendance_history.php?start_date=${start}&end_date=${end}`);
                const result = await res.json();

                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(row => {
                        // Logika Link Lokasi
                        const locationHtml = (row.location_lat && row.location_long) 
                            ? `<a href="https://www.google.com/maps?q=${row.location_lat},${row.location_long}" target="_blank" class="text-blue-600 hover:text-blue-800 flex items-center justify-center gap-1 text-xs font-bold transition"><i data-lucide="map-pin" class="w-3 h-3"></i> Cek Peta</a>`
                            : '<span class="text-gray-400 text-xs italic">Tidak ada lokasi</span>';

                        return `<tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${row.attendance_date}</td>
                            <td class="px-6 py-4 font-bold text-gray-800">${row.full_name}</td>
                            <td class="px-6 py-4 text-center text-green-600 font-mono">${row.check_in_time || '-'}</td>
                            <td class="px-6 py-4 text-center text-red-600 font-mono">${row.check_out_time || '-'}</td>
                            <td class="px-6 py-4 text-center"><span class="px-2 py-1 rounded-full text-xs font-bold ${row.status === 'Hadir' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${row.status}</span></td>
                            <td class="px-6 py-4 text-center">${locationHtml}</td>
                            <td class="px-6 py-4 text-sm text-gray-500">${row.notes || '-'}</td>
                        </tr>`;
                    }).join('');
                    lucide.createIcons(); // Render ikon baru
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-gray-500">Tidak ada data absensi pada periode ini.</td></tr>';
                }
            } catch (e) { tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>'; }
        }
        loadData();
    </script>
</body>
</html>
