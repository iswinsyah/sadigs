<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Kalender Pendidikan | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto p-4 lg:p-8">
        <div class="flex items-center gap-3 mb-6">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Atur Kalender Pendidikan</h1>
                    <p class="text-sm text-gray-500">Tata ulang kalender pendidikan dari awal.</p>
                </div>
            </div>
        </div>

        <!-- Konten akan ditambahkan di sini sesuai arahan selanjutnya -->
        <div id="calendar-container" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="p-3 text-left font-bold text-gray-600 w-12">No.</th>
                            <th class="p-3 text-left font-bold text-gray-600">Kegiatan</th>
                            <th class="p-3 text-left font-bold text-gray-600">Kode</th>
                            <th class="p-3 text-left font-bold text-gray-600">Mulai Tanggal</th>
                            <th class="p-3 text-left font-bold text-gray-600">Sampai Tanggal</th>
                        </tr>
                    </thead>
                    <tbody id="events-table-body" class="divide-y divide-gray-100">
                        <!-- Rows will be generated by JavaScript -->
                        <tr><td colspan="5" class="p-8 text-center text-gray-400">Memuat daftar kegiatan...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="p-4 bg-gray-50 border-t">
                <button id="saveButton" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition shadow-md flex items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    Simpan Kalender
                </button>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
        
        const calendarEvents = [
            { key: 'ahad_juli_1', name: 'Hari Ahad pekan pertama bulan Juli', code: 'A1J' },
            { key: 'kedatangan_santri_1', name: 'Kedatangan Santri (Awal Ganjil)', code: 'KDS' },
            { key: 'awal_semester_1', name: 'Awal Semester Ganjil', code: 'AS1' },
            { key: 'mos', name: 'Masa Orientasi Santri', code: 'MOS' },
            { key: 'uts_1', name: 'Ujian Tengah Semester Ganjil', code: 'UT1' },
            { key: 'uas_1', name: 'Ujian Akhir Semester Ganjil', code: 'UA1' },
            { key: 'pas_1', name: 'Penilaian Akhir Semester Ganjil', code: 'PA1' },
            { key: 'class_meeting_1', name: 'Pekan Prestasi (Class Meeting) Ganjil', code: 'PP1' },
            { key: 'terima_raport_1', name: 'Terima Raport & Penjemputan Ganjil', code: 'TR1' },
            { key: 'libur_semester_1', name: 'Libur Semester 1', code: 'LS1' },
            { key: 'kedatangan_santri_2', name: 'Kedatangan Santri (Awal Genap)', code: 'KDS' },
            { key: 'awal_semester_2', name: 'Awal Semester Genap', code: 'AS2' },
            { key: 'ldks', name: 'LDKS', code: 'LDK' },
            { key: 'uts_2', name: 'Ujian Tengah Semester Genap', code: 'UT2' },
            { key: 'uas_2', name: 'Ujian Akhir Semester Genap', code: 'UA2' },
            { key: 'pas_2', name: 'Penilaian Akhir Semester Genap', code: 'PA2' },
            { key: 'class_meeting_2', name: 'Pekan Prestasi (Class Meeting) Genap', code: 'PP2' },
            { key: 'terima_raport_2', name: 'Terima Raport & Penjemputan Genap', code: 'TR2' },
            { key: 'libur_semester_2', name: 'Libur Semester 2', code: 'LS2' },
            { key: 'hut_ri', name: 'HUT RI', code: '178' },
            { key: 'maulid_nabi', name: 'Maulid Nabi SAW', code: 'MLD' },
            { key: 'isra_miraj', name: 'Isro\' Mi\'roj', code: 'IMN' },
            { key: 'idul_fitri', name: 'Idul Fitri', code: 'IDF' },
            { key: 'idul_adha', name: 'Idul Adha', code: 'IDA' },
            { key: 'tahun_baru_hijriyah', name: 'Tahun Baru Hijriyah', code: 'TBH' },
            { key: 'libur_ramadhan', name: 'Libur Awal Ramadhan', code: 'LBR' },
            { key: 'libur_syawal', name: 'Libur Hari Raya', code: 'LBS' }
        ];

        const tableBody = document.getElementById('events-table-body');
        
        function renderTable() {
            tableBody.innerHTML = '';
            calendarEvents.forEach((event, index) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.dataset.eventKey = event.key;
                row.innerHTML = `
                    <td class="p-3">${index + 1}</td>
                    <td class="p-3 font-medium">${event.name}</td>
                    <td class="p-3">${event.code}</td>
                    <td class="p-3"><input type="date" name="start_date" class="p-1 border rounded-md w-full"></td>
                    <td class="p-3"><input type="date" name="end_date" class="p-1 border rounded-md w-full"></td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function loadData() {
            try {
                const res = await fetch('sadigs_api_v3/calendar_events_api.php');
                const result = await res.json();
                if (result.success && result.data) {
                    const data = result.data;
                    document.querySelectorAll('#events-table-body tr').forEach(row => {
                        const key = row.dataset.eventKey;
                        if (data[key]) {
                            row.querySelector('input[name="start_date"]').value = data[key].start_date || '';
                            row.querySelector('input[name="end_date"]').value = data[key].end_date || '';
                        }
                    });
                }
            } catch (err) {
                alert('Gagal memuat data kalender yang tersimpan.');
                console.error(err);
            }
        }

        async function saveData() {
            const saveButton = document.getElementById('saveButton');
            saveButton.disabled = true;
            saveButton.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyimpan...';
            lucide.createIcons();

            const eventsToSave = [];
            document.querySelectorAll('#events-table-body tr').forEach(row => {
                const key = row.dataset.eventKey;
                const start = row.querySelector('input[name="start_date"]').value;
                const end = row.querySelector('input[name="end_date"]').value;
                eventsToSave.push({ key, start, end });
            });

            try {
                const res = await fetch('sadigs_api_v3/calendar_events_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ events: eventsToSave })
                });
                const result = await res.json();
                alert(result.message);
            } catch (err) {
                alert('Gagal menyimpan data: ' + err.message);
            } finally {
                saveButton.disabled = false;
                saveButton.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Simpan Kalender';
                lucide.createIcons();
            }
        }

        document.getElementById('saveButton').addEventListener('click', saveData);

        // Initial load
        renderTable();
        loadData();
    </script>
</body>
</html>
