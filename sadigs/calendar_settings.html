<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Kalender Pendidikan | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;}
        /* Hide scrollbar for clean UI */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-[98%] mx-auto p-4 lg:p-6">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Atur Kalender Pendidikan</h1>
                    <p class="text-sm text-gray-500">Sesuaikan hari efektif dan libur untuk satu tahun ajaran.</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div>
                    <label for="academicYear" class="block text-xs font-medium text-gray-500">Tahun Ajaran</label>
                    <select id="academicYear" class="p-2.5 border border-gray-300 rounded-lg bg-white text-sm font-medium shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 mt-1" onchange="renderCalendar()">
                        <option value="2024/2025">Tahun Ajaran 2024/2025</option>
                        <option value="2025/2026">Tahun Ajaran 2025/2026</option>
                    </select>
                </div>
                <div>
                    <label for="firstSundayInput" class="block text-xs font-medium text-gray-500">Ahad Pertama di Bulan Juli (Acuan)</label>
                    <input type="date" id="firstSundayInput" class="p-2.5 border border-gray-300 rounded-lg bg-white text-sm font-medium shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 mt-1" onchange="renderCalendar()">
                </div>
                <button onclick="saveCalendar()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium transition shadow-sm flex items-center gap-2 self-end">
                    <i data-lucide="save" class="w-4 h-4"></i> Simpan Perubahan
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-700 border-b border-gray-200">
                            <th class="p-3 text-left font-bold sticky left-0 bg-gray-50 z-20 border-r border-gray-200 min-w-[150px]">Bulan</th>
                            <!-- JS will populate 1-31 -->
                        </tr>
                    </thead>
                    <tbody id="calendarBody" class="divide-y divide-gray-100">
                        <!-- JS will populate rows -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-4 flex flex-wrap gap-x-6 gap-y-2 text-sm text-gray-500">
            <div class="flex items-center gap-2"><div class="w-4 h-4 bg-gray-200 rounded border"></div> Tanggal Tidak Ada</div>
            <div class="flex items-center gap-2"><div class="w-4 h-4 bg-white rounded border"></div> Hari Efektif</div>
            <div class="flex items-center gap-2"><div class="w-4 h-4 bg-red-50 rounded border border-red-200"></div> Hari Ahad</div>
            <div class="flex items-center gap-2"><div class="w-4 h-4 bg-red-50 rounded border border-red-100"></div> Hari Libur (Contoh)</div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const months = [
            { id: 7, name: 'Juli' }, { id: 8, name: 'Agustus' }, { id: 9, name: 'September' },
            { id: 10, name: 'Oktober' }, { id: 11, name: 'November' }, { id: 12, name: 'Desember' },
            { id: 1, name: 'Januari' }, { id: 2, name: 'Februari' }, { id: 3, name: 'Maret' },
            { id: 4, name: 'April' }, { id: 5, name: 'Mei' }, { id: 6, name: 'Juni' }
        ];

        function getDaysInMonth(month, year) {
            // Trik JS: Tanggal '0' di bulan berikutnya adalah tanggal terakhir bulan sebelumnya.
            // Contoh: new Date(2024, 2, 0) akan mengambil tanggal terakhir bulan Februari (Index 1).
            return new Date(year, month, 0).getDate();
        }

        function findFirstSundayOfJuly(year) {
            for (let day = 1; day <= 7; day++) {
                // Bulan 6 adalah Juli di object Date JavaScript (0-indexed)
                const date = new Date(year, 6, day);
                if (date.getDay() === 0) { // 0 adalah hari Minggu
                    return date;
                }
            }
            return null; // Seharusnya tidak pernah terjadi
        }

        function renderCalendar() {
            const academicYear = document.getElementById('academicYear').value;
            const [startYear, endYear] = academicYear.split('/').map(Number);
            
            const firstSundayInput = document.getElementById('firstSundayInput');
            if (!firstSundayInput.value) {
                const firstSunday = findFirstSundayOfJuly(startYear);
                if(firstSunday) firstSundayInput.value = firstSunday.toISOString().split('T')[0];
            }

            const firstSundayRef = firstSundayInput.value ? new Date(firstSundayInput.value + 'T00:00:00') : null;

            // 1. Render Headers (1-31)
            const theadRow = document.querySelector('thead tr');
            theadRow.innerHTML = '<th class="p-3 text-left font-bold sticky left-0 bg-gray-50 z-20 border-r border-gray-200 min-w-[150px] shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">Bulan</th>';
            
            for (let i = 1; i <= 31; i++) {
                theadRow.innerHTML += `<th class="p-2 text-center font-semibold text-gray-600 min-w-[40px] border-l border-gray-100">${i}</th>`;
            }

            // 2. Render Body Rows
            const tbody = document.getElementById('calendarBody');
            tbody.innerHTML = '';

            months.forEach((m) => {
                // Tentukan tahun untuk bulan ini (Juli-Des = startYear, Jan-Jun = endYear)
                const currentYear = (m.id >= 7) ? startYear : endYear;
                const daysInMonth = getDaysInMonth(m.id, currentYear);
                
                let rowHtml = `<tr class="hover:bg-gray-50 transition-colors group">
                    <td class="p-3 font-medium text-gray-800 sticky left-0 bg-white group-hover:bg-gray-50 z-10 border-r border-gray-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
                        ${m.name} <span class="text-gray-400 text-xs ml-1">${currentYear}</span>
                    </td>`;
                
                for (let d = 1; d <= 31; d++) {
                    const isValidDate = d <= daysInMonth;
                    let isSundayBasedOnRef = false;

                    if (isValidDate && firstSundayRef) {
                        // Bulan di JS Date object adalah 0-indexed
                        const cellDate = new Date(currentYear, m.id - 1, d);
                        const diffTime = cellDate.getTime() - firstSundayRef.getTime();
                        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                        if (diffDays % 7 === 0) {
                            isSundayBasedOnRef = true;
                        }
                    }
                    
                    if (isValidDate) {
                        // Sel Aktif (Tanggal Valid)
                        rowHtml += `<td class="p-0 border-l border-gray-100 relative ${isSundayBasedOnRef ? 'bg-red-50' : ''}">
                            <input type="text" 
                                class="w-full h-10 text-center text-xs focus:bg-blue-50 focus:ring-2 focus:ring-inset focus:ring-blue-500 outline-none transition-all bg-transparent text-gray-700 font-medium"
                                data-month="${m.id}" 
                                data-day="${d}"
                                data-year="${currentYear}"
                                placeholder="">
                        </td>`;
                    } else {
                        // Sel Mati (Tanggal Tidak Valid: 30 Feb, 31 Apr, dll)
                        rowHtml += `<td class="p-0 border-l border-gray-100 bg-gray-200 cursor-not-allowed relative">
                            <div class="w-full h-10 flex items-center justify-center text-gray-300 select-none">
                                <span class="text-[10px]">•</span>
                            </div>
                        </td>`;
                    }
                }
                rowHtml += '</tr>';
                tbody.innerHTML += rowHtml;
            });
        }

        function saveCalendar() {
            alert('Konfigurasi kalender akan disimpan (Fitur Backend belum terhubung di snippet ini).');
        }

        // Initial Render
        renderCalendar();
    </script>
</body>
</html>
