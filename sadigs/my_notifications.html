<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi Saya | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-3xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800">Kotak Masuk Notifikasi</h1>
                    <button onclick="markAllRead()" class="text-sm text-teal-600 hover:underline font-medium">Tandai semua dibaca</button>
                </div>
                
                <div id="notifList" class="space-y-4">
                    <div class="text-center py-10 text-gray-500">Memuat notifikasi...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Cek Sesi
        fetch('sadigs_api_v3/session_check.php').then(r=>r.json()).then(d=>{
            if(!d.success) window.location.href = 'index.html';
            loadNotifs();
        });

        async function loadNotifs() {
            try {
                const res = await fetch('sadigs_api_v3/notifications_api.php?action=get_my');
                const result = await res.json();
                const container = document.getElementById('notifList');
                
                if (result.success && result.data.length > 0) {
                    container.innerHTML = result.data.map(n => `
                        <div class="bg-white p-5 rounded-xl shadow-sm border ${n.is_read == 0 ? 'border-teal-200 bg-teal-50' : 'border-gray-200'} relative group transition hover:shadow-md">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-gray-800 ${n.is_read == 0 ? 'text-teal-800' : ''}">${n.title}</h3>
                                    <p class="text-xs text-gray-500 mt-1">${new Date(n.created_at).toLocaleString('id-ID')}</p>
                                </div>
                                ${n.is_read == 0 ? '<span class="w-3 h-3 bg-teal-500 rounded-full"></span>' : ''}
                            </div>
                            <p class="text-sm text-gray-700 mt-3 leading-relaxed">${n.message.replace(/\n/g, '<br>')}</p>
                            
                            <div class="mt-4 flex gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
                                ${n.is_read == 0 ? `<button onclick="markRead(${n.id})" class="text-xs text-teal-600 font-bold hover:underline">Tandai Dibaca</button>` : ''}
                                <button onclick="deleteNotif(${n.id})" class="text-xs text-red-500 font-bold hover:underline">Hapus</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<div class="text-center py-10 text-gray-400 flex flex-col items-center">
                        <i data-lucide="bell-off" class="w-12 h-12 mb-2"></i>
                        <p>Tidak ada notifikasi.</p>
                    </div>`;
                    lucide.createIcons();
                }
            } catch (e) { console.error(e); }
        }

        async function markRead(id) {
            await fetch('sadigs_api_v3/notifications_api.php?action=mark_read', {
                method: 'POST', body: JSON.stringify({id})
            });
            loadNotifs();
        }

        async function markAllRead() {
            if(!confirm('Tandai semua sebagai sudah dibaca?')) return;
            await fetch('sadigs_api_v3/notifications_api.php?action=mark_read', {
                method: 'POST', body: JSON.stringify({})
            });
            loadNotifs();
        }

        async function deleteNotif(id) {
            if(!confirm('Hapus pesan ini?')) return;
            await fetch('sadigs_api_v3/notifications_api.php?action=delete', {
                method: 'POST', body: JSON.stringify({id})
            });
            loadNotifs();
        }
    </script>
</body>
</html>
