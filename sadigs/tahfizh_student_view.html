<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Tahfidz Anak | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-6xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Laporan Tahfidz Anak</h1>
                        <p class="text-sm text-gray-500">Pantau perkembangan hafalan Al-Quran putra/putri Anda.</p>
                    </div>
                </div>

                <!-- Statistik Ringkas (Opsional, bisa dikembangkan nanti) -->
                
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-teal-50">
                                <tr>
                                    <th class="px-6 py-3 text-left font-bold text-teal-800 uppercase">Tanggal</th>
                                    <th class="px-6 py-3 text-left font-bold text-teal-800 uppercase">Nama Santri</th>
                                    <th class="px-6 py-3 text-left font-bold text-teal-800 uppercase">Jenis</th>
                                    <th class="px-6 py-3 text-left font-bold text-teal-800 uppercase">Hafalan</th>
                                    <th class="px-6 py-3 text-center font-bold text-teal-800 uppercase">Nilai</th>
                                    <th class="px-6 py-3 text-left font-bold text-teal-800 uppercase">Catatan</th>
                                </tr>
                            </thead>
                            <tbody id="reportTableBody" class="bg-white divide-y divide-gray-200">
                                <tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Cek Sesi & Load Data
        fetch('sadigs_api_v3/session_check.php').then(r=>r.json()).then(d=>{
            if(!d.success) window.location.href = 'index.html';
            loadReports();
        });

        async function loadReports() {
            const tbody = document.getElementById('reportTableBody');
            try {
                // Menggunakan action=get_history yang sudah ada di API, 
                // yang otomatis mendeteksi role Walisantri dan mengambil data anak-anaknya.
                const res = await fetch('sadigs_api_v3/tahfizh_report_api.php?action=get_history');
                const result = await res.json();
                
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition";
                        
                        // Format Tanggal
                        const date = new Date(row.report_date).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                        
                        // Badge Jenis
                        const typeBadge = row.type === 'Ziyadah' 
                            ? '<span class="bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-bold">Ziyadah</span>'
                            : '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-xs font-bold">Muraja\'ah</span>';

                        // Format Hafalan
                        let hafalan = `<span class="font-bold text-gray-700">${row.surah}</span>`;
                        if (row.ayat) hafalan += `<br><span class="text-xs text-gray-500">Ayat: ${row.ayat}</span>`;
                        
                        // Badge Nilai
                        let qualityColor = 'bg-gray-100 text-gray-800';
                        if (row.quality === 'Mumtaz') qualityColor = 'bg-teal-100 text-teal-800';
                        else if (row.quality === 'Jayyid Jiddan') qualityColor = 'bg-blue-100 text-blue-800';
                        else if (row.quality === 'Jayyid') qualityColor = 'bg-yellow-100 text-yellow-800';
                        else if (row.quality === 'Maqbul') qualityColor = 'bg-red-100 text-red-800';

                        const qualityBadge = `<span class="${qualityColor} px-2 py-1 rounded-full text-xs font-bold">${row.quality}</span>`;

                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${date}</td>
                            <td class="px-6 py-4 whitespace-nowrap font-bold text-gray-800">${row.student_name}</td>
                            <td class="px-6 py-4 whitespace-nowrap">${typeBadge}</td>
                            <td class="px-6 py-4 whitespace-nowrap">${hafalan}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">${qualityBadge}</td>
                            <td class="px-6 py-4 text-sm text-gray-600 italic max-w-xs truncate">${row.notes || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    let msg = 'Belum ada laporan tahfidz.';
                    if (result.message && result.message.includes('Belum ada data anak')) {
                        msg = 'Akun Anda belum terhubung dengan data santri.<br>Mohon hubungi Admin untuk mengisi <b>Username Walisantri</b> di Biodata Santri.';
                    }
                    tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">${msg}</td></tr>`;
                }
            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>';
            }
        }
    </script>
</body>
</html>
