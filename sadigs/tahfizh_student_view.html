<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Tahfizh Saya | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <!-- Sidebar content will be loaded by JS -->
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Laporan Tahfizh Saya</h2>
                <p class="text-gray-500 text-sm mt-1">Rekapitulasi perkembangan hafalan Al-Qur'an Anda.</p>
            </header>

            <!-- Progress Bar Section -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
                <h3 class="text-lg font-bold text-gray-800 mb-2">Progres Hafalan Saat Ini</h3>
                <div class="flex items-center gap-4">
                    <div class="flex-grow bg-gray-200 rounded-full h-4">
                        <div id="progressBar" class="bg-teal-500 h-4 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <div class="font-bold text-teal-600 text-lg w-24 text-right" id="progressText">0%</div>
                </div>
                <p id="progressSubtext" class="text-sm text-gray-500 mt-2">Memuat progres...</p>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Tanggal</th>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Setoran Baru</th>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Penilaian</th>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Catatan Musyrif</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="4" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        function renderSidebar(allowedMenus = []) {
            const sidebarNav = document.getElementById('sidebarNav');
            sidebarNav.innerHTML = `
                <div class="bg-gray-50 rounded-lg p-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">UMUM</h3>
                    <a id="navDashboard" href="dashboard.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
                    <a id="navProfil" href="profile.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="user" class="w-5 h-5"></i> Profil Saya</a>
                </div>
                <div id="groupKesantrian" class="hidden bg-gray-50 rounded-lg p-2 mt-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KESANTRIAN</h3>
                    <a id="navBiodataSantri" href="student_data.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="book-user" class="w-5 h-5"></i> Biodata Santri</a>
                    <a id="navIbadahHarian" href="daily_worship_form.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="notebook-pen" class="w-5 h-5"></i> Laporan Ibadah Harian</a>
                    <a id="navViewTahfizh" href="tahfizh_student_view.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="book-open-check" class="w-5 h-5"></i> Laporan Tahfizh</a>
                </div>
            `;
            
            allowedMenus.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            });

            if (document.querySelector('#groupKesantrian a:not(.hidden)')) {
                document.getElementById('groupKesantrian').classList.remove('hidden');
            }
            lucide.createIcons();
        }

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                const allowedMenus = permData.success ? permData.permissions : [];

                if (!allowedMenus.includes('navViewTahfizh')) {
                    alert('Anda tidak memiliki izin untuk mengakses halaman ini.');
                    window.location.href = 'dashboard.html';
                    return;
                }
                renderSidebar(allowedMenus);
            } catch (e) { 
                alert('Gagal memuat izin akses. Silakan coba lagi.');
                window.location.href = 'dashboard.html';
            }

            loadData();
        }

        async function loadData() {
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>';
            try {
                const res = await fetch('sadigs_api_v3/get_my_tahfizh_reports.php');
                const result = await res.json();
                
                // Handle Progress Bar
                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');
                const progressSubtext = document.getElementById('progressSubtext');

                if (result.success && result.summary && result.summary.last_juz_number) {
                    const lastJuz = parseInt(result.summary.last_juz_number);
                    const percentage = Math.min(100, (lastJuz / 30) * 100);
                    progressBar.style.width = percentage + '%';
                    progressText.textContent = Math.round(percentage) + '%';
                    progressSubtext.textContent = `Capaian terakhir pada Juz ${lastJuz} dari 30 Juz.`;
                } else {
                    progressSubtext.textContent = 'Belum ada data capaian Juz yang tercatat.';
                }

                // Handle Table
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50";
                        
                        const setoranBaru = row.last_surah_name ? `${row.last_surah_name}: ${row.last_ayah_number}` : '-';
                        const penilaian = `
                            <div class="text-xs">Lancar: <b>${row.fluency_grade || '-'}</b></div>
                            <div class="text-xs">Tajwid: <b>${row.tajwid_grade || '-'}</b></div>
                            <div class="text-xs">Adab: <b>${row.adab_grade || '-'}</b></div>
                        `;

                        tr.innerHTML = `
                            <td class="px-4 py-3 align-top font-bold">${row.report_date}</td>
                            <td class="px-4 py-3 align-top">${setoranBaru}</td>
                            <td class="px-4 py-3 align-top">${penilaian}</td>
                            <td class="px-4 py-3 align-top text-gray-600 text-xs max-w-xs">${row.musyrif_notes || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-gray-500">Belum ada laporan tahfizh yang diisi oleh Musyrif.</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>';
            }
        }

        initPage();
    </script>
</body>
</html>
