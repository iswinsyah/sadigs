<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi Peraturan | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50">
    <div class="max-w-3xl mx-auto p-4 lg:p-8">
        <div class="flex items-center gap-3 mb-6">
            <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
            <h1 class="text-2xl font-bold text-gray-800">Validasi Peraturan</h1>
        </div>

        <div id="listContainer" class="space-y-4">
            <!-- Data akan dimuat di sini -->
            <div class="text-center py-10 text-gray-500">Memuat data...</div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function loadData() {
            try {
                const res = await fetch('sadigs_api_v3/get_regulations.php?action=list_pending');
                const result = await res.json();
                const container = document.getElementById('listContainer');
                container.innerHTML = '';

                if (result.success && result.data.length > 0) {
                    result.data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'bg-white p-6 rounded-xl shadow-sm border border-gray-100';
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">Untuk: ${item.target_role}</span>
                                    <h3 class="text-lg font-bold text-gray-800 mt-1">${item.title}</h3>
                                    <p class="text-xs text-gray-500">Oleh: ${item.creator_name} • ${item.created_at}</p>
                                </div>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-lg text-gray-700 text-sm mb-4 whitespace-pre-wrap">${item.content}</div>
                            <div class="flex gap-3 justify-end">
                                <button onclick="process(${item.id}, 'reject')" class="px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 font-medium transition">Tolak</button>
                                <button onclick="process(${item.id}, 'approve')" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold transition shadow">Setujui & Terbitkan</button>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `
                        <div class="text-center py-12 bg-white rounded-xl border border-gray-100">
                            <div class="bg-green-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="check" class="w-8 h-8 text-green-600"></i>
                            </div>
                            <h3 class="text-lg font-bold text-gray-800">Semua Bersih!</h3>
                            <p class="text-gray-500">Tidak ada peraturan yang menunggu validasi.</p>
                        </div>`;
                    lucide.createIcons();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('listContainer').innerHTML = '<p class="text-red-500 text-center">Gagal memuat data.</p>';
            }
        }

        async function process(id, action) {
            if (!confirm(`Yakin ingin ${action === 'approve' ? 'menyetujui' : 'menolak'} peraturan ini?`)) return;

            try {
                const res = await fetch('sadigs_api_v3/validate_regulation.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, action })
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) loadData();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        loadData();
    </script>
</body>
</html>
