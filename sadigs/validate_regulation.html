<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi Amanah Staf - Ketua Yayasan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #26667F; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fff; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .meta { font-size: 0.85rem; color: #666; margin-bottom: 10px; display: flex; justify-content: space-between; background: #f8f9fa; padding: 8px; border-radius: 5px; }
        
        .content-area { margin: 15px 0; }
        .field-label { font-weight: bold; font-size: 0.8rem; color: #26667F; display: block; margin-bottom: 3px; }
        
        /* Tampilan Mode Baca */
        .view-mode h3 { margin: 0 0 10px 0; color: #333; }
        .view-mode p { white-space: pre-wrap; line-height: 1.6; background: #fafafa; padding: 10px; border-radius: 5px; border-left: 4px solid #26667F; }
        
        /* Tampilan Mode Edit */
        .edit-mode { display: none; background: #fffbe6; padding: 15px; border: 1px solid #ffe58f; border-radius: 8px; }
        .edit-mode input, .edit-mode textarea, .edit-mode select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; box-sizing: border-box; }
        .edit-mode textarea { min-height: 100px; }

        .actions { margin-top: 15px; display: flex; gap: 10px; align-items: center; }
        
        button { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-approve { background: #28a745; color: white; }
        .btn-approve:hover { background: #218838; }
        
        .btn-reject { background: #dc3545; color: white; }
        .btn-reject:hover { background: #c82333; }
        
        .btn-edit { background: #ffc107; color: #333; }
        .btn-edit:hover { background: #e0a800; }
        
        .btn-save { background: #17a2b8; color: white; }
        .btn-save:hover { background: #138496; }
        
        .btn-cancel { background: #6c757d; color: white; }
        
        .empty-state { text-align: center; padding: 40px; color: #999; font-style: italic; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html" class="back-link">← Kembali ke Dashboard</a>
        <h1>✅ Validasi Amanah & Peraturan</h1>
        <p>Sebagai Ketua Yayasan, Anda dapat menyetujui, menolak, atau <strong>mengedit langsung</strong> redaksi amanah sebelum diterbitkan.</p>
        
        <div id="list-container">
            <div class="empty-state">Memuat data...</div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('sadigs_api_v3/regulation_operations.php?action=get_pending');
                const json = await res.json();
                
                const container = document.getElementById('list-container');
                container.innerHTML = '';

                if (json.success && json.data.length > 0) {
                    json.data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.id = `card-${item.id}`;
                        card.innerHTML = `
                            <div class="meta">
                                <span><strong>Pengusul:</strong> ${item.creator_name}</span>
                                <span>${item.created_at}</span>
                            </div>

                            <!-- MODE BACA -->
                            <div class="view-mode" id="view-${item.id}">
                                <span class="field-label">Target: ${item.target_role}</span>
                                <h3 id="disp-title-${item.id}">${item.title}</h3>
                                <div class="content-area">
                                    <span class="field-label">Isi Amanah:</span>
                                    <p id="disp-content-${item.id}">${item.content}</p>
                                </div>
                                <div class="actions">
                                    <button class="btn-approve" onclick="validate(${item.id}, 'approved')">✅ Setujui & Terbitkan</button>
                                    <button class="btn-edit" onclick="toggleEdit(${item.id}, true)">✏️ Edit Redaksi</button>
                                    <button class="btn-reject" onclick="validate(${item.id}, 'rejected')">❌ Tolak</button>
                                </div>
                            </div>

                            <!-- MODE EDIT -->
                            <div class="edit-mode" id="edit-${item.id}">
                                <span class="field-label">Edit Target Role:</span>
                                <select id="input-role-${item.id}">
                                    <option value="Semua">Semua</option>
                                    <option value="Musyrif">Musyrif</option>
                                    <option value="Walisantri">Walisantri</option>
                                    <option value="Ustadz">Ustadz</option>
                                    <option value="Kepala Sekolah">Kepala Sekolah</option>
                                </select>

                                <span class="field-label">Edit Judul:</span>
                                <input type="text" id="input-title-${item.id}" value="${item.title}">

                                <span class="field-label">Edit Isi:</span>
                                <textarea id="input-content-${item.id}">${item.content}</textarea>

                                <div class="actions">
                                    <button class="btn-save" onclick="saveChanges(${item.id})">💾 Simpan Perubahan</button>
                                    <button class="btn-cancel" onclick="toggleEdit(${item.id}, false)">Batal</button>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                        // Set initial select value
                        document.getElementById(`input-role-${item.id}`).value = item.target_role;
                    });
                } else {
                    container.innerHTML = '<div class="empty-state">Tidak ada amanah yang menunggu validasi saat ini.</div>';
                }
            } catch (e) {
                alert('Gagal memuat data: ' + e);
            }
        }

        function toggleEdit(id, showEdit) {
            document.getElementById(`view-${id}`).style.display = showEdit ? 'none' : 'block';
            document.getElementById(`edit-${id}`).style.display = showEdit ? 'block' : 'none';
        }

        async function saveChanges(id) {
            const title = document.getElementById(`input-title-${id}`).value;
            const content = document.getElementById(`input-content-${id}`).value;
            const role = document.getElementById(`input-role-${id}`).value;

            try {
                const res = await fetch('sadigs_api_v3/regulation_operations.php?action=update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, title, content, target_role: role })
                });
                const json = await res.json();
                if (json.success) {
                    alert('✅ Perubahan berhasil disimpan!');
                    // Update tampilan tanpa reload
                    document.getElementById(`disp-title-${id}`).innerText = title;
                    document.getElementById(`disp-content-${id}`).innerText = content;
                    toggleEdit(id, false);
                } else {
                    alert('Gagal: ' + json.message);
                }
            } catch (e) { alert('Error: ' + e); }
        }

        async function validate(id, status) {
            if (!confirm(`Apakah Anda yakin ingin mengubah status menjadi ${status}?`)) return;

            try {
                const res = await fetch('sadigs_api_v3/regulation_operations.php?action=validate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, status })
                });
                const json = await res.json();
                if (json.success) {
                    document.getElementById(`card-${id}`).remove();
                    if (document.getElementById('list-container').children.length === 0) {
                        document.getElementById('list-container').innerHTML = '<div class="empty-state">Semua tugas selesai!</div>';
                    }
                } else { alert('Gagal: ' + json.message); }
            } catch (e) { alert('Error: ' + e); }
        }

        loadData();
    </script>
</body>
</html>
