<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Ibadah Global - SADIGS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: #26667F; margin: 0; font-size: 1.5rem; }
        
        .controls { display: flex; gap: 10px; align-items: center; }
        input[type="date"] { padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; }
        button { padding: 8px 15px; background: #26667F; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; }
        button:hover { background: #1e556b; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #e9ecef; }
        .stat-val { font-size: 1.8rem; font-weight: bold; color: #26667F; }
        .stat-label { font-size: 0.85rem; color: #666; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
        th { background: #26667F; color: white; position: sticky; top: 0; }
        tr:hover { background: #f1f1f1; }
        
        .badge { padding: 3px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
        .bg-green { background: #d4edda; color: #155724; }
        .bg-yellow { background: #fff3cd; color: #856404; }
        .bg-red { background: #f8d7da; color: #721c24; }
        
        .loading { text-align: center; padding: 40px; color: #666; font-style: italic; }
        .back-link { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html" class="back-link">← Kembali ke Dashboard</a>
        
        <div class="header">
            <h1>🕌 Monitoring Ibadah Harian</h1>
            <div class="controls">
                <input type="date" id="filterDate">
                <button onclick="loadData()">Tampilkan</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" id="stat-total">0</div>
                <div class="stat-label">Total Laporan Masuk</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="stat-jamaah">0</div>
                <div class="stat-label">Full Jamaah 5 Waktu</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="stat-valid">0</div>
                <div class="stat-label">Sudah Divalidasi</div>
            </div>
        </div>

        <div class="table-responsive">
            <table id="worshipTable">
                <thead>
                    <tr>
                        <th>Nama Santri</th>
                        <th>Kelas</th>
                        <th>Subuh</th>
                        <th>Dzuhur</th>
                        <th>Ashar</th>
                        <th>Maghrib</th>
                        <th>Isya</th>
                        <th>Tahajud</th>
                        <th>Dhuha</th>
                        <th>Quran</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="11" class="loading">Silakan pilih tanggal dan klik Tampilkan</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Set default date to today
        document.getElementById('filterDate').valueAsDate = new Date();

        async function loadData() {
            const date = document.getElementById('filterDate').value;
            const tbody = document.getElementById('tableBody');
            
            tbody.innerHTML = '<tr><td colspan="11" class="loading">Memuat data... ⏳</td></tr>';

            try {
                const res = await fetch(`sadigs_api_v3/global_worship_api.php?date=${date}`);
                const json = await res.json();

                if (json.success) {
                    // Update Stats
                    document.getElementById('stat-total').innerText = json.stats.total_laporan;
                    document.getElementById('stat-jamaah').innerText = json.stats.full_jamaah;
                    document.getElementById('stat-valid').innerText = json.stats.validated;

                    // Render Table
                    tbody.innerHTML = '';
                    if (json.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="11" class="loading">Belum ada laporan masuk pada tanggal ini.</td></tr>';
                        return;
                    }

                    json.data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong>${row.full_name}</strong></td>
                            <td>${row.grade || '-'}</td>
                            <td>${renderShalat(row.shalat_subuh)}</td>
                            <td>${renderShalat(row.shalat_dzuhur)}</td>
                            <td>${renderShalat(row.shalat_ashar)}</td>
                            <td>${renderShalat(row.shalat_maghrib)}</td>
                            <td>${renderShalat(row.shalat_isya)}</td>
                            <td>${row.shalat_tahajud == 1 ? '✅' : '-'}</td>
                            <td>${row.shalat_dhuha == 1 ? '✅' : '-'}</td>
                            <td>${row.quran_last_page > 0 ? 'Hal ' + row.quran_last_page : '-'}</td>
                            <td>${renderStatus(row.validation_status)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="11" class="loading" style="color:red">Gagal: ${json.message}</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="11" class="loading" style="color:red">Error koneksi: ${e}</td></tr>`;
            }
        }

        function renderShalat(status) {
            if (status === 'Jamaah') return '<span class="badge bg-green">Jamaah</span>';
            if (status === 'Munfarid') return '<span class="badge bg-yellow">Munfarid</span>';
            if (status === 'Masbuk') return '<span class="badge bg-yellow">Masbuk</span>';
            if (status === 'Haid') return '<span class="badge" style="background:#ffc0cb;color:#880e4f">Haid</span>';
            if (status === 'Sakit') return '<span class="badge bg-yellow">Sakit</span>';
            if (status === 'Alpha') return '<span class="badge bg-red">Alpha</span>';
            return '-';
        }

        function renderStatus(status) {
            if (status === 'approved') return '<span class="badge bg-green">Valid</span>';
            if (status === 'rejected') return '<span class="badge bg-red">Ditolak</span>';
            return '<span class="badge bg-yellow">Pending</span>';
        }

        // Load data on startup
        loadData();
    </script>
</body>
</html>
