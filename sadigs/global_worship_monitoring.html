<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Ibadah Global | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Monitoring Ibadah Harian</h1>
                        <p class="text-sm text-gray-500">Pantau laporan ibadah seluruh santri.</p>
                    </div>
                    <div class="flex gap-2 items-center bg-white p-2 rounded-lg shadow-sm border border-gray-200">
                        <label class="text-sm font-bold text-gray-600">Tanggal:</label>
                        <input type="date" id="filterDate" class="border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-teal-500 outline-none">
                        <button onclick="loadData()" class="bg-teal-600 text-white px-3 py-1 rounded text-sm font-bold hover:bg-teal-700">Lihat</button>
                    </div>
                </div>

                <!-- Statistik Ringkas -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-xs text-gray-500 uppercase font-bold">Total Laporan Masuk</p>
                        <p class="text-2xl font-bold text-gray-800" id="statTotal">0</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-xs text-gray-500 uppercase font-bold">Full Jamaah (5 Waktu)</p>
                        <p class="text-2xl font-bold text-green-600" id="statJamaah">0</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-xs text-gray-500 uppercase font-bold">Sudah Divalidasi</p>
                        <p class="text-2xl font-bold text-blue-600" id="statValidated">0</p>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-teal-50">
                                <tr>
                                    <th class="px-4 py-3 text-left font-bold text-teal-800 uppercase">Nama Santri</th>
                                    <th class="px-4 py-3 text-left font-bold text-teal-800 uppercase">Kelas</th>
                                    <th class="px-4 py-3 text-center font-bold text-teal-800 uppercase">Sholat Wajib (S-Z-A-M-I)</th>
                                    <th class="px-4 py-3 text-center font-bold text-teal-800 uppercase">Sunnah</th>
                                    <th class="px-4 py-3 text-left font-bold text-teal-800 uppercase">Tilawah</th>
                                    <th class="px-4 py-3 text-center font-bold text-teal-800 uppercase">Status</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                                <tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        
        // Set tanggal hari ini
        document.getElementById('filterDate').valueAsDate = new Date();

        // Cek Sesi
        fetch('sadigs_api_v3/session_check.php').then(r=>r.json()).then(d=>{
            if(!d.success) window.location.href = 'index.html';
            loadData();
        });

        async function loadData() {
            const date = document.getElementById('filterDate').value;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">Memuat...</td></tr>';

            try {
                const res = await fetch(`sadigs_api_v3/global_worship_api.php?date=${date}`);
                const result = await res.json();
                
                if (result.success) {
                    // Update Stats
                    document.getElementById('statTotal').textContent = result.stats.total_laporan;
                    document.getElementById('statJamaah').textContent = result.stats.full_jamaah;
                    document.getElementById('statValidated').textContent = result.stats.validated;

                    if (result.data.length > 0) {
                        tbody.innerHTML = '';
                        result.data.forEach(row => {
                            const tr = document.createElement('tr');
                            tr.className = "hover:bg-gray-50 transition";
                            
                            // Badge Sholat
                            const sholat = `
                                <div class="flex justify-center gap-1">
                                    ${getBadge('S', row.subuh)} ${getBadge('Z', row.zuhur)} ${getBadge('A', row.ashar)} ${getBadge('M', row.maghrib)} ${getBadge('I', row.isya)}
                                </div>`;

                            const sunnah = `
                                <span class="${row.dhuha == 1 ? 'text-green-600' : 'text-gray-300'} font-bold text-xs mr-1">D</span>
                                <span class="${row.tahajud == 1 ? 'text-blue-600' : 'text-gray-300'} font-bold text-xs">T</span>`;

                            const statusColor = row.validation_status === 'approved' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                            const statusLabel = row.validation_status === 'approved' ? 'Valid' : 'Pending';

                            tr.innerHTML = `
                                <td class="px-4 py-3 font-bold text-gray-800">${row.full_name}</td>
                                <td class="px-4 py-3 text-gray-600">${row.grade || '-'}</td>
                                <td class="px-4 py-3 text-center">${sholat}</td>
                                <td class="px-4 py-3 text-center">${sunnah}</td>
                                <td class="px-4 py-3 text-gray-600 truncate max-w-xs">${row.quran_reading || '-'}</td>
                                <td class="px-4 py-3 text-center"><span class="px-2 py-1 rounded-full text-xs font-bold ${statusColor}">${statusLabel}</span></td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">Belum ada laporan masuk pada tanggal ini.</td></tr>';
                    }
                }
            } catch (e) { tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>'; }
        }

        function getBadge(label, status) {
            const color = status === 'Jamaah' ? 'bg-green-500' : (status === 'Munfarid' ? 'bg-yellow-500' : 'bg-red-500');
            return `<span class="w-5 h-5 flex items-center justify-center rounded text-white text-[10px] font-bold ${color}" title="${label}: ${status}">${label}</span>`;
        }
    </script>
</body>
</html>
