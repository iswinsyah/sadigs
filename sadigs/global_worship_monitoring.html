<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Ibadah Santri | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar & Navigation -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center bg-teal-600 text-white font-bold text-xl tracking-wider">SADIGS</div>
            <div class="p-6">
                <button onclick="window.history.back()" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali
                </button>
                <a href="dashboard.html" class="flex items-center gap-2 mt-4 text-gray-600 hover:text-teal-600">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2"></nav>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 lg:p-8 relative">
            <div class="max-w-7xl mx-auto">
                <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Rekap Ibadah Santri</h1>
                        <p class="text-gray-500 text-sm mt-1">Pemantauan global laporan ibadah harian seluruh santri.</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="date" id="filterDate" class="px-4 py-2 border border-gray-300 rounded-lg text-sm shadow-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500" onchange="loadData()">
                        <button onclick="loadData()" class="px-4 py-2 bg-teal-600 text-white rounded-lg text-sm font-bold shadow-sm hover:bg-teal-700 flex items-center gap-2 transition">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh
                        </button>
                    </div>
                </header>

                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="statsContainer">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm font-bold text-gray-500 uppercase tracking-wider">Total Laporan</p>
                        <h3 class="text-3xl font-extrabold text-blue-600 mt-2" id="statTotal">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm font-bold text-gray-500 uppercase tracking-wider">Full Jamaah (5 Waktu)</p>
                        <h3 class="text-3xl font-extrabold text-green-600 mt-2" id="statJamaah">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm font-bold text-gray-500 uppercase tracking-wider">Tervalidasi Musyrif</p>
                        <h3 class="text-3xl font-extrabold text-purple-600 mt-2" id="statValidated">0</h3>
                    </div>
                </div>

                <!-- Table -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-gray-50 text-gray-600 font-bold border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-4">Nama Santri</th>
                                    <th class="px-6 py-4 text-center">Kelas</th>
                                    <th class="px-6 py-4 text-center">Subuh</th>
                                    <th class="px-6 py-4 text-center">Dzuhur</th>
                                    <th class="px-6 py-4 text-center">Ashar</th>
                                    <th class="px-6 py-4 text-center">Maghrib</th>
                                    <th class="px-6 py-4 text-center">Isya</th>
                                    <th class="px-6 py-4 text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-gray-100">
                                <tr>
                                    <td colspan="8" class="px-6 py-8 text-center text-gray-500">
                                        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2 text-teal-500"></i> Memuat data...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('filterDate').valueAsDate = new Date();

        async function loadData() {
            const tbody = document.getElementById('tableBody');
            const date = document.getElementById('filterDate').value;
            
            tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-8 text-center text-gray-500"><i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2 text-teal-500"></i> Memuat data...</td></tr>`;
            lucide.createIcons();

            try {
                const res = await fetch(`sadigs_api_v3/global_worship_api.php?date=${date}`);
                const result = await res.json();

                if (result.success) {
                    document.getElementById('statTotal').textContent = result.stats.total_laporan;
                    document.getElementById('statJamaah').textContent = result.stats.full_jamaah;
                    document.getElementById('statValidated').textContent = result.stats.validated;

                    if (result.data.length > 0) {
                        tbody.innerHTML = result.data.map(item => `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="px-6 py-4"><div class="font-bold text-gray-800">${item.full_name}</div><div class="text-xs text-gray-500">${item.username}</div></td>
                                <td class="px-6 py-4 text-center font-medium text-gray-600">${item.grade || '-'}</td>
                                ${['subuh', 'dzuhur', 'ashar', 'maghrib', 'isya'].map(w => `<td class="px-6 py-4 text-center">${getBadge(item['shalat_'+w])}</td>`).join('')}
                                <td class="px-6 py-4 text-center">${item.validation_status === 'approved' ? '<span class="text-purple-600 text-xs font-bold">Valid</span>' : '<span class="text-orange-500 text-xs font-bold">Pending</span>'}</td>
                            </tr>
                        `).join('');
                    } else {
                        tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-12 text-center text-gray-500">Belum ada laporan ibadah untuk tanggal ini.</td></tr>`;
                    }
                } else {
                    tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-8 text-center text-red-500">${result.message}</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-8 text-center text-red-500">Koneksi terputus.</td></tr>`;
            }
        }

        function getBadge(val) {
            const colors = {'Jamaah': 'bg-green-100 text-green-700', 'Sendiri': 'bg-yellow-100 text-yellow-700', 'Bolong': 'bg-red-100 text-red-700', 'Haid': 'bg-pink-100 text-pink-700'};
            return `<span class="px-2 py-1 rounded text-xs font-bold ${colors[val] || 'bg-gray-100 text-gray-700'}">${val || '-'}</span>`;
        }
        loadData();
    </script>
</body>
</html>
