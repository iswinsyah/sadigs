<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Mapel | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Daftar Mata Pelajaran</h1>
            <a href="dashboard.html" class="text-gray-500 hover:text-gray-700">Kembali</a>
        </div>

        <!-- Form Tambah -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-gray-200">
            <h3 class="font-bold mb-4">Tambah Mapel Baru</h3>
            <form id="addSubjectForm" class="flex gap-4">
                <input type="text" name="name" placeholder="Nama Mapel (Misal: Matematika)" class="flex-1 p-2 border rounded" required>
                <select name="grade_level" class="p-2 border rounded" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="7">Kelas 7</option>
                    <option value="8">Kelas 8</option>
                    <option value="9">Kelas 9</option>
                    <option value="10">Kelas 10</option>
                    <option value="11">Kelas 11</option>
                    <option value="12">Kelas 12</option>
                </select>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700">Tambah</button>
            </form>
        </div>

        <!-- Tabel Mapel -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
            <table class="w-full text-left">
                <thead class="bg-gray-100 border-b">
                    <tr>
                        <th class="p-4 font-bold text-gray-600">Nama Mapel</th>
                        <th class="p-4 font-bold text-gray-600">Kelas</th>
                        <th class="p-4 font-bold text-gray-600 text-right">Aksi</th>
                    </tr>
                </thead>
                <tbody id="subjectTable">
                    <tr><td colspan="3" class="p-4 text-center">Memuat...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function loadSubjects() {
            const res = await fetch('sadigs_api_v3/academic_api.php?action=get_subjects');
            const result = await res.json();
            const tbody = document.getElementById('subjectTable');
            
            if(result.success && result.data.length > 0) {
                tbody.innerHTML = result.data.map(s => `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-4 font-bold text-gray-800">${s.name}</td>
                        <td class="p-4"><span class="bg-gray-100 px-2 py-1 rounded text-xs font-bold">Kelas ${s.grade_level}</span></td>
                        <td class="p-4 text-right">
                            <button onclick="deleteSubject(${s.id})" class="text-red-600 hover:text-red-800 text-sm font-bold">Hapus</button>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-500">Belum ada mapel. Silakan tambah di atas.</td></tr>';
            }
        }

        document.getElementById('addSubjectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = { name: formData.get('name'), grade_level: formData.get('grade_level') };
            
            try {
                const res = await fetch('sadigs_api_v3/academic_api.php?action=save_subject', {
                    method: 'POST', body: JSON.stringify(data)
                });
                const result = await res.json();
                if(result.success) {
                    e.target.reset();
                    loadSubjects();
                } else { alert(result.message); }
            } catch(e) { alert('Gagal menyimpan.'); }
        });

        async function deleteSubject(id) {
            if(!confirm('Hapus mapel ini?')) return;
            try {
                const res = await fetch('sadigs_api_v3/academic_api.php?action=delete_subject', {
                    method: 'POST', body: JSON.stringify({id})
                });
                loadSubjects();
            } catch(e) { alert('Gagal menghapus.'); }
        }

        loadSubjects();
    </script>
</body>
</html>
