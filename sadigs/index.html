<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'utama': '#4FB7B3',
                        'kedua': '#26667F',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-utama to-kedua h-screen flex items-center justify-center px-4">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm">
        <div class="text-center mb-8">
            <img src="assets/img/logo.png" alt="Logo Sekolah" class="h-24 mx-auto mb-4">
            <h1 class="text-2xl font-extrabold text-gray-800">Login SADIGS</h1>
            <p class="text-gray-500 text-sm mt-1">Masuk untuk mengakses dashboard</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-utama focus:border-utama outline-none transition" required>
            </div>

            <!-- Password -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-gray-700">Kata Sandi</label>
                </div>
                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-utama focus:border-utama outline-none transition" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="loginBtn" class="w-full bg-utama hover:bg-utama/90 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                Masuk
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            Belum punya akun? 
            <a href="signup.html" class="text-utama font-bold hover:underline">Daftar Sekarang</a>
        </div>
        
        <!-- Pesan Error -->
        <div id="errorMessage" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg text-center border border-red-200"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            // Reset UI
            btn.disabled = true;
            btn.innerText = 'Memuat...';
            errorDiv.classList.add('hidden');

            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('sadigs_api_v3/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    // Redirect ke dashboard jika sukses
                    window.location.href = result.redirect_path || 'dashboard.html';
                } else {
                    // Tampilkan pesan error
                    errorDiv.textContent = result.message;
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = 'Gagal terhubung ke server.';
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Masuk';
            }
        });
    </script>
</body>
</html>
