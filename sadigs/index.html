<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SADIGS 3.0</title>
    <!-- Font Premium: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <!-- Memuat file CSS eksternal -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
<div class="login-card">
    <div class="header-section">
        <img src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" 
             alt="Logo Villa Quran"
             width="80"
             height="80" 
             class="app-logo">
        <h1>SADIGS 3.0</h1>
        <h2>Sistem Administrasi Digital Sekolah</h2>
        <h2 class="institute">VILLA QURAN BARON MALANG</h2>
    </div>
    <form id="loginForm">
        <div class="form-group"><label for="username">Username</label><input type="text" id="username" name="username" required placeholder="Masukkan Username Anda" autocomplete="off"></div>
        <div class="form-group"><label for="password">Kata Sandi</label><input type="password" id="password" name="password" required placeholder="Masukkan kata sandi"></div>
        <button type="submit" id="btn-login">Masuk Aplikasi</button>
        <div id="msg-box" class="message-box"></div>
    </form>
    <div class="auth-footer">
        Belum punya akun? <a href="signup.html" rel="noopener noreferrer">Daftar sekarang</a>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
