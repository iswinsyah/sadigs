<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar SADIGS 3.0</title>
    <!-- Font Premium: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <!-- Memuat file CSS eksternal -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="auth-card signup-card">
        
        <!-- Area Logo dan Header -->
        <div class="header-section">
            <img src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" 
                 alt="Logo Villa Quran"
                 width="80"
                 height="80" 
                 class="app-logo">
            
            <h1>SADIGS 3.0</h1>
            <h2>Sistem Administrasi Digital Sekolah</h2>
            <h2 class="institute">VILLA QURAN BARON MALANG</h2>
        </div>

        <!-- Formulir -->
        <form id="signup-form">
            
            <!-- Bidang Nama Pengguna (Username) -->
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan Username Anda" required autocomplete="off">
            </div>

            <!-- Bidang Email -->
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
            </div>

            <!-- Bidang Kata Sandi -->
            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" required>
            </div>
            
            <!-- Pilihan Peran (Role) -->
            <div class="form-group">
                <label>Pilih Peran Anda (Bisa pilih lebih dari satu)</label>
                <div class="role-selection">
                    
                    <label class="role-option"><input type="checkbox" name="role" value="Kepala Sekolah"><span>Kepala Sekolah</span></label>
                    <label class="role-option"><input type="checkbox" name="role" value="Sekretaris Sekolah"><span>Sekretaris Sekolah</span></label>
                    <label class="role-option"><input type="checkbox" name="role" value="Bendahara Sekolah"><span>Bendahara Sekolah</span></label>
                    <label class="role-option"><input type="checkbox" name="role" value="Kepala Asrama"><span>Kepala Asrama</span></label>
                    <label class="role-option"><input type="checkbox" name="role" value="Musyrif"><span>Musyrif</span></label>
                    <label class="role-option"><input type="checkbox" name="role" value="Ustadz"><span>Ustadz</span></label>
                    <label class="role-option"><input type="checkbox" name="role" value="Santri"><span>Santri</span></label>
                    <label class="role-option"><input type="checkbox" name="role" value="Walisantri"><span>Walisantri</span></label>

                </div>
            </div>
            
            <!-- Tombol Submit -->
            <button type="submit" id="btn-signup">Daftar Akun</button>
        </form>

        <!-- Pesan Status (Untuk JavaScript) -->
        <div id="msg-box" class="message-box"></div>

        <!-- Tautan Masuk -->
        <div class="auth-footer">
            Sudah punya akun? 
            <a href="index.html">Masuk di sini</a>
        </div>
    </div>

    <!-- Menautkan ke script.js eksternal -->
    <script src="script.js"></script>

</body>
</html>
