<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Akun Pengguna | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'utama': '#4FB7B3',
                        'kedua': '#26667F',
                        'tombol-utama': '#3674B5',
                        'tombol-kedua': '#F93827',
                    }
                }
            }
        }
    </script>
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center gap-3 border-b border-gray-200 bg-utama text-white">
                <img src="assets/img/logo.png" alt="Logo" class="h-8 bg-white rounded-full p-0.5">
                <h1 class="text-3xl tracking-wide" style="font-family: 'Marlin Condensed', sans-serif;">SADIGS</h1>
            </div>
            <div class="p-6 border-b border-gray-100 bg-utama/10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-utama/20 flex items-center justify-center text-kedua font-bold text-lg shadow-sm">
                        <span id="userInitial">U</span>
                    </div>
                    <div class="overflow-hidden">
                        <p id="sidebarUsername" class="font-bold text-gray-800 text-sm truncate">Memuat...</p>
                        <p id="sidebarRole" class="text-xs text-gray-500 truncate font-medium">Role...</p>
                    </div>
                </div>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <div id="sidebarLoading" class="p-4 text-center text-gray-400 text-sm">Memuat menu...</div>
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-6xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Data Akun Pengguna</h1>
                        <p class="text-sm text-gray-500">Kelola, verifikasi, dan pantau seluruh akun pengguna di satu tempat.</p>
                    </div>
                    <div class="bg-yellow-50 text-yellow-800 text-xs px-3 py-2 rounded-lg border border-yellow-200 flex items-center gap-2">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                        <span>Gunakan tombol <b>Login Sebagai</b> untuk masuk ke akun user tanpa password.</span>
                    </div>
                </div>

                <!-- SEARCH BAR -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-6 sticky top-0 z-20">
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Cari nama, username, atau peran..." class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none shadow-sm">
                </div>

                <!-- CONTAINER GRUP -->
                <div id="userGroupsContainer" class="space-y-8 pb-10">
                    <div class="text-center py-10 text-gray-500">Memuat data...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Urutan Prioritas Tampilan Grup
        const rolePriority = [
            'Ketua Yayasan', 'Sekretaris Yayasan', 'Bendahara Yayasan',
            'Kepala Sekolah', 'Sekretaris Sekolah', 'Bendahara Sekolah', 'Admin Sekolah',
            'Kepala Asrama Putra', 'Kepala Asrama Putri',
            'Musyrif', 'Musyrifah', 'Ustadz', 'Ustadzah',
            'Walisantri', 'Santri Rijal', "Santri Nisa'", 'Santri',
            'Tanpa Peran'
        ];

        async function loadUsers() {
            const container = document.getElementById('userGroupsContainer');
            try {
                const res = await fetch('sadigs_api_v3/get_all_users_management.php');
                const result = await res.json();

                if(result.success && result.data.length > 0) {
                    container.innerHTML = '';
                    
                    // 1. Kelompokkan User
                    const groups = {};
                    result.data.forEach(u => {
                        let primaryRole = 'Tanpa Peran';
                        if (u.roles_display) {
                            // Ambil peran pertama sebagai grup utama
                            primaryRole = u.roles_display.split(',')[0].trim();
                        }
                        if (!groups[primaryRole]) groups[primaryRole] = [];
                        groups[primaryRole].push(u);
                    });

                    // 2. Urutkan Grup berdasarkan Prioritas
                    const sortedRoles = Object.keys(groups).sort((a, b) => {
                        const idxA = rolePriority.indexOf(a);
                        const idxB = rolePriority.indexOf(b);
                        // Jika tidak ada di list prioritas, taruh di akhir
                        return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
                    });

                    // 3. Render Setiap Grup
                    sortedRoles.forEach(roleName => {
                        const users = groups[roleName];
                        
                        // Buat Container Grup
                        const groupDiv = document.createElement('div');
                        groupDiv.className = "user-group bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden";
                        
                        // Header Grup
                        const headerColor = roleName === 'Tanpa Peran' ? 'bg-gray-100 text-gray-600' : 'bg-teal-50 text-teal-800';
                        groupDiv.innerHTML = `
                            <div class="px-6 py-3 border-b border-gray-200 ${headerColor} flex justify-between items-center">
                                <h3 class="font-bold text-sm uppercase tracking-wider">${roleName}</h3>
                                <span class="text-xs font-bold bg-white px-2 py-1 rounded-full border border-gray-200 shadow-sm">${users.length} Pengguna</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-12">No</th>
                                            <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Nama Lengkap</th>
                                            <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Username</th>
                                            <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Peran Lengkap</th>
                                            <th class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider w-24">Status</th>
                                            <th class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider w-48">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200 group-tbody">
                                        <!-- Rows injected here -->
                                    </tbody>
                                </table>
                            </div>
                        `;

                        const tbody = groupDiv.querySelector('.group-tbody');
                        
                        users.forEach((u, index) => {
                        const isActive = u.is_active == 1;
                        const hasPending = u.pending_count > 0;
                        const isOrphan = isActive && !u.roles_display; // Aktif tapi gak punya role

                        // Tentukan Status Badge
                        let statusBadge = '';
                        if (!isActive) statusBadge = '<span class="bg-red-100 text-red-800 px-2 py-1 rounded-full text-xs font-bold">Non-Aktif</span>';
                        else if (hasPending) statusBadge = '<span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full text-xs font-bold">Perlu Verifikasi</span>';
                        else if (isOrphan) statusBadge = '<span class="bg-orange-100 text-orange-800 px-2 py-1 rounded-full text-xs font-bold">Tanpa Peran</span>';
                        else statusBadge = '<span class="bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-bold">Aktif</span>';

                        // Tentukan Tombol Aksi
                        let actionButtons = '';
                        
                        // Tombol Verifikasi (Muncul jika Non-Aktif atau Ada Pending)
                        if (!isActive || hasPending) {
                            actionButtons += `<button onclick="processUser(${u.user_id}, 'activate')" class="bg-green-600 text-white hover:bg-green-700 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> Verifikasi</button>`;
                        }
                        
                        // Tombol Login & Matikan (Muncul jika Aktif)
                        if (isActive) {
                            actionButtons += `<button onclick="openEditRoleModal(${u.user_id}, '${u.username}', '${u.roles_display || ''}')" class="bg-yellow-500 text-white hover:bg-yellow-600 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm flex items-center gap-1" title="Edit Peran"><i data-lucide="edit" class="w-3 h-3"></i> Edit</button>`;
                            actionButtons += `<button onclick="impersonateUser(${u.user_id}, '${u.username}')" class="bg-blue-600 text-white hover:bg-blue-700 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm flex items-center gap-1" title="Login sebagai user ini"><i data-lucide="log-in" class="w-3 h-3"></i> Login</button>`;
                            actionButtons += `<button onclick="processUser(${u.user_id}, 'deactivate')" class="bg-gray-600 text-white hover:bg-gray-700 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm flex items-center gap-1" title="Matikan Akun"><i data-lucide="power-off" class="w-3 h-3"></i> Matikan</button>`;
                        }

                        // Tombol Hapus (Selalu ada)
                        actionButtons += `<button onclick="deleteUser(${u.user_id}, '${u.username}')" class="bg-red-600 text-white hover:bg-red-700 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm flex items-center gap-1" title="Hapus Permanen"><i data-lucide="trash-2" class="w-3 h-3"></i> Hapus</button>`;

                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition";
                        tr.innerHTML = `
                            <td class="px-6 py-4 text-sm text-gray-500 text-center">${index + 1}</td>
                            <td class="px-6 py-4 font-bold text-gray-800">${u.full_name || '-'}</td>
                            <td class="px-6 py-4 font-mono text-sm text-blue-600 bg-blue-50 w-fit rounded">${u.username}</td>
                            <td class="px-6 py-4 text-sm text-gray-600">${u.roles_display || '<span class="text-gray-400 italic">Belum pilih peran</span>'}</td>
                            <td class="px-6 py-4 text-center">${statusBadge}</td>
                            <td class="px-6 py-4 text-center"><div class="flex items-center justify-center gap-2">${actionButtons}</div></td>
                        `;
                        tbody.appendChild(tr);
                    });

                    container.appendChild(groupDiv);
                    });
                    
                    lucide.createIcons();

                } else {
                    container.innerHTML = '<div class="p-8 text-center text-gray-400 bg-white rounded-xl border border-gray-200">Tidak ada data pengguna.</div>';
                }
            } catch(e) { 
                console.error(e);
                container.innerHTML = `<div class="p-8 text-center text-red-500 bg-white rounded-xl border border-red-200 font-medium">Gagal memuat data.<br><button onclick="loadUsers()" class="mt-2 text-sm text-blue-600 underline">Coba Lagi</button></div>`;
            }
        }

        function filterTable() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const groups = document.querySelectorAll('.user-group');

            groups.forEach(group => {
                const rows = group.querySelectorAll('tbody tr');
                let visibleCount = 0;
                
                rows.forEach(row => {
                    const text = row.innerText.toLowerCase();
                    if (text.includes(filter)) {
                        row.style.display = "";
                        visibleCount++;
                    } else {
                        row.style.display = "none";
                    }
                });

                // Sembunyikan grup jika tidak ada user yang cocok
                group.style.display = visibleCount > 0 ? "" : "none";
            });
        }

        async function processUser(userId, action) {
            const actionText = action === 'activate' ? 'mengaktifkan/memverifikasi' : 'menonaktifkan';
            if (!confirm(`Anda yakin ingin ${actionText} pengguna ini?`)) return;

            try {
                const res = await fetch('sadigs_api_v3/verification.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, action: action })
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) loadUsers();
            } catch (e) { alert('Terjadi kesalahan koneksi.'); }
        }

        async function impersonateUser(userId, username) {
            if(!confirm(`Anda akan login sebagai ${username}. Anda bisa melihat apa yang mereka lihat.\n\nLanjutkan?`)) return;

            try {
                const res = await fetch('sadigs_api_v3/impersonate_user.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
                const result = await res.json();
                if(result.success) { window.location.href = 'dashboard.html'; }
                else { alert(result.message); }
            } catch(e) { alert('Gagal melakukan login.'); }
        }

        async function deleteUser(userId, username) {
            if(!confirm(`PERINGATAN: Anda akan menghapus akun "${username}".\n\nData yang dihapus tidak dapat dikembalikan. Lanjutkan?`)) return;

            try {
                const res = await fetch('sadigs_api_v3/delete_user.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
                const result = await res.json();
                alert(result.message);
                if(result.success) { loadUsers(); }
            } catch(e) { alert('Gagal menghapus pengguna.'); }
        }

        // --- FITUR EDIT PERAN ---
        let currentEditUserId = null;

        async function openEditRoleModal(userId, username, currentRolesStr) {
            currentEditUserId = userId;
            document.getElementById('editRoleModal').classList.remove('hidden');
            document.getElementById('editModalUsername').textContent = username;
            
            const container = document.getElementById('roleCheckboxContainer');
            container.innerHTML = '<p class="text-gray-500 text-sm">Memuat peran...</p>';

            try {
                // Ambil daftar semua peran dari API quota
                const res = await fetch('sadigs_api_v3/quota.php');
                const data = await res.json();
                
                if (data.success) {
                    container.innerHTML = '';
                    const allRoles = Object.keys(data.quotas);
                    // Tambahkan peran default yang mungkin tidak ada di quota
                    ['Santri Rijal', 'Santri Nisa\'', 'Walisantri'].forEach(r => {
                        if (!allRoles.includes(r)) allRoles.push(r);
                    });

                    allRoles.sort().forEach(role => {
                        // Cek apakah user saat ini punya peran ini (berdasarkan string di tabel)
                        // Note: Ini pengecekan sederhana, idealnya ambil data fresh dari DB per user, tapi string tabel cukup akurat untuk display.
                        const isChecked = currentRolesStr.includes(role);
                        
                        const div = document.createElement('div');
                        div.className = 'flex items-center p-2 hover:bg-gray-50 rounded border border-transparent hover:border-gray-200';
                        div.innerHTML = `
                            <input type="checkbox" id="role_${role}" value="${role}" class="w-4 h-4 text-teal-600 rounded border-gray-300 focus:ring-teal-500" ${isChecked ? 'checked' : ''}>
                            <label for="role_${role}" class="ml-2 text-sm text-gray-700 cursor-pointer w-full">${role}</label>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch (e) {
                container.innerHTML = '<p class="text-red-500 text-sm">Gagal memuat daftar peran.</p>';
            }
        }

        function closeEditRoleModal() {
            document.getElementById('editRoleModal').classList.add('hidden');
            currentEditUserId = null;
        }

        async function saveRoleChanges() {
            if (!currentEditUserId) return;
            
            const selectedRoles = Array.from(document.querySelectorAll('#roleCheckboxContainer input:checked')).map(cb => cb.value);
            
            if (selectedRoles.length === 0) {
                alert("Pilih minimal satu peran.");
                return;
            }

            if (!confirm("Simpan perubahan peran untuk user ini?")) return;

            try {
                const res = await fetch('sadigs_api_v3/verification.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: currentEditUserId, action: 'update_roles', roles: selectedRoles })
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) {
                    closeEditRoleModal();
                    loadUsers();
                }
            } catch (e) { alert('Terjadi kesalahan koneksi.'); }
        }

        // --- SIDEBAR LOGIC ---
        async function initSidebar() {
            try {
                // 1. Cek Sesi
                const sessionRes = await fetch('sadigs_api_v3/session_check.php');
                const sessionData = await sessionRes.json();
                if (!sessionData.success) { window.location.href = 'index.html'; return; }

                // 2. Update Info User di Sidebar
                document.getElementById('sidebarUsername').textContent = sessionData.username;
                document.getElementById('userInitial').textContent = sessionData.username.charAt(0).toUpperCase();
                const rawRoles = sessionData.raw_roles || [];
                let rolesText = 'User';
                if (rawRoles.length > 0) {
                    rolesText = rawRoles.map(r => r.status === 'approved' ? r.role_name : `${r.role_name} (Pending)`).join(', ');
                }
                document.getElementById('sidebarRole').textContent = rolesText;

                // 3. Ambil dan Terapkan Hak Akses Menu
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                if (permData.success) {
                    const sidebarNav = document.getElementById('sidebarNav');
                    sidebarNav.innerHTML = '';

                    const allowedMenus = permData.permissions || [];
                    const categories = permData.categories || {};
                    const menuNames = permData.menu_names || {};
                    const menuIcons = permData.menu_icons || {};
                    const menuLinks = permData.menu_links || {};

                    for (const [catId, cat] of Object.entries(categories)) {
                        const visibleMenus = cat.menus.filter(mId => allowedMenus.includes(mId));
                        
                        if (visibleMenus.length > 0) {
                            const groupDiv = document.createElement('div');
                            groupDiv.className = "bg-gray-50 rounded-lg p-2 mt-2";
                            
                            const title = document.createElement('h3');
                            title.className = "px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider";
                            title.textContent = cat.label;
                            groupDiv.appendChild(title);
                            
                            visibleMenus.forEach(menuId => {
                                if (menuId === 'navYayasanWidget' || menuId === 'navMusyrifWidget') return;

                                const link = document.createElement('a');
                                link.href = menuLinks[menuId] || '#';
                                const isActive = window.location.pathname.includes(link.href) && link.href !== '#';
                                
                                link.className = isActive 
                                    ? "flex items-center gap-3 px-3 py-2.5 text-utama bg-white rounded-md transition font-semibold text-sm shadow-sm"
                                    : "flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-utama rounded-md transition font-medium text-sm";
                                
                                const iconName = menuIcons[menuId] || 'circle';
                                link.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5"></i> ${menuNames[menuId] || menuId}`;
                                groupDiv.appendChild(link);
                            });
                            sidebarNav.appendChild(groupDiv);
                        }
                    }
                    
                    // Tombol Logout
                    const logoutDiv = document.createElement('div');
                    logoutDiv.className = "pt-2";
                    logoutDiv.innerHTML = `<button onclick="if(confirm('Keluar aplikasi?')) window.location.href='sadigs_api_v3/logout.php'" class="w-full flex items-center gap-3 px-4 py-2 text-tombol-kedua hover:bg-tombol-kedua/10 rounded-lg transition font-medium"><i data-lucide="log-out" class="w-5 h-5"></i> Keluar</button>`;
                    sidebarNav.appendChild(logoutDiv);
                    lucide.createIcons();
                }
            } catch (e) { console.error(e); }
        }

        loadUsers();
        initSidebar();
    </script>

    <!-- MODAL EDIT PERAN -->
    <div id="editRoleModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-800">Edit Peran: <span id="editModalUsername" class="text-teal-600"></span></h3>
                <button onclick="closeEditRoleModal()" class="text-gray-400 hover:text-red-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-5 max-h-[60vh] overflow-y-auto custom-scrollbar" id="roleCheckboxContainer">
                <!-- Checkbox peran akan muncul di sini -->
            </div>
            <div class="p-5 border-t border-gray-100 bg-gray-50 flex justify-end gap-2">
                <button onclick="closeEditRoleModal()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg text-sm font-bold hover:bg-gray-50 transition">Batal</button>
                <button onclick="saveRoleChanges()" class="px-4 py-2 bg-teal-600 text-white rounded-lg text-sm font-bold hover:bg-teal-700 transition shadow-sm">Simpan Perubahan</button>
            </div>
        </div>
    </div>
</body>
</html>
