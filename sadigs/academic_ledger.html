<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leger Nilai | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;} th{white-space:nowrap;}</style>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Leger Nilai Per Mapel</h1>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-white border px-4 py-2 rounded font-bold hover:bg-gray-50">Cetak</button>
                <a href="dashboard.html" class="bg-gray-200 px-4 py-2 rounded font-bold hover:bg-gray-300">Kembali</a>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-gray-200 flex items-center gap-4 print:hidden">
            <label class="font-bold text-gray-700">Pilih Mapel:</label>
            <select id="subjectSelect" class="p-2 border rounded w-64" onchange="loadLedger()">
                <option value="">-- Pilih Mapel --</option>
            </select>
        </div>

        <div class="bg-white rounded-xl shadow-sm overflow-x-auto border border-gray-200">
            <table class="w-full text-left border-collapse">
                <thead class="bg-teal-600 text-white">
                    <tr>
                        <th class="p-3 border border-teal-700 text-center">NO</th>
                        <th class="p-3 border border-teal-700">NAMA SANTRI</th>
                        <th class="p-3 border border-teal-700 text-center">TUGAS_TGS_1</th>
                        <th class="p-3 border border-teal-700 text-center">TUGAS_TGS_2</th>
                        <th class="p-3 border border-teal-700 text-center bg-teal-800">RERATA_TUGAS</th>
                        <th class="p-3 border border-teal-700 text-center">UJIAN_HARIAN_UH_1</th>
                        <th class="p-3 border border-teal-700 text-center bg-teal-800">RERATA_UH</th>
                        <th class="p-3 border border-teal-700 text-center">UJIAN_SEMESTER</th>
                        <th class="p-3 border border-teal-700 text-center bg-teal-900 font-extrabold">NILAI AKHIR</th>
                    </tr>
                </thead>
                <tbody id="ledgerBody">
                    <tr><td colspan="9" class="p-8 text-center text-gray-400">Pilih mapel untuk melihat leger.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function init() {
            const res = await fetch('sadigs_api_v3/academic_api.php?action=get_subjects');
            const result = await res.json();
            const select = document.getElementById('subjectSelect');
            if(result.success) {
                result.data.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = `${s.name} (Kelas ${s.grade_level})`;
                    select.appendChild(opt);
                });
            }
        }

        async function loadLedger() {
            const subjectId = document.getElementById('subjectSelect').value;
            const tbody = document.getElementById('ledgerBody');
            
            if(!subjectId) return;
            tbody.innerHTML = '<tr><td colspan="9" class="p-8 text-center">Menghitung data...</td></tr>';

            const res = await fetch(`sadigs_api_v3/academic_api.php?action=get_scores&subject_id=${subjectId}`);
            const result = await res.json();

            if(result.success && result.data.length > 0) {
                tbody.innerHTML = result.data.map((row, index) => {
                    // --- RUMUS PERHITUNGAN ---
                    const t1 = parseFloat(row.tugas_1);
                    const t2 = parseFloat(row.tugas_2);
                    const uh1 = parseFloat(row.uh_1);
                    const uas = parseFloat(row.uas);

                    const rerataTugas = (t1 + t2) / 2;
                    const rerataUH = uh1; // Karena cuma ada UH 1
                    
                    // Rumus Nilai Akhir (Contoh: 30% Tugas + 30% UH + 40% UAS)
                    const nilaiAkhir = (rerataTugas * 0.3) + (rerataUH * 0.3) + (uas * 0.4);

                    return `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3 border text-center text-gray-500">${index + 1}</td>
                            <td class="p-3 border font-bold text-gray-800">${row.full_name}</td>
                            <td class="p-3 border text-center">${t1}</td>
                            <td class="p-3 border text-center">${t2}</td>
                            <td class="p-3 border text-center font-bold bg-gray-50">${rerataTugas.toFixed(1)}</td>
                            <td class="p-3 border text-center">${uh1}</td>
                            <td class="p-3 border text-center font-bold bg-gray-50">${rerataUH.toFixed(1)}</td>
                            <td class="p-3 border text-center">${uas}</td>
                            <td class="p-3 border text-center font-extrabold text-teal-700 bg-teal-50">${nilaiAkhir.toFixed(1)}</td>
                        </tr>
                    `;
                }).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="9" class="p-8 text-center text-red-500">Data kosong.</td></tr>';
            }
        }

        init();
    </script>
</body>
</html>
