<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perencanaan Akademik | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50">
    <div class="max-w-4xl mx-auto p-4 lg:p-8">
        <div class="flex items-center gap-3 mb-6">
            <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Perencanaan Akademik</h1>
                <p class="text-sm text-gray-500">Analisis otomatis Kalender Pendidikan untuk menghitung pekan efektif.</p>
            </div>
        </div>

        <div id="loading" class="text-center py-20">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto text-blue-500"></i>
            <p class="text-gray-500 mt-2">Menganalisis kalender...</p>
        </div>

        <div id="content" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Semester Ganjil -->
            <div id="ganjilCard" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 border-b pb-2 mb-4">Semester Ganjil</h2>
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Total Pekan</span>
                        <span id="ganjil_total" class="font-bold text-lg text-gray-800">...</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Pekan Tidak Efektif</span>
                        <span id="ganjil_non_efektif" class="font-bold text-lg text-red-600">...</span>
                    </div>
                    <div class="flex justify-between items-center bg-green-50 p-3 rounded-lg mt-2">
                        <span class="text-green-800 font-bold">Pekan Efektif</span>
                        <span id="ganjil_efektif" class="font-extrabold text-2xl text-green-700">...</span>
                    </div>
                </div>
            </div>

            <!-- Semester Genap -->
            <div id="genapCard" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 border-b pb-2 mb-4">Semester Genap</h2>
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Total Pekan</span>
                        <span id="genap_total" class="font-bold text-lg text-gray-800">...</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Pekan Tidak Efektif</span>
                        <span id="genap_non_efektif" class="font-bold text-lg text-red-600">...</span>
                    </div>
                    <div class="flex justify-between items-center bg-green-50 p-3 rounded-lg mt-2">
                        <span class="text-green-800 font-bold">Pekan Efektif</span>
                        <span id="genap_efektif" class="font-extrabold text-2xl text-green-700">...</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="error" class="hidden bg-red-50 p-4 rounded-lg text-red-700"></div>
    </div>

    <script>
        lucide.createIcons();
        async function calculateWeeks() {
            try {
                const res = await fetch('sadigs_api_v3/calculate_academic_weeks.php');
                const result = await res.json();

                if (!result.success) {
                    throw new Error(result.message);
                }

                const { ganjil, genap } = result.data;
                document.getElementById('ganjil_total').textContent = ganjil.total_weeks;
                document.getElementById('ganjil_non_efektif').textContent = ganjil.non_effective_weeks;
                document.getElementById('ganjil_efektif').textContent = ganjil.effective_weeks;

                document.getElementById('genap_total').textContent = genap.total_weeks;
                document.getElementById('genap_non_efektif').textContent = genap.non_effective_weeks;
                document.getElementById('genap_efektif').textContent = genap.effective_weeks;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

            } catch (err) {
                document.getElementById('loading').classList.add('hidden');
                const errorEl = document.getElementById('error');
                errorEl.textContent = 'Gagal menghitung: ' + err.message + '. Pastikan Kalender Pendidikan sudah diatur dengan lengkap.';
                errorEl.classList.remove('hidden');
            }
        }
        calculateWeeks();
    </script>
</body>
</html>
