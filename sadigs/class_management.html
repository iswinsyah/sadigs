<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Kelas & Data Santri | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-6xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Manajemen Kelas & Data Santri</h1>
                        <p class="text-sm text-gray-500">Atur kelas dan pantau data orang tua santri.</p>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Cari santri..." class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-teal-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-bold text-teal-800 uppercase tracking-wider">Nama Santri</th>
                                    <th class="px-6 py-3 text-left text-xs font-bold text-teal-800 uppercase tracking-wider">Gender</th>
                                    <th class="px-6 py-3 text-left text-xs font-bold text-teal-800 uppercase tracking-wider">Nama Ayah</th>
                                    <th class="px-6 py-3 text-left text-xs font-bold text-teal-800 uppercase tracking-wider">Nama Ibu</th>
                                    <th class="px-6 py-3 text-left text-xs font-bold text-teal-800 uppercase tracking-wider">Status / Kelas</th>
                                    <th class="px-6 py-3 text-center text-xs font-bold text-teal-800 uppercase tracking-wider">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody" class="bg-white divide-y divide-gray-200">
                                <tr><td colspan="7" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        async function loadStudents() {
            try {
                const res = await fetch('sadigs_api_v3/class_management_api.php?action=get_students');
                const result = await res.json();
                
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';

                if (result.success && result.data.length > 0) {
                    result.data.forEach(s => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition";
                        
                        // Dropdown Status
                        const options = ['Kelas 7', 'Kelas 8', 'Kelas 9', 'Kelas 10', 'Kelas 11', 'Kelas 12', 'Lulus', 'Pindah', 'Keluar'];
                        let selectHtml = `<select onchange="updateStatus(${s.user_id}, this.value)" class="text-sm border-gray-300 rounded focus:ring-teal-500 border px-2 py-1 bg-white">`;
                        selectHtml += `<option value="">- Pilih -</option>`;
                        options.forEach(opt => {
                            const selected = s.grade === opt ? 'selected' : '';
                            selectHtml += `<option value="${opt}" ${selected}>${opt}</option>`;
                        });
                        selectHtml += `</select>`;

                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap font-bold text-gray-800">${s.full_name}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${s.gender}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${s.father_name || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${s.mother_name || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap">${selectHtml}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">
                                <a href="student_data.html?id=${s.user_id}" class="text-blue-600 hover:text-blue-800 text-xs font-bold border border-blue-200 px-3 py-1 rounded hover:bg-blue-50 transition">Detail</a>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                    lucide.createIcons();
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-gray-500">Tidak ada data santri.</td></tr>';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('studentTableBody').innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>';
            }
        }

        async function updateStatus(userId, newGrade) {
            try {
                const res = await fetch('sadigs_api_v3/class_management_api.php?action=update_status', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, grade: newGrade })
                });
                const result = await res.json();
                if(!result.success) alert('Gagal update: ' + result.message);
                // Optional: Toast notification
            } catch(e) { alert('Koneksi error'); }
        }

        function filterTable() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const rows = document.querySelectorAll('#studentTableBody tr');

            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? "" : "none";
            });
        }

        loadStudents();
    </script>
</body>
</html>
