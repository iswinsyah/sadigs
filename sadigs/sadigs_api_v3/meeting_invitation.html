<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Undangan Rapat | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- HEADER MOBILE -->
    <div class="lg:hidden flex justify-between items-center bg-teal-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="font-bold text-xl flex items-center gap-2"><span>SADIGS 3.0</span></div>
        <button id="mobileMenuBtn" class="focus:outline-none p-1 rounded hover:bg-teal-700 transition"><i data-lucide="menu" class="w-7 h-7"></i></button>
    </div>

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col transition-transform transform -translate-x-full lg:translate-x-0 fixed lg:static h-full z-40 shadow-2xl lg:shadow-none">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6 border-b border-gray-100 bg-teal-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-teal-200 flex items-center justify-center text-teal-800 font-bold text-lg shadow-sm"><span id="userInitial">U</span></div>
                    <div class="overflow-hidden">
                        <p id="sidebarUsername" class="font-bold text-gray-800 text-sm truncate">Memuat...</p>
                        <p id="sidebarRole" class="text-xs text-gray-500 truncate font-medium">Role...</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <!-- Div 1: UMUM -->
                <div class="bg-gray-50 rounded-lg p-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">UMUM</h3>
                    <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
                    <a href="calendar_view.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="table" class="w-5 h-5"></i> Tabel Kalender</a>
                    <a href="profile.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="user" class="w-5 h-5"></i> Profil Saya</a>
                </div>
                <!-- Container untuk menu Yayasan -->
                <div id="menuYayasan" class="hidden space-y-2">
                    <!-- Div 2: KEPEGAWAIAN -->
                    <div class="bg-gray-50 rounded-lg p-2">
                        <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KEPEGAWAIAN</h3>
                        <a id="navVerifikasi" href="verification_management.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="users" class="w-5 h-5"></i> Verifikasi Pegawai</a>
                        <a id="navQuota" href="quota_management.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="user-cog" class="w-5 h-5"></i> Atur Kuota</a>
                        <a id="navAbsensi" href="attendance.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="map-pin" class="w-5 h-5"></i> Absensi Pegawai</a>
                        <a id="navRapat" href="meeting_invitation.html" class="flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="mail" class="w-5 h-5"></i> Undangan Rapat</a>
                    </div>
                    <!-- Div 3: KHUSUS -->
                    <div id="groupKhusus" class="hidden bg-gray-50 rounded-lg p-2">
                        <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KHUSUS</h3>
                        <a id="navCalendarSettings" href="calendar_settings.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="calendar-cog" class="w-5 h-5"></i> Atur Kalender</a>
                    </div>
                </div>
                <div class="pt-2">
                    <button id="logoutBtn" class="w-full flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition font-medium"><i data-lucide="log-out" class="w-5 h-5"></i> Keluar</button>
                </div>
            </nav>
        </aside>
        <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden lg:hidden backdrop-blur-sm"></div>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Buat Undangan Rapat</h2>
                <p class="text-gray-500 text-sm mt-1">Jadwalkan rapat dan otomatis terhubung dengan absensi pegawai.</p>
            </header>

            <div class="max-w-3xl">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <form id="meetingForm" class="space-y-6">
                        <!-- 1. Nama Rapat -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Rapat</label>
                            <input type="text" name="meeting_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Contoh: Rapat Evaluasi Bulanan" required>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- 2. Tanggal -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
                                <input type="date" name="meeting_date" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
                            </div>
                            <!-- 3. Jam Rapat -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Jam Rapat</label>
                                <input type="time" name="meeting_time" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
                            </div>
                        </div>

                        <!-- 4. Tempat -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tempat</label>
                            <input type="text" name="location" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Contoh: Ruang Guru Lt. 2" required>
                        </div>

                        <!-- 5. Agenda -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Agenda</label>
                            <textarea name="agenda" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Tuliskan poin-poin agenda rapat..."></textarea>
                        </div>

                        <!-- 6. Pengundang -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Pengundang</label>
                            <div class="relative">
                                <select name="inviter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none appearance-none bg-white cursor-pointer" required>
                                    <option value="" disabled selected>Pilih Pengundang</option>
                                    <option value="Ketua Yayasan">Ketua Yayasan</option>
                                    <option value="Kepala Sekolah">Kepala Sekolah</option>
                                    <option value="Kepala Asrama">Kepala Asrama</option>
                                </select>
                                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none"><i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i></div>
                            </div>
                        </div>

                        <div class="flex justify-end pt-4">
                            <button type="submit" id="submitBtn" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-6 rounded-lg transition shadow-md flex items-center gap-2">
                                <i data-lucide="send" class="w-4 h-4"></i> Buat Undangan
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        function toggleSidebar() { sidebar.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); }
        mobileMenuBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        async function initPage() {
            try {
                const sessionRes = await fetch('sadigs_api_v3/session_check.php');
                const sessionData = await sessionRes.json();
                if (!sessionData.success) { window.location.href = 'index.html'; return; }

                document.getElementById('sidebarUsername').textContent = sessionData.username;
                document.getElementById('userInitial').textContent = sessionData.username.charAt(0).toUpperCase();
                document.getElementById('sidebarRole').textContent = sessionData.roles[0] || 'User';

                // Cek Akses
                const allowedRoles = ['Ketua Yayasan', 'Kepala Sekolah', 'Kepala Asrama'];
                const hasAccess = sessionData.roles.some(r => allowedRoles.includes(r));
                if (!hasAccess) {
                    alert('Akses ditolak. Halaman ini hanya untuk Ketua Yayasan, Kepala Sekolah, dan Kepala Asrama.');
                    window.location.href = 'dashboard.html';
                    return;
                }

                // Sidebar Logic
                const yayasanRoles = ['Ketua Yayasan', 'Sekretaris Yayasan', 'Bendahara Yayasan'];
                const pegawaiRoles = ['Kepala Sekolah', 'Kepala Asrama', 'Sekretaris Sekolah', 'Bendahara Sekolah', 'Musyrif'];
                if (sessionData.roles.some(r => yayasanRoles.includes(r) || pegawaiRoles.includes(r))) {
                    document.getElementById('menuYayasan').classList.remove('hidden');
                }
                if (sessionData.roles.some(r => yayasanRoles.includes(r))) {
                    document.getElementById('navVerifikasi').classList.remove('hidden');
                    document.getElementById('navQuota').classList.remove('hidden');
                    document.getElementById('groupKhusus').classList.remove('hidden');
                }
                if (sessionData.roles.some(r => pegawaiRoles.includes(r))) {
                    document.getElementById('navAbsensi').classList.remove('hidden');
                }
            } catch (error) { console.error(error); }
        }

        document.getElementById('meetingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Memproses...';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('sadigs_api_v3/create_meeting.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) { alert('Undangan berhasil dibuat!'); e.target.reset(); }
                else { alert('Gagal: ' + result.message); }
            } catch (error) { alert('Terjadi kesalahan koneksi.'); }
            finally { btn.disabled = false; btn.innerHTML = originalText; }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => { if(confirm('Keluar aplikasi?')) window.location.href = 'sadigs_api_v3/logout.php'; });
        initPage();
    </script>
</body>
</html>
