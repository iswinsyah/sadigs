<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penilaian Kinerja | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-6xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Penilaian Kinerja Ustadz</h1>
                        <div class="flex items-center gap-4 mt-1">
                            <p class="text-sm text-gray-500">Periode: <span id="periodName" class="font-bold text-teal-600">Memuat...</span></p>
                            <span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full font-bold border border-yellow-200">KKM: 70</span>
                        </div>
                    </div>
                </div>

                <!-- TABEL DAFTAR USTADZ -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Nama Ustadz</th>
                                <th class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Nilai Akhir</th>
                                <th class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="ustadzTableBody" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="4" class="p-8 text-center text-gray-400">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL PENILAIAN -->
    <div id="gradeModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h3 class="font-bold text-lg text-gray-800">Detail Penilaian: <span id="modalUstadzName"></span></h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <div id="kpiList" class="space-y-4">
                    <!-- KPI Items will be injected here -->
                </div>
            </div>
            <div class="p-4 border-t bg-white rounded-b-xl flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let currentPeriodId = null;
        let currentUserId = null;

        async function initPage() {
            try {
                // 1. Get Period
                const resPeriod = await fetch('sadigs_api_v3/performance_api.php?action=get_current_period');
                const dataPeriod = await resPeriod.json();
                if(dataPeriod.success && dataPeriod.data) {
                    currentPeriodId = dataPeriod.data.id;
                    document.getElementById('periodName').textContent = dataPeriod.data.period_name;
                    loadUstadzList();
                } else {
                    document.getElementById('periodName').textContent = "Tidak ada periode aktif";
                }
            } catch(e) { console.error(e); }
        }

        async function loadUstadzList() {
            const tbody = document.getElementById('ustadzTableBody');
            try {
                const res = await fetch(`sadigs_api_v3/performance_api.php?action=get_ustadz_summary&period_id=${currentPeriodId}`);
                const result = await res.json();

                if(result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(u => {
                        const score = parseFloat(u.final_score);
                        let statusBadge = '';
                        if(score >= 70) statusBadge = '<span class="bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-bold flex items-center justify-center gap-1"><i data-lucide="check-circle" class="w-3 h-3"></i> Aman</span>';
                        else statusBadge = '<span class="bg-red-100 text-red-800 px-2 py-1 rounded-full text-xs font-bold flex items-center justify-center gap-1"><i data-lucide="alert-triangle" class="w-3 h-3"></i> Peringatan</span>';

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="px-6 py-4 font-bold text-gray-700">${u.full_name || u.username}</td>
                            <td class="px-6 py-4 text-center font-bold text-lg">${score}</td>
                            <td class="px-6 py-4 text-center">${statusBadge}</td>
                            <td class="px-6 py-4 text-center">
                                <button onclick="openGradeModal(${u.user_id}, '${u.full_name || u.username}')" class="bg-teal-600 hover:bg-teal-700 text-white px-3 py-1 rounded text-xs font-bold">Detail / Nilai</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                    lucide.createIcons();
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-400">Tidak ada data ustadz.</td></tr>';
                }
            } catch(e) { console.error(e); }
        }

        async function openGradeModal(userId, name) {
            currentUserId = userId;
            document.getElementById('modalUstadzName').textContent = name;
            document.getElementById('gradeModal').classList.remove('hidden');
            
            const container = document.getElementById('kpiList');
            container.innerHTML = '<p class="text-center text-gray-400">Memuat indikator...</p>';

            try {
                const res = await fetch(`sadigs_api_v3/performance_api.php?action=get_score_detail&user_id=${userId}&period_id=${currentPeriodId}`);
                const result = await res.json();

                if(result.success) {
                    container.innerHTML = '';
                    result.data.forEach(kpi => {
                        let inputHtml = '';
                        if(kpi.kpi_type === 'automatic') {
                            inputHtml = `<div class="text-2xl font-bold text-gray-800">${kpi.score} <span class="text-sm font-normal text-gray-500">(Otomatis)</span></div>`;
                        } else {
                            inputHtml = `
                                <div class="flex gap-2">
                                    <input type="number" id="score-${kpi.kpi_id}" value="${kpi.score}" class="w-20 p-2 border border-gray-300 rounded text-center font-bold" min="0" max="100">
                                    <button onclick="saveScore(${kpi.kpi_id})" class="bg-blue-600 text-white px-3 py-2 rounded text-sm font-bold">Simpan</button>
                                </div>
                                <textarea id="notes-${kpi.kpi_id}" class="w-full mt-2 p-2 border border-gray-300 rounded text-xs" placeholder="Catatan penilaian...">${kpi.notes || ''}</textarea>
                            `;
                        }

                        const div = document.createElement('div');
                        div.className = 'bg-gray-50 p-4 rounded-lg border border-gray-200';
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h4 class="font-bold text-gray-800">${kpi.kpi_name}</h4>
                                    <p class="text-xs text-gray-500">Bobot: ${kpi.weight}%</p>
                                </div>
                                ${inputHtml}
                            </div>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch(e) { console.error(e); }
        }

        async function saveScore(kpiId) {
            const score = document.getElementById(`score-${kpiId}`).value;
            const notes = document.getElementById(`notes-${kpiId}`).value;

            try {
                await fetch('sadigs_api_v3/performance_api.php?action=save_manual_score', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: currentUserId, period_id: currentPeriodId, kpi_id: kpiId, score, notes })
                });
                alert("Nilai tersimpan!");
                loadUstadzList(); // Refresh summary
            } catch(e) { alert("Gagal menyimpan."); }
        }

        function closeModal() { document.getElementById('gradeModal').classList.add('hidden'); }
        initPage();
    </script>
</body>
</html>
