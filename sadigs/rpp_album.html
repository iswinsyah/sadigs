<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Modul Ajar | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'utama': '#4FB7B3',
                        'kedua': '#26667F',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .prose h2 { font-size: 1.25rem; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .prose h3 { font-size: 1.1rem; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-kedua text-white">
                <img src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" alt="Logo Villa Quran" class="h-9">
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-utama transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2">
                <!-- Menu akan dimuat oleh JS -->
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl lg:text-3xl font-bold text-gray-800 flex items-center gap-3">
                        <i data-lucide="book-copy" class="w-8 h-8 text-utama"></i>
                        Album Modul Ajar
                    </h2>
                    <p class="text-gray-500 text-sm mt-1">Kumpulan Modul Ajar yang telah Anda buat dan simpan.</p>
                </div>
                <a href="rpp_generator.html" class="bg-utama hover:bg-utama/90 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> Buat Baru
                </a>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="albumContainer">
                <!-- Card RPP akan dimuat di sini -->
                <div class="col-span-full text-center py-12 text-gray-400">Memuat data album...</div>
            </div>
        </main>

        <!-- Modal untuk Lihat Detail -->
        <div id="viewModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col">
                <div class="flex justify-between items-center p-4 border-b">
                    <h3 id="modalTitle" class="font-bold text-lg text-gray-800">Detail Modul Ajar</h3>
                    <button onclick="closeModal()" class="p-2 rounded-full hover:bg-gray-100">
                        <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
                    </button>
                </div>
                <div id="modalContent" class="p-6 overflow-y-auto prose max-w-none">
                    <!-- Konten modul ajar akan dimuat di sini -->
                </div>
                <div class="p-4 border-t bg-gray-50 rounded-b-xl text-right">
                     <button onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg text-sm font-semibold">Tutup</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                const allowedMenus = permData.success ? permData.permissions : [];

                if (!allowedMenus.includes('navRppAlbum')) {
                    alert('Anda tidak memiliki izin untuk mengakses halaman ini.');
                    window.location.href = 'dashboard.html';
                    return;
                }
                renderSidebar(allowedMenus);
                loadAlbum();
            } catch (e) { 
                alert('Gagal memuat data.');
            }
        }

        function renderSidebar(allowedMenus) {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = `<div class="bg-gray-50 rounded-lg p-2"><h3 class="px-2 mb-2 text-xs font-bold text-gray-400">KEPEGAWAIAN</h3><a id="navRppGenerator" href="rpp_generator.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-utama rounded-md transition font-medium text-sm"><i data-lucide="brain-circuit" class="w-5 h-5"></i> Generator Modul Ajar</a><a id="navRppAlbum" href="rpp_album.html" class="flex items-center gap-3 px-3 py-2.5 text-utama bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="book-copy" class="w-5 h-5"></i> Album Modul Ajar</a></div>`;
            allowedMenus.forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove('hidden'); });
            lucide.createIcons();
        }

        async function loadAlbum() {
            const container = document.getElementById('albumContainer');
            try {
                const res = await fetch('sadigs_api_v3/get_rpp_album.php');
                const result = await res.json();

                if (result.success && result.data.length > 0) {
                    container.innerHTML = '';
                    result.data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'bg-white p-6 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition flex flex-col';
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <span class="bg-teal-50 text-teal-700 text-xs font-bold px-2 py-1 rounded uppercase tracking-wide">${item.subject}</span>
                                <span class="text-xs text-gray-400">${item.created_at_formatted}</span>
                            </div>
                            <h3 class="font-bold text-lg text-gray-800 mb-1 line-clamp-2">${item.topic}</h3>
                            <p class="text-sm text-gray-500 mb-4">Kelas ${item.grade}</p>
                            <div class="mt-auto pt-4 border-t border-gray-100 flex gap-2">
                                <button onclick="viewModule(${item.id})" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 rounded-lg text-sm font-bold transition">Lihat</button>
                                <button onclick="deleteModule(${item.id})" class="px-3 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg transition" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        `;
                        container.appendChild(card);
                        lucide.createIcons();
                    });
                } else {
                    container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-12 text-gray-400"><i data-lucide="book-open" class="w-12 h-12 mb-3 opacity-20"></i><p>Belum ada Modul Ajar yang disimpan.</p></div>`;
                    lucide.createIcons();
                }
            } catch (e) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">Gagal memuat data album.</div>`;
            }
        }

        function closeModal() {
            document.getElementById('viewModal').classList.add('hidden');
        }

        async function viewModule(id) {
            const modal = document.getElementById('viewModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');

            modal.classList.remove('hidden');
            modalTitle.textContent = 'Memuat...';
            modalContent.innerHTML = '<p class="text-center text-gray-400">Mengambil data modul ajar...</p>';

            try {
                const res = await fetch(`sadigs_api_v3/get_rpp_album.php?id=${id}`);
                const result = await res.json();
                if (result.success) {
                    modalTitle.textContent = result.data.topic;
                    // Mengganti newline menjadi <br> dan format bold
                    const formattedContent = result.data.rpp_content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                    modalContent.innerHTML = formattedContent;
                } else {
                    throw new Error(result.message);
                }
            } catch (e) {
                modalContent.innerHTML = `<p class="text-red-500">Gagal memuat detail: ${e.message}</p>`;
            }
        }

        async function deleteModule(id) {
            if (!confirm('Anda yakin ingin menghapus Modul Ajar ini dari album?')) return;

            try {
                const res = await fetch('sadigs_api_v3/get_rpp_album.php', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) loadAlbum(); // Muat ulang album
            } catch (e) {
                alert('Gagal menghapus: ' + e.message);
            }
        }

        initPage();
    </script>
</body>
</html>
