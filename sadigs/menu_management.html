<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Akses Menu | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Bekukan baris header tabel */
        thead th { 
            position: sticky; 
            top: 0; 
            background-color: #f9fafb; /* Tailwind bg-gray-50 */
            z-index: 10; 
        }
        /* Bekukan kolom pertama (Menu) */
        thead th:first-child,
        tbody td:first-child {
            position: sticky;
            left: 0;
        }
        tbody td:first-child {
            background-color: #ffffff; /* Tailwind bg-white */
        }
        /* Pastikan pojok kiri atas selalu di paling depan */
        thead th:first-child {
            z-index: 20;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto p-4 lg:p-8">
        <div class="flex items-center gap-3 mb-6">
            <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
            <h1 class="text-2xl font-bold text-gray-800">Manajemen Akses Menu</h1>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 bg-yellow-50 text-sm text-yellow-800 flex gap-2">
                <i data-lucide="info" class="w-5 h-5 flex-shrink-0"></i>
                <p>Atur menu mana saja yang dapat diakses oleh setiap peran. Perubahan akan langsung aktif setelah disimpan.</p>
            </div>
            <div id="loading" class="text-center py-20">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto text-blue-500"></i>
                <p class="text-gray-500 mt-2">Memuat data izin akses...</p>
            </div>
            <div id="tableContainer" class="hidden overflow-auto max-h-[70vh]">
                <table class="w-full text-sm text-left">
                    <thead id="tableHead" class="bg-gray-50 text-gray-600 uppercase text-xs"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-6 flex justify-end">
            <button id="saveBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition shadow-md flex items-center gap-2 disabled:opacity-50" disabled>
                <i data-lucide="save" class="w-5 h-5"></i> Simpan Perubahan
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let changes = [];

        const loadingEl = document.getElementById('loading');
        const tableContainer = document.getElementById('tableContainer');
        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');
        const saveBtn = document.getElementById('saveBtn');

        async function loadPermissions() {
            try {
                const res = await fetch('sadigs_api_v3/menu_manager.php');
                const data = await res.json();

                if (!data.success) {
                    throw new Error(data.message);
                }

                const { roles, categories, matrix, menu_names } = data;
                
                // Build Header
                let headerHtml = '<tr><th class="px-4 py-3">Menu</th>';
                roles.forEach(role => {
                    headerHtml += `<th class="px-4 py-3 text-center">${role}</th>`;
                });
                headerHtml += '</tr>';
                tableHead.innerHTML = headerHtml;

                // Build Body
                tableBody.innerHTML = '';
                for (const catKey in categories) {
                    const category = categories[catKey];
                    // Category Row
                    const catRow = document.createElement('tr');
                    catRow.className = 'bg-gray-100';
                    catRow.innerHTML = `<td colspan="${roles.length + 1}" class="px-4 py-2 font-bold text-gray-700">${category.label}</td>`;
                    tableBody.appendChild(catRow);

                    // Menu Rows
                    category.menus.forEach(menuId => {
                        const menuRow = document.createElement('tr');
                        menuRow.className = 'border-b hover:bg-gray-50';
                        
                        // Menu Name Cell - INI BAGIAN PERBAIKANNYA
                        const menuName = menu_names[menuId] || menuId;
                        menuRow.innerHTML = `<td class="px-4 py-3 font-medium text-gray-800">${menuName}</td>`;

                        // Checkbox Cells
                        roles.forEach(role => {
                            const isAllowed = matrix[menuId] && matrix[menuId][role] ? 1 : 0;
                            const td = document.createElement('td');
                            td.className = 'text-center';
                            td.innerHTML = `<input type="checkbox" data-role="${role}" data-menu="${menuId}" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" ${isAllowed ? 'checked' : ''}>`;
                            menuRow.appendChild(td);
                        });
                        tableBody.appendChild(menuRow);
                    });
                }

                loadingEl.classList.add('hidden');
                tableContainer.classList.remove('hidden');
                addEventListeners();

            } catch (err) {
                loadingEl.innerHTML = `<p class="text-red-500">Gagal memuat data: ${err.message}</p>`;
            }
        }

        function addEventListeners() {
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    saveBtn.disabled = false;
                    saveBtn.classList.remove('disabled:opacity-50');
                    
                    const change = {
                        role: e.target.dataset.role,
                        menu: e.target.dataset.menu,
                        state: e.target.checked ? 1 : 0
                    };
                    changes = changes.filter(c => !(c.role === change.role && c.menu === change.menu));
                    changes.push(change);
                });
            });
        }

        saveBtn.addEventListener('click', async () => {
            if (changes.length === 0) return;
            saveBtn.disabled = true;
            saveBtn.innerHTML = 'Menyimpan...';

            try {
                const res = await fetch('sadigs_api_v3/menu_manager.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ updates: changes })
                });
                const result = await res.json();
                if (result.success) {
                    alert('Perubahan berhasil disimpan!');
                    changes = [];
                    saveBtn.innerHTML = '<i data-lucide="save" class="w-5 h-5"></i> Simpan Perubahan';
                    lucide.createIcons();
                } else { throw new Error(result.message || 'Gagal menyimpan.'); }
            } catch (err) {
                alert('Error: ' + err.message);
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i data-lucide="save" class="w-5 h-5"></i> Simpan Perubahan';
                lucide.createIcons();
            }
        });

        loadPermissions();
    </script>
</body>
</html>
