<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Akses | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;}
        /* Sticky Header & First Column for large tables */
        th.sticky-col, td.sticky-col { position: sticky; left: 0; z-index: 10; background-color: white; }
        th.sticky-col { z-index: 20; }
        /* Drag & Drop Styles */
        th.draggable-header { cursor: grab; user-select: none; }
        th.draggable-header:active { cursor: grabbing; }
        th.drag-over { background-color: #f0fdfa; border-left: 2px solid #0d9488; transition: all 0.2s; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-full mx-auto">
                <div class="flex justify-between items-center mb-6 sticky top-0 bg-gray-50 z-30 py-2">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Manajemen Akses Menu</h1>
                        <p class="text-sm text-gray-500">Atur siapa yang boleh melihat menu apa.</p>
                    </div>
                    
                    <!-- TOMBOL SIMPAN DENGAN INDIKATOR -->
                    <button id="saveBtn" onclick="savePermissions()" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded-lg font-bold shadow-lg flex items-center gap-2 transition-all transform active:scale-95">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        <span>Simpan Perubahan Izin</span>
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto max-h-[75vh]">
                        <table class="min-w-full divide-y divide-gray-200 text-sm relative">
                            <thead class="bg-gray-100">
                                <tr id="headerRow">
                                    <th class="px-4 py-3 text-left font-bold text-gray-700 uppercase sticky top-0 z-20 bg-gray-100 sticky-col border-r border-gray-200 shadow-sm">Menu / Role</th>
                                    <!-- Role Headers will be injected here -->
                                </tr>
                            </thead>
                            <tbody id="matrixBody" class="divide-y divide-gray-200">
                                <tr><td class="p-10 text-center text-gray-500">Memuat matriks akses...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        let currentPermissions = {}; // Store state

        async function init() {
            try {
                const res = await fetch('sadigs_api_v3/manage_access_api.php');
                const data = await res.json();

                if (data.success) {
                    renderMatrix(data.roles, data.menus, data.permissions);
                } else {
                    alert('Gagal memuat data: ' + data.message);
                }
            } catch (e) { console.error(e); alert('Koneksi error.'); }
        }

        function renderMatrix(roles, menus, perms) {
            const headerRow = document.getElementById('headerRow');
            const tbody = document.getElementById('matrixBody');
            
            // 1. Render Header (Roles)
            // Reset header keep first col
            headerRow.innerHTML = '<th class="px-4 py-3 text-left font-bold text-gray-700 uppercase sticky top-0 z-20 bg-gray-100 sticky-col border-r border-gray-200 shadow-sm min-w-[250px]">Menu Aplikasi</th>';
            
            roles.forEach(role => {
                const th = document.createElement('th');
                th.className = "px-4 py-3 text-center font-bold text-gray-600 sticky top-0 z-10 bg-gray-100 min-w-[100px] border-b border-gray-200 draggable-header";
                
                // --- DRAG & DROP EVENTS ---
                th.draggable = true;
                th.addEventListener('dragstart', handleDragStart);
                th.addEventListener('dragover', handleDragOver);
                th.addEventListener('drop', handleDrop);
                th.addEventListener('dragenter', handleDragEnter);
                th.addEventListener('dragleave', handleDragLeave);

                th.innerHTML = `<div class="writing-mode-vertical transform -rotate-45 origin-bottom-left translate-x-4 mb-2">${role}</div>`; // Style miring biar muat
                th.title = "Klik & Tahan untuk geser"; // Tooltip bantuan
                headerRow.appendChild(th);
            });

            // 2. Render Body (Menus & Checkboxes)
            tbody.innerHTML = '';
            let lastCategory = '';

            menus.forEach(menu => {
                // Group Header
                const catLabel = menu.category_label || 'Lainnya';
                if (catLabel !== lastCategory) {
                    const trCat = document.createElement('tr');
                    trCat.className = "bg-gray-50";
                    trCat.innerHTML = `<td class="px-4 py-2 font-bold text-xs text-gray-500 uppercase tracking-wider sticky-col bg-gray-50">${catLabel}</td><td colspan="${roles.length}" class="bg-gray-50"></td>`;
                    tbody.appendChild(trCat);
                    lastCategory = catLabel;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50 transition";
                
                // Menu Name Column
                tr.innerHTML = `
                    <td class="px-4 py-2 font-medium text-gray-800 border-r border-gray-200 sticky-col bg-white">
                        ${menu.menu_name}
                        <div class="text-[10px] text-gray-400 font-mono">${menu.menu_id}</div>
                    </td>
                `;

                // Checkbox Columns
                roles.forEach(role => {
                    const isAllowed = perms[role] && perms[role][menu.menu_id] == 1;
                    const td = document.createElement('td');
                    td.className = "px-2 py-2 text-center border-r border-gray-100";
                    td.innerHTML = `
                        <input type="checkbox" 
                            class="w-5 h-5 text-teal-600 rounded focus:ring-teal-500 cursor-pointer transition transform hover:scale-110"
                            data-role="${role}" 
                            data-menu="${menu.menu_id}"
                            ${isAllowed ? 'checked' : ''}>
                    `;
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
        }

        // --- DRAG & DROP LOGIC ---
        let dragSrcEl = null;

        function handleDragStart(e) {
            dragSrcEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
            this.style.opacity = '0.4';
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) { this.classList.add('drag-over'); }
        function handleDragLeave(e) { this.classList.remove('drag-over'); }

        function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            this.style.opacity = '1';
            
            // Bersihkan style drag-over dari semua header
            document.querySelectorAll('th').forEach(th => th.classList.remove('drag-over'));

            if (dragSrcEl !== this) {
                // Hitung index kolom (karena ada sticky col di index 0, maka index header = index kolom tabel)
                const headers = Array.from(this.parentNode.children);
                const srcIdx = headers.indexOf(dragSrcEl);
                const targetIdx = headers.indexOf(this);
                
                moveColumn(srcIdx, targetIdx);
            }
            return false;
        }

        function moveColumn(srcIdx, targetIdx) {
            const table = document.querySelector('table');
            const rows = table.querySelectorAll('tr');
            
            rows.forEach(row => {
                const cells = row.children;
                // Pastikan row punya cukup cell (untuk row kategori yang colspan mungkin beda, tapi kita handle row data)
                if (cells.length > srcIdx && cells.length > targetIdx) {
                    const srcCell = cells[srcIdx];
                    const targetCell = cells[targetIdx];
                    
                    // Pindahkan elemen DOM
                    if (srcIdx < targetIdx) { row.insertBefore(srcCell, targetCell.nextSibling); }
                    else { row.insertBefore(srcCell, targetCell); }
                }
            });
        }

        async function savePermissions() {
            const btn = document.getElementById('saveBtn');
            const originalContent = btn.innerHTML;
            
            // --- UX: UBAH TOMBOL JADI LOADING ---
            btn.disabled = true;
            btn.classList.remove('bg-teal-600', 'hover:bg-teal-700');
            btn.classList.add('bg-gray-400', 'cursor-not-allowed');
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> <span>Menyimpan...</span>`;
            lucide.createIcons();

            // Collect Data
            const updates = [];
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                updates.push({
                    role: cb.dataset.role,
                    menu_id: cb.dataset.menu,
                    allowed: cb.checked ? 1 : 0
                });
            });

            try {
                const res = await fetch('sadigs_api_v3/manage_access_api.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ updates })
                });
                const result = await res.json();
                
                // --- UX: KEMBALIKAN TOMBOL ---
                if(result.success) {
                    btn.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> <span>Tersimpan!</span>`;
                    btn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                    btn.classList.add('bg-green-600');
                    lucide.createIcons();
                    
                    // Reset ke normal setelah 2 detik
                    setTimeout(() => {
                        btn.innerHTML = originalContent;
                        btn.classList.remove('bg-green-600');
                        btn.classList.add('bg-teal-600', 'hover:bg-teal-700');
                        btn.disabled = false;
                        lucide.createIcons();
                    }, 2000);
                } else {
                    alert('Gagal: ' + result.message);
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                    btn.classList.add('bg-teal-600');
                }
            } catch(e) {
                alert('Terjadi kesalahan koneksi.');
                btn.disabled = false;
                btn.innerHTML = originalContent;
                btn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                btn.classList.add('bg-teal-600');
            }
        }

        init();
    </script>
</body>
</html>
