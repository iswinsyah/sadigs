<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Akses & Struktur Menu | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SortableJS untuk Drag & Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;}
        .sortable-ghost { opacity: 0.4; background-color: #f3f4f6; border: 2px dashed #cbd5e1; }
        .sortable-drag { cursor: grabbing; }
        .menu-item { cursor: grab; }
        .menu-item:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <img src="assets/img/logo.png" alt="Logo Sekolah" class="h-9">
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-6 gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Manajemen Akses & Menu</h1>
                        <p class="text-sm text-gray-500">Atur izin akses peran dan susunan menu (Drag & Drop).</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="switchTab('permissions')" id="tabPerms" class="px-4 py-2 bg-teal-600 text-white rounded-lg font-bold shadow-sm transition">Izin Akses</button>
                        <button onclick="switchTab('structure')" id="tabStruct" class="px-4 py-2 bg-white text-gray-600 border border-gray-300 hover:bg-gray-50 rounded-lg font-bold shadow-sm transition">Susunan Menu</button>
                    </div>
                </div>

                <!-- TAB 1: IZIN AKSES (MATRIX) -->
                <div id="viewPermissions" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-auto max-h-[75vh]">
                        <table class="min-w-full divide-y divide-gray-200" id="permsTable">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider sticky left-0 top-0 bg-gray-50 z-20 shadow-sm border-r">Menu / Fitur</th>
                                    <!-- Role headers will be injected here -->
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="permsBody">
                                <tr><td class="p-8 text-center text-gray-400">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="p-4 border-t border-gray-100 bg-gray-50 flex justify-end">
                        <button onclick="saveChanges()" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-lg font-bold shadow-md transition flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i> Simpan Perubahan Izin
                        </button>
                    </div>
                </div>

                <!-- TAB 2: STRUKTUR MENU (DRAG & DROP) -->
                <div id="viewStructure" class="hidden">
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 rounded-r-lg">
                        <div class="flex">
                            <div class="flex-shrink-0"><i data-lucide="info" class="h-5 w-5 text-yellow-400"></i></div>
                            <div class="ml-3"><p class="text-sm text-yellow-700">Geser menu antar kotak untuk memindahkan kelompok. Perubahan akan langsung mengubah tampilan Sidebar Dashboard.</p></div>
                        </div>
                    </div>
                    
                    <div id="structureContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Categories will be injected here -->
                    </div>

                    <div class="fixed bottom-6 right-6">
                        <button onclick="saveStructure()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full font-bold shadow-xl transition flex items-center gap-2 transform hover:scale-105">
                            <i data-lucide="save" class="w-5 h-5"></i> Simpan Susunan
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        let globalData = null;
        let pendingUpdates = [];

        function switchTab(tab) {
            if(tab === 'permissions') {
                document.getElementById('viewPermissions').classList.remove('hidden');
                document.getElementById('viewStructure').classList.add('hidden');
                document.getElementById('tabPerms').className = "px-4 py-2 bg-teal-600 text-white rounded-lg font-bold shadow-sm transition";
                document.getElementById('tabStruct').className = "px-4 py-2 bg-white text-gray-600 border border-gray-300 hover:bg-gray-50 rounded-lg font-bold shadow-sm transition";
            } else {
                document.getElementById('viewPermissions').classList.add('hidden');
                document.getElementById('viewStructure').classList.remove('hidden');
                document.getElementById('tabPerms').className = "px-4 py-2 bg-white text-gray-600 border border-gray-300 hover:bg-gray-50 rounded-lg font-bold shadow-sm transition";
                document.getElementById('tabStruct').className = "px-4 py-2 bg-teal-600 text-white rounded-lg font-bold shadow-sm transition";
                renderStructure(); // Render saat tab dibuka
            }
        }

        async function loadData() {
            try {
                const res = await fetch('sadigs_api_v3/menu_manager.php');
                globalData = await res.json();
                if (!globalData.success && globalData.message) throw new Error(globalData.message);
                renderPermissions();
            } catch (e) {
                document.getElementById('permsBody').innerHTML = `<tr><td colspan="100%" class="p-8 text-center text-red-500 font-bold">Gagal memuat data: ${e.message}<br><button onclick="location.reload()" class="mt-2 text-blue-600 underline">Coba Refresh</button></td></tr>`;
            }
        }

        function renderPermissions() {
            const thead = document.querySelector('#permsTable thead tr');
            const tbody = document.getElementById('permsBody');
            
            // Render Headers
            let headerHTML = '<th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider sticky left-0 top-0 bg-gray-50 z-20 shadow-sm border-r">Menu / Fitur</th>';
            globalData.roles.forEach(role => {
                headerHTML += `<th class="px-4 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider min-w-[100px] sticky top-0 bg-gray-50 z-10 shadow-sm">${role}</th>`;
            });
            thead.innerHTML = headerHTML;

            // Definisi Kelompok Widget
            const widgetGroups = {
                'formulir': { label: '1. FORMULIR & INPUT', menus: [] },
                'validasi': { label: '2. VALIDASI / VERIFIKASI', menus: [] },
                'tabel': { label: '3. TABEL DATA & ARSIP', menus: [] },
                'grafik': { label: '4. GRAFIK & MONITORING', menus: [] },
                'lainnya': { label: 'LAINNYA', menus: [] }
            };

            // Mapping Menu ke Kelompok
            const menuMapping = {
                // 1. Formulir
                'navBuatPeraturan': 'formulir', 'navFormulirTransaksi': 'formulir', 'navIzinPegawai': 'formulir', 
                'navRapat': 'formulir', 'navRppGenerator': 'formulir', 'navInputNilai': 'formulir', 
                'navInputTahfizh': 'formulir', 'navIbadahHarian': 'formulir', 'navIzinWalisantri': 'formulir', 
                'navPocketMoneyDeposit': 'formulir', 'navFormulirPembayaran': 'formulir', 'navAturKurikulum': 'formulir', 
                'navCalendarSettings': 'formulir', 'navQuota': 'formulir', 'navKetersediaanMengajar': 'formulir',
                'navMenuManagement': 'formulir',

                // 2. Validasi
                'navVerifikasi': 'validasi', 'navValidasiIzin': 'validasi', 'navValidasiPeraturan': 'validasi', 
                'navValidasiPembayaran': 'validasi', 'navPocketMoneyValidation': 'validasi', 'navValidasiIbadah': 'validasi', 
                'navGuardianLeaveValidation': 'validasi', 'navMusyrifWithdrawalValidation': 'validasi',

                // 3. Tabel Data
                'navUserCredentials': 'tabel', 'navBukuIndukSantri': 'tabel', 'navDaftarIzin': 'tabel', 
                'navOnLeaveList': 'tabel', 'navTabelPembayaran': 'tabel', 'navTabelTransaksi': 'tabel', 
                'navAbsensi': 'tabel', 'navBiodataPegawai': 'tabel', 'navBukuIndukPegawai': 'tabel', 
                'navJadwalRapat': 'tabel', 'navRppAlbum': 'tabel', 'navPerencanaanAkademik': 'tabel', 'navManajemenKelas': 'tabel',
                'navMentoring': 'tabel', 'navMusyrifPocketMoney': 'tabel', 'navBiodataSantri': 'tabel', 
                'navSantriPocketMoney': 'tabel', 'navViewTahfizh': 'tabel', 'navJadwalPelajaran': 'tabel', 
                'navKalender': 'tabel',

                // 4. Grafik
                'navDashboard': 'grafik', 'navYayasanWidget': 'grafik', 'navMusyrifWidget': 'grafik', 
                'navProfil': 'grafik', 'navPenilaianKinerja': 'grafik', 'navMonitoringAkademik': 'grafik', 
                'navRekapPembayaran': 'grafik', 'navRekapIbadahAnak': 'grafik', 'navMonitoringAnak': 'grafik'
            };

            // Kelompokkan Menu
            Object.keys(globalData.menu_names).forEach(menuId => {
                const groupKey = menuMapping[menuId] || 'lainnya';
                widgetGroups[groupKey].menus.push(menuId);
            });

            // Render Body
            tbody.innerHTML = '';
            for (const [key, group] of Object.entries(widgetGroups)) {
                if (group.menus.length === 0) continue;

                // Category Row
                tbody.innerHTML += `<tr class="bg-gray-100"><td colspan="${globalData.roles.length + 1}" class="px-6 py-2 text-xs font-bold text-gray-600 uppercase tracking-wider sticky left-0 bg-gray-100 z-10">${group.label}</td></tr>`;
                
                group.menus.forEach(menuId => {
                    const menuName = globalData.menu_names[menuId] || menuId;
                    let rowHTML = `<tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-3 text-sm font-medium text-gray-800 sticky left-0 bg-white z-10 border-r shadow-sm flex items-center gap-2">
                            <i data-lucide="${globalData.menu_icons?.[menuId] || 'circle'}" class="w-4 h-4 text-gray-400"></i> ${menuName}
                        </td>`;
                    
                    globalData.roles.forEach(role => {
                        const isAllowed = globalData.matrix[menuId]?.[role] === 1;
                        rowHTML += `
                            <td class="px-4 py-3 text-center">
                                <input type="checkbox" 
                                    onchange="trackChange('${role}', '${menuId}', this.checked)"
                                    ${isAllowed ? 'checked' : ''} 
                                    class="w-5 h-5 text-teal-600 rounded border-gray-300 focus:ring-teal-500 cursor-pointer">
                            </td>`;
                    });
                    rowHTML += '</tr>';
                    tbody.innerHTML += rowHTML;
                });
            }
            lucide.createIcons();
        }

        function trackChange(role, menu, isChecked) {
            pendingUpdates.push({ role: role, menu: menu, state: isChecked ? 1 : 0 });
        }

        async function saveChanges() {
            if(pendingUpdates.length === 0) return alert("Tidak ada perubahan.");
            const res = await fetch('sadigs_api_v3/menu_manager.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ updates: pendingUpdates })
            });
            const result = await res.json();
            if(result.success) { alert("Perubahan tersimpan!"); pendingUpdates = []; loadData(); }
            else alert("Gagal menyimpan.");
        }

        // --- LOGIKA DRAG & DROP ---
        function renderStructure() {
            const container = document.getElementById('structureContainer');
            container.innerHTML = '';

            // 1. Siapkan wadah kategori & helper
            const tempCategories = JSON.parse(JSON.stringify(globalData.categories));
            Object.keys(tempCategories).forEach(k => tempCategories[k].menus = []);
            const roles = globalData.roles;
            const matrix = globalData.matrix;
            const hasRoles = (allowed, targets) => targets.every(t => allowed.includes(t));
            const arraysAreEqual = (a, b) => {
                if (a.length !== b.length) return false;
                const setA = new Set(a);
                for (const item of b) {
                    if (!setA.has(item)) return false;
                }
                return true;
            };

            // Prioritas Role untuk penentuan kategori (Hierarki Tertinggi ke Terendah)
            // Jika menu dishare, akan ikut kategori role dengan prioritas lebih tinggi
            const rolePriority = ['Ketua Yayasan', 'Sekretaris Yayasan', 'Bendahara Yayasan', 'Kepala Sekolah', 'Admin Sekolah', 'Sekretaris Sekolah', 'Bendahara Sekolah', 'Kepala Asrama Putra', 'Kepala Asrama Putri', 'Musyrif', 'Ustadz', 'Santri Rijal', 'Walisantri'];

            // 2. Logika Pengelompokan Otomatis
            Object.keys(globalData.menu_names).forEach(menuId => {
                // Ambil role yang diizinkan untuk menu ini
                const allowed = roles.filter(r => matrix[menuId]?.[r] === 1);
                
                let targetCat = null;

                // ATURAN BARU: DIV KHUSUS (Akses Eksklusif)
                if (arraysAreEqual(allowed, ['Ketua Yayasan'])) {
                    targetCat = 'KetuaYayasan';
                } else if (arraysAreEqual(allowed, ['Sekretaris Yayasan'])) {
                    targetCat = 'SekretarisYayasan';
                } else if (arraysAreEqual(allowed, ['Bendahara Yayasan'])) {
                    targetCat = 'BendaharaYayasan';
                } else if (arraysAreEqual(allowed, ['Kepala Sekolah'])) {
                    targetCat = 'KepalaSekolah';
                } else if (arraysAreEqual(allowed, ['Admin Sekolah'])) {
                    targetCat = 'AdminSekolah';
                } else if (arraysAreEqual(allowed, ['Sekretaris Sekolah'])) {
                    targetCat = 'SekretarisSekolah';
                } else if (arraysAreEqual(allowed, ['Bendahara Sekolah'])) {
                    targetCat = 'BendaharaSekolah';
                } else if (arraysAreEqual(allowed, ['Kepala Asrama Putra', 'Kepala Asrama Putri'])) {
                    targetCat = 'KepalaAsrama';
                } else if (arraysAreEqual(allowed, ['Musyrif', 'Musyrifah'])) {
                    targetCat = 'Musyrif';
                } else if (arraysAreEqual(allowed, ['Ustadz', 'Ustadzah'])) {
                    targetCat = 'Ustadz';
                } else if (arraysAreEqual(allowed, ['Santri Rijal', 'Santri Nisa\''])) {
                    targetCat = 'Santri';
                } else if (arraysAreEqual(allowed, ['Walisantri'])) {
                    targetCat = 'Walisantri';
                }

                // Jika tidak ada aturan eksklusif yang cocok, gunakan aturan lama
                if (!targetCat) {
                    if (allowed.length === roles.length && allowed.length > 0) {
                        targetCat = 'Umum';
                    } else if (hasRoles(allowed, ['Ketua Yayasan', 'Sekretaris Yayasan', 'Bendahara Yayasan'])) {
                        targetCat = 'ManajemenYayasan';
                    } else if (hasRoles(allowed, ['Kepala Sekolah', 'Admin Sekolah', 'Sekretaris Sekolah', 'Bendahara Sekolah', 'Kepala Asrama Putra', 'Kepala Asrama Putri', 'Musyrif', 'Musyrifah', 'Ustadz', 'Ustadzah'])) {
                        targetCat = 'Kepegawaian';
                    } else if (hasRoles(allowed, ['Kepala Sekolah', 'Admin Sekolah', 'Sekretaris Sekolah', 'Bendahara Sekolah'])) {
                        targetCat = 'ManajemenSekolah';
                    } else if (allowed.length > 0) {
                        // Cari role dengan prioritas tertinggi yang punya akses
                        // Agar menu shared tidak masuk ke kategori level bawah (misal: Menu Santri yang bisa dilihat Ketua Yayasan jangan masuk Div Santri)
                        const firstRole = allowed.sort((a, b) => {
                            const idxA = rolePriority.indexOf(a);
                            const idxB = rolePriority.indexOf(b);
                            return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
                        })[0];
                        const normalized = firstRole.replace(/\s+/g, '');
                        if (tempCategories[normalized]) targetCat = normalized;
                        else if (firstRole.includes('Kepala Asrama')) targetCat = 'KepalaAsrama';
                        else if (firstRole.includes('Musyrif')) targetCat = 'Musyrif';
                        else if (firstRole.includes('Ustadz')) targetCat = 'Ustadz';
                        else if (firstRole.includes('Santri')) targetCat = 'Santri';
                        else if (firstRole.includes('Walisantri')) targetCat = 'Walisantri';
                        else targetCat = 'Umum';
                    } else {
                        return; // Jangan tampilkan menu yang tidak punya izin sama sekali
                    }
                }

                // Pastikan kategori target ada, jika tidak masukkan ke Umum
                if (!tempCategories[targetCat]) {
                    targetCat = 'Umum';
                }

                tempCategories[targetCat].menus.push(menuId);
            });

            // 3. Render ke HTML
            for (const [catId, cat] of Object.entries(tempCategories)) {
                const catDiv = document.createElement('div');
                catDiv.className = "bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col";
                catDiv.innerHTML = `
                    <div class="p-3 bg-gray-50 border-b border-gray-200 font-bold text-xs text-gray-500 uppercase tracking-wider flex justify-between items-center">
                        <span>${cat.label}</span>
                        <span class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full text-[10px]">${cat.menus.length}</span>
                    </div>
                    <div class="p-2 flex-1 min-h-[50px] space-y-2 sortable-list" data-cat-id="${catId}">
                        ${cat.menus.map(menuId => `
                            <div class="menu-item bg-white border border-gray-200 p-2 rounded-lg shadow-sm text-sm flex items-center gap-2 hover:border-teal-400 transition" data-menu-id="${menuId}">
                                <i data-lucide="${globalData.menu_icons?.[menuId] || 'circle'}" class="w-4 h-4 text-gray-400"></i>
                                <span class="font-medium text-gray-700">${globalData.menu_names[menuId] || menuId}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(catDiv);
            }
            lucide.createIcons();

            // Init SortableJS
            document.querySelectorAll('.sortable-list').forEach(el => {
                new Sortable(el, {
                    group: 'shared', // Allow dragging between lists
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag'
                });
            });
        }

        async function saveStructure() {
            const structureUpdates = [];
            const permissionUpdates = [];

            // Mapping Kategori ke Role untuk Sinkronisasi Izin Otomatis
            const categoryRoleMapping = {
                'KetuaYayasan': ['Ketua Yayasan'],
                'SekretarisYayasan': ['Sekretaris Yayasan'],
                'BendaharaYayasan': ['Bendahara Yayasan'],
                'KepalaSekolah': ['Kepala Sekolah'],
                'AdminSekolah': ['Admin Sekolah'],
                'SekretarisSekolah': ['Sekretaris Sekolah'],
                'BendaharaSekolah': ['Bendahara Sekolah'],
                'KepalaAsrama': ['Kepala Asrama Putra', 'Kepala Asrama Putri'],
                'Musyrif': ['Musyrif', 'Musyrifah'],
                'Ustadz': ['Ustadz', 'Ustadzah'],
                'Santri': ['Santri Rijal', "Santri Nisa'"],
                'Walisantri': ['Walisantri'],
                'ManajemenYayasan': ['Ketua Yayasan', 'Sekretaris Yayasan', 'Bendahara Yayasan'],
                'ManajemenSekolah': ['Kepala Sekolah', 'Admin Sekolah', 'Sekretaris Sekolah', 'Bendahara Sekolah'],
                'Kepegawaian': ['Kepala Sekolah', 'Admin Sekolah', 'Sekretaris Sekolah', 'Bendahara Sekolah', 'Kepala Asrama Putra', 'Kepala Asrama Putri', 'Musyrif', 'Musyrifah', 'Ustadz', 'Ustadzah'],
                'Umum': globalData.roles // Semua role
            };

            document.querySelectorAll('.sortable-list').forEach(list => {
                const catId = list.getAttribute('data-cat-id');
                const targetRoles = categoryRoleMapping[catId];

                list.querySelectorAll('.menu-item').forEach((item, index) => {
                    const menuId = item.getAttribute('data-menu-id');
                    
                    // 1. Update Struktur (Urutan & Kategori)
                    structureUpdates.push({
                        menu_id: menuId,
                        category_id: catId,
                        sort_order: index + 1
                    });

                    // 2. Update Izin (Otomatis Centang/Hapus Centang)
                    if (targetRoles) {
                        globalData.roles.forEach(role => {
                            const shouldHaveAccess = targetRoles.includes(role);
                            permissionUpdates.push({
                                role: role,
                                menu: menuId,
                                state: shouldHaveAccess ? 1 : 0
                            });
                        });
                    }
                });
            });

            // Kirim Update Struktur
            await fetch('sadigs_api_v3/menu_manager.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ structure_updates: structureUpdates })
            });
            
            // Kirim Update Izin
            if (permissionUpdates.length > 0) {
                await fetch('sadigs_api_v3/menu_manager.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ updates: permissionUpdates })
                });
            }

            alert("Susunan menu dan Izin Akses berhasil disimpan!");
            loadData();
        }

        loadData();
    </script>
</body>
</html>
