<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Jurnal Mengajar | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6 border-b border-gray-100 bg-teal-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-teal-200 flex items-center justify-center text-teal-800 font-bold text-lg shadow-sm"><span id="userInitial">U</span></div>
                    <div class="overflow-hidden">
                        <p id="sidebarUsername" class="font-bold text-gray-800 text-sm truncate">Memuat...</p>
                        <p id="sidebarRole" class="text-xs text-gray-500 truncate font-medium">Role...</p>
                    </div>
                </div>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2"></nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-2xl mx-auto">
                <div class="flex items-center gap-3 mb-6">
                    <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
                    <h1 class="text-2xl font-bold text-gray-800">Isi Jurnal Mengajar</h1>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <form id="journalForm" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Tanggal</label>
                                <input type="date" name="teaching_date" id="tDate" class="w-full p-2 border border-gray-300 rounded-lg" required>
                            </div>
                            <div class="flex gap-2">
                                <div class="flex-1">
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Jam Mulai</label>
                                    <input type="time" name="start_time" class="w-full p-2 border border-gray-300 rounded-lg" required>
                                </div>
                                <div class="flex-1">
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Jam Selesai</label>
                                    <input type="time" name="end_time" class="w-full p-2 border border-gray-300 rounded-lg" required>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Kelas</label>
                                <select name="grade" class="w-full p-2 border border-gray-300 rounded-lg bg-white" required>
                                    <option value="">- Pilih Kelas -</option>
                                    <option value="7">Kelas 7</option>
                                    <option value="8">Kelas 8</option>
                                    <option value="9">Kelas 9</option>
                                    <option value="10">Kelas 10</option>
                                    <option value="11">Kelas 11</option>
                                    <option value="12">Kelas 12</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Mata Pelajaran</label>
                                <input type="text" name="subject" class="w-full p-2 border border-gray-300 rounded-lg" placeholder="Contoh: Fiqih" required>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Materi / Topik Bahasan</label>
                            <input type="text" name="topic" class="w-full p-2 border border-gray-300 rounded-lg" placeholder="Contoh: Bab Thaharah" required>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Catatan / Keterangan (Opsional)</label>
                            <textarea name="notes" rows="2" class="w-full p-2 border border-gray-300 rounded-lg" placeholder="Catatan tambahan..."></textarea>
                        </div>

                        <!-- Lokasi (Hidden) -->
                        <input type="hidden" name="latitude" id="lat">
                        <input type="hidden" name="longitude" id="long">

                        <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg shadow-md transition flex justify-center items-center gap-2">
                            <i data-lucide="save" class="w-5 h-5"></i> Simpan Jurnal
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Jam Digital
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID', {hour12: false});
            document.getElementById('currentDate').textContent = now.toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Sidebar & Session (Simplified)
        fetch('sadigs_api_v3/session_check.php').then(r=>r.json()).then(d=>{
            if(!d.success) window.location.href='index.html';
            document.getElementById('sidebarUsername').textContent = d.username;
            document.getElementById('userInitial').textContent = d.username.charAt(0).toUpperCase();
            document.getElementById('teacherNameDisplay').value = d.username; // Isi Nama Ustadz Otomatis
            document.getElementById('sidebarRole').textContent = d.roles.join(', ');
            // Render menu simple
            document.getElementById('sidebarNav').innerHTML = `<div class="p-4"><a href="dashboard.html" class="block text-teal-600 font-bold mb-2">Dashboard</a><a href="teaching_history.html" class="block text-gray-600 hover:text-teal-600">Lihat Riwayat</a></div>`;
            
            // PANGGIL FUNGSI CEK STATUS (PENTING!)
            checkActiveSession();
        });

        // Geolocation
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('lat').value = pos.coords.latitude;
                document.getElementById('long').value = pos.coords.longitude;
            });
        }

        async function checkActiveSession() {
            try {
                const res = await fetch('sadigs_api_v3/teaching_journal_api.php?action=get_active_session');
                const result = await res.json();
                
                document.getElementById('loadingState').classList.add('hidden');
                
                if (result.success && result.data) {
                    // Ada sesi aktif -> Tampilkan Form End
                    const s = result.data;
                    document.getElementById('startForm').classList.add('hidden');
                    document.getElementById('endForm').classList.remove('hidden');
                    
                    document.getElementById('sessionId').value = s.id;
                    document.getElementById('activeSubject').textContent = s.subject;
                    document.getElementById('activeGrade').textContent = "Kelas " + s.grade;
                    document.getElementById('activeStartTime').textContent = s.start_time.substring(0, 5);
                    
                    // Load Data Absensi Otomatis saat mau selesai
                    loadSystemAbsences();
                } else {
                    // Tidak ada sesi -> Tampilkan Form Start
                    document.getElementById('endForm').classList.add('hidden');
                    document.getElementById('startForm').classList.remove('hidden');
                }
            } catch(e) { console.error(e); }
        }

        async function loadSystemAbsences() {
            try {
                const res = await fetch('sadigs_api_v3/teaching_journal_api.php?action=get_absent_students');
                const result = await res.json();
                const infoBox = document.getElementById('systemAbsenceInfo');
                const textSpan = document.getElementById('absentListText');

                if (result.success && result.data.length > 0) {
                    const names = result.data.map(s => `${s.student_name} (${s.leave_type})`).join(', ');
                    textSpan.textContent = names;
                    infoBox.classList.remove('hidden');
                } else {
                    infoBox.classList.add('hidden');
                }
            } catch(e) { console.error("Gagal memuat data absensi", e); }
        }

        async function handleSubmission(formId, action) {
            const form = document.getElementById(formId);
            const btn = form.querySelector('button');
            const originalHTML = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Memproses...';

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.latitude = document.getElementById('lat').value;
            data.longitude = document.getElementById('long').value;

            try {
                const res = await fetch(`sadigs_api_v3/teaching_journal_api.php?action=${action}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.message);
                if(result.success) {
                    checkActiveSession(); // Refresh state
                    if (action === 'end_class') form.reset();
                }
            } catch(e) { alert('Gagal memproses.'); }
            finally { btn.disabled = false; btn.innerHTML = originalHTML; }
        }

        document.getElementById('startForm').addEventListener('submit', (e) => { e.preventDefault(); handleSubmission('startForm', 'start_class'); });
        document.getElementById('endForm').addEventListener('submit', (e) => { e.preventDefault(); handleSubmission('endForm', 'end_class'); });
    </script>
</body>
</html>
