<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketersediaan Mengajar | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-5xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Formulir Ketersediaan Mengajar</h1>
                        <p class="text-sm text-gray-500">Silakan isi mata pelajaran yang Anda ampu dan jam ketersediaan Anda.</p>
                    </div>
                    <button onclick="saveAvailability()" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-lg font-bold shadow-md flex items-center gap-2">
                        <i data-lucide="save" class="w-5 h-5"></i> Simpan Data
                    </button>
                </div>

                <!-- INPUT MAPEL -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Mata Pelajaran yang Diampu</label>
                    <p class="text-xs text-gray-500 mb-2">Pisahkan dengan koma jika lebih dari satu (Contoh: Matematika, Fisika)</p>
                    <input type="text" id="subjectsInput" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500" placeholder="Masukkan mata pelajaran...">
                </div>

                <!-- TABEL KETERSEDIAAN -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <h3 class="font-bold text-gray-800 mb-4">Jadwal Ketersediaan (Centang jika BISA mengajar)</h3>
                    <div class="overflow-x-auto">
                        <table class="min-w-full border-collapse">
                            <thead>
                                <tr>
                                    <th class="p-3 border bg-gray-50 text-left w-32">Hari</th>
                                    <!-- Generate Header Jam 1-8 -->
                                    <script>
                                        for(let i=1; i<=8; i++) document.write(`<th class="p-3 border bg-gray-50 text-center w-16">Jam ${i}</th>`);
                                    </script>
                                </tr>
                            </thead>
                            <tbody id="availabilityBody">
                                <!-- Rows will be generated by JS -->
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-4 flex gap-4 text-sm">
                        <button onclick="checkAll()" class="text-blue-600 hover:underline">Centang Semua</button>
                        <button onclick="uncheckAll()" class="text-red-600 hover:underline">Hapus Semua Centang</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const periods = 8;

        // Init Table
        const tbody = document.getElementById('availabilityBody');
        days.forEach(day => {
            let row = `<tr class="hover:bg-gray-50"><td class="p-3 border font-bold text-gray-700">${day}</td>`;
            for(let i=1; i<=periods; i++) {
                row += `<td class="p-3 border text-center">
                            <input type="checkbox" data-day="${day}" data-period="${i}" class="w-5 h-5 text-teal-600 rounded focus:ring-teal-500 cursor-pointer transition">
                        </td>`;
            }
            row += `</tr>`;
            tbody.innerHTML += row;
        });

        async function loadData() {
            try {
                const res = await fetch('sadigs_api_v3/schedule_api.php?action=get_availability');
                const result = await res.json();
                
                if(result.success) {
                    // Load Subjects
                    if(result.data.subjects) {
                        document.getElementById('subjectsInput').value = result.data.subjects.join(', ');
                    }

                    // Load Checkboxes
                    const avail = result.data.availability || {};
                    for (const [day, slots] of Object.entries(avail)) {
                        slots.forEach(period => {
                            const cb = document.querySelector(`input[data-day="${day}"][data-period="${period}"]`);
                            if(cb) cb.checked = true;
                        });
                    }
                }
            } catch(e) {
                console.error("Gagal memuat data:", e);
            }
        }

        async function saveAvailability() {
            const subjects = document.getElementById('subjectsInput').value.split(',').map(s => s.trim()).filter(s => s !== '');
            const availability = {};

            days.forEach(day => {
                availability[day] = [];
                for(let i=1; i<=periods; i++) {
                    const cb = document.querySelector(`input[data-day="${day}"][data-period="${i}"]`);
                    if(cb && cb.checked) {
                        availability[day].push(i);
                    }
                }
            });

            try {
                const res = await fetch('sadigs_api_v3/schedule_api.php?action=save_availability', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ subjects, availability })
                });
                const result = await res.json();
                alert(result.message);
            } catch(e) {
                alert("Gagal menyimpan data.");
            }
        }

        function checkAll() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
        }
        function uncheckAll() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        }

        loadData();
    </script>
</body>
</html>
