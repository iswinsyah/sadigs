<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pembayaran | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <!-- Div 5: KEUANGAN -->
                <div id="groupKeuangan" class="bg-gray-50 rounded-lg p-2 mt-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KEUANGAN</h3>
                    <a id="navFormulirPembayaran" href="payment_form.html" class="flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="credit-card" class="w-5 h-5"></i> Formulir Pembayaran</a>
                    <a id="navValidasiPembayaran" href="payment_validation.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="check-circle-2" class="w-5 h-5"></i> Validasi Pembayaran</a>
                    <a id="navTabelPembayaran" href="payment_list.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="banknote" class="w-5 h-5"></i> Data Pembayaran</a>
                    <a id="navRekapPembayaran" href="payment_recap.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="pie-chart" class="w-5 h-5"></i> Rekap Keuangan</a>
                </div>
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Formulir Pembayaran</h2>
                <p class="text-gray-500 text-sm mt-1">Konfirmasi pembayaran SPP atau tagihan lainnya.</p>
            </header>

            <div class="max-w-2xl bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                <form id="paymentForm" class="space-y-6" enctype="multipart/form-data">
                    
                    <!-- Pilih Anak (Otomatis terisi jika Walisantri) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pembayaran Untuk Santri</label>
                        <select id="studentSelect" name="student_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white" required>
                            <option value="">Memuat data anak...</option>
                        </select>
                    </div>

                    <!-- Jenis Pembayaran -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Pembayaran</label>
                        <select name="payment_type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white" required>
                            <option value="SPP Bulanan">SPP Bulanan</option>
                            <option value="Uang Gedung">Uang Gedung</option>
                            <option value="Daftar Ulang">Daftar Ulang</option>
                            <option value="Donasi">Donasi</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>

                    <!-- Nominal -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nominal Transfer (Rp)</label>
                        <input type="number" name="amount" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Contoh: 500000" required>
                    </div>

                    <!-- Tanggal Transfer -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Transfer</label>
                        <input type="date" name="payment_date" id="paymentDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
                    </div>

                    <!-- Bukti Transfer -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bukti Transfer (Foto/Screenshot)</label>
                        <input type="file" name="proof_file" accept="image/*,application/pdf" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100" required>
                        <p class="text-xs text-gray-400 mt-1">Format: JPG, PNG, atau PDF. Maksimal 2MB.</p>
                    </div>

                    <!-- Catatan -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Catatan Tambahan (Opsional)</label>
                        <textarea name="notes" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Keterangan bulan atau detail lainnya"></textarea>
                    </div>

                    <div class="pt-4">
                        <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition shadow-md flex justify-center items-center gap-2">
                            <i data-lucide="send" class="w-5 h-5"></i> Kirim Konfirmasi
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('paymentDate').value = new Date().toISOString().split('T')[0];

        async function initPage() {
            // 1. Cek Sesi
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            // 2. Cek Izin Menu (Agar menu lain muncul jika user punya akses)
            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                if (permData.success) {
                    const allowedMenus = permData.permissions || [];
                    allowedMenus.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.classList.remove('hidden');
                    });
                }
            } catch (e) { console.error("Gagal memuat izin menu:", e); }

            // 3. Muat Data Anak (Jika Walisantri)
            loadChildren();
        }

        async function loadChildren() {
            const select = document.getElementById('studentSelect');
            try {
                const res = await fetch('sadigs_api_v3/get_my_children.php');
                const result = await res.json();
                
                if (result.success && result.children.length > 0) {
                    select.innerHTML = '<option value="">- Pilih Santri -</option>';
                    result.children.forEach(child => {
                        select.innerHTML += `<option value="${child.user_id}">${child.full_name || child.username}</option>`;
                    });
                } else {
                    select.innerHTML = '<option value="">Data anak tidak ditemukan</option>';
                }
            } catch (e) {
                select.innerHTML = '<option value="">Gagal memuat data</option>';
            }
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Mengirim...';

            const formData = new FormData(e.target);

            try {
                const res = await fetch('sadigs_api_v3/submit_payment.php', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                alert(result.message);
                if(result.success) window.location.href = 'payment_list.html';
            } catch (error) { alert('Terjadi kesalahan koneksi.'); }
            finally { btn.disabled = false; btn.innerHTML = originalText; }
        });

        initPage();
    </script>
</body>
</html>
