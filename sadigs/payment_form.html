<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pembayaran Keuangan | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <!-- Menu akan dimuat oleh JS -->
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Formulir Pembayaran Keuangan</h2>
                <p class="text-gray-500 text-sm mt-1">Konfirmasi pembayaran SPP atau tagihan lainnya untuk putra/putri Anda.</p>
            </header>

            <div class="max-w-4xl bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                <form id="paymentForm" class="space-y-6" enctype="multipart/form-data">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Pilih Anak -->
                        <div>
                            <label for="studentUsername" class="block text-sm font-medium text-gray-700 mb-1">1. Username Santri</label>
                            <input type="text" id="studentUsername" name="student_username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Masukkan username santri (case-sensitive)" required>
                        </div>

                        <!-- Tanggal Transfer -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">2. Tanggal Transaksi</label>
                            <input type="date" name="payment_date" id="paymentDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" required>
                        </div>
                    </div>

                    <!-- Rincian Pembayaran -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">3. Rincian Pembayaran</glabel>
                        <div class="overflow-x-auto border border-gray-200 rounded-lg">
                            <table class="min-w-full">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-2 py-2 text-center text-xs font-bold text-gray-500 uppercase w-12">No</th>
                                        <th class="px-4 py-2 text-left text-xs font-bold text-gray-500 uppercase">Uraian</th>
                                        <th class="px-4 py-2 text-left text-xs font-bold text-gray-500 uppercase w-48">Jumlah Nominal (Rp)</th>
                                    </tr>
                                </thead>
                                <tbody id="paymentDetailsBody" class="divide-y divide-gray-200">
                                    <!-- Rows will be generated by JS -->
                                </tbody>
                                <tfoot>
                                    <tr class="bg-gray-100 font-bold">
                                        <td colspan="2" class="px-4 py-2 text-right text-sm text-gray-800">Total</td>
                                        <td class="px-4 py-2 text-right text-sm text-gray-800">
                                            <span id="totalAmount">Rp 0</span>
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                    <!-- Bukti Transfer -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">4. Bukti Transfer (Foto/Screenshot)</label>
                        <input type="file" name="proof_file" accept="image/*,application/pdf" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100" required>
                        <p class="text-xs text-gray-400 mt-1">Format: JPG, PNG, atau PDF. Maksimal 2MB.</p>
                    </div>

                    <!-- Catatan -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">5. Catatan Tambahan (Opsional)</label>
                        <textarea name="notes" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Keterangan bulan, nama pengirim, atau detail lainnya"></textarea>
                    </div>

                    <div class="pt-4 border-t">
                        <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition shadow-md flex justify-center items-center gap-2">
                            <i data-lucide="send" class="w-5 h-5"></i> Kirim Konfirmasi Pembayaran
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('paymentDate').value = new Date().toISOString().split('T')[0];

        function renderSidebar(allowedMenus = []) {
            const sidebarNav = document.getElementById('sidebarNav');
            sidebarNav.innerHTML = `
                <div id="groupKeuangan" class="bg-gray-50 rounded-lg p-2 mt-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KEUANGAN</h3>
                    <a id="navFormulirPembayaran" href="payment_form.html" class="flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="credit-card" class="w-5 h-5"></i> Formulir Pembayaran</a>
                    <a id="navValidasiPembayaran" href="payment_validation.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="check-circle-2" class="w-5 h-5"></i> Validasi Pembayaran</a>
                    <a id="navTabelPembayaran" href="payment_list.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="banknote" class="w-5 h-5"></i> Data Pembayaran</a>
                </div>`;
            
            allowedMenus.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            });
            lucide.createIcons();
        }

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                const allowedMenus = permData.success ? permData.permissions : [];

                const thisMenuId = 'navFormulirPembayaran';
                if (!allowedMenus.includes(thisMenuId)) {
                    alert('Anda tidak memiliki izin untuk mengakses halaman ini.');
                    window.location.href = 'dashboard.html';
                    return;
                }
                renderSidebar(allowedMenus);
            } catch (e) { 
                alert('Gagal memuat izin akses. Silakan coba lagi.');
                window.location.href = 'dashboard.html';
            }

            generatePaymentRows();
        }

        function generatePaymentRows() {
            const tbody = document.getElementById('paymentDetailsBody');
            tbody.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-2 py-1 text-center text-sm text-gray-500">${i}</td>
                    <td class="px-4 py-1">
                        <input type="text" name="details[${i-1}][description]" class="w-full border-0 focus:ring-0 bg-transparent text-sm" placeholder="Contoh: SPP Bulan Juli">
                    </td>
                    <td class="px-4 py-1">
                        <input type="number" name="details[${i-1}][amount]" class="w-full border-0 focus:ring-0 bg-transparent text-sm text-right amount-input" placeholder="0" oninput="calculateTotal()">
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }

        window.calculateTotal = function() {
            let total = 0;
            document.querySelectorAll('.amount-input').forEach(input => {
                total += Number(input.value) || 0;
            });
            document.getElementById('totalAmount').textContent = 'Rp ' + total.toLocaleString('id-ID');
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Mengirim...';

            const formData = new FormData(e.target);
            
            // Filter out empty detail rows before sending
            const details = [];
            for (let i = 0; i < 10; i++) {
                const description = formData.get(`details[${i}][description]`);
                const amount = formData.get(`details[${i}][amount]`);
                if (description && amount && Number(amount) > 0) {
                    details.push({ description, amount });
                }
            }

            if (details.length === 0) {
                alert('Harap isi setidaknya satu baris rincian pembayaran dengan uraian dan jumlah nominal.');
                btn.disabled = false;
                btn.innerHTML = originalText;
                return;
            }

            // Create a new FormData to send clean data
            const finalFormData = new FormData();
            finalFormData.append('student_username', formData.get('student_username'));
            finalFormData.append('payment_date', formData.get('payment_date'));
            finalFormData.append('proof_file', formData.get('proof_file'));
            finalFormData.append('notes', formData.get('notes'));
            finalFormData.append('details', JSON.stringify(details)); // Send details as JSON string

            try {
                const res = await fetch('sadigs_api_v3/submit_payment.php', {
                    method: 'POST',
                    body: finalFormData // Send as FormData for file upload
                });
                const result = await res.json();
                alert(result.message);
                if(result.success) {
                    window.location.href = 'payment_list.html';
                }
            } catch (error) { 
                console.error(error);
                alert('Terjadi kesalahan koneksi.'); 
            }
            finally { 
                btn.disabled = false; 
                btn.innerHTML = originalText; 
            }
        });

        initPage();
    </script>
</body>
</html>
