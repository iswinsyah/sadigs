<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Jurnal Mengajar | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white"><h1 class="text-2xl font-extrabold">SADIGS</h1></div>
            <div class="p-6"><a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600"><i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali</a></div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-6xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Rekap Jurnal Mengajar</h1>
                        <p class="text-sm text-gray-500">Data kehadiran mengajar untuk perhitungan honorarium.</p>
                    </div>
                    <button onclick="window.print()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-50 flex items-center gap-2"><i data-lucide="printer" class="w-4 h-4"></i> Cetak</button>
                </div>

                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 items-end">
                    <div class="flex-1 w-full">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Dari Tanggal</label>
                        <input type="date" id="startDate" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
                    </div>
                    <div class="flex-1 w-full">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Sampai Tanggal</label>
                        <input type="date" id="endDate" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
                    </div>
                    <button onclick="loadRecap()" class="bg-teal-600 text-white px-6 py-2 rounded-lg text-sm font-bold hover:bg-teal-700 w-full md:w-auto">Tampilkan</button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left font-bold text-gray-500 uppercase">Tanggal</th>
                                <th class="px-6 py-3 text-left font-bold text-gray-500 uppercase">Nama Ustadz</th>
                                <th class="px-6 py-3 text-left font-bold text-gray-500 uppercase">Kelas & Mapel</th>
                                <th class="px-6 py-3 text-center font-bold text-gray-500 uppercase">Waktu</th>
                                <th class="px-6 py-3 text-center font-bold text-gray-500 uppercase">Lokasi</th>
                                <th class="px-6 py-3 text-center font-bold text-gray-500 uppercase">Durasi</th>
                            </tr>
                        </thead>
                        <tbody id="recapBody" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="6" class="p-8 text-center text-gray-400">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        const today = new Date();
        document.getElementById('startDate').valueAsDate = new Date(today.getFullYear(), today.getMonth(), 1);
        document.getElementById('endDate').valueAsDate = today;

        // Session Check
        fetch('sadigs_api_v3/session_check.php').then(r=>r.json()).then(d=>{
            if(!d.success) window.location.href='index.html';
            // Simple check role
            const allowed = ['Ketua Yayasan', 'Sekretaris Yayasan', 'Bendahara Yayasan', 'Admin Sekolah'];
            const hasAccess = d.roles.some(r => allowed.includes(r));
            if(!hasAccess) { alert('Akses ditolak.'); window.location.href='dashboard.html'; }
        });

        async function loadRecap() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const tbody = document.getElementById('recapBody');
            tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-400">Memuat...</td></tr>';

            try {
                const res = await fetch(`sadigs_api_v3/teaching_journal_api.php?action=get_recap&start_date=${start}&end_date=${end}`);
                const result = await res.json();

                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(row => {
                        const date = new Date(row.teaching_date).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'});
                        
                        const locationHtml = (row.location_lat && row.location_long) 
                            ? `<a href="https://www.google.com/maps?q=${row.location_lat},${row.location_long}" target="_blank" class="text-blue-600 hover:text-blue-800 flex items-center justify-center gap-1 text-xs font-bold transition"><i data-lucide="map-pin" class="w-3 h-3"></i> Cek Peta</a>`
                            : '<span class="text-gray-400 text-xs italic">Tidak ada lokasi</span>';

                        return `
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 font-medium text-gray-900">${date}</td>
                                <td class="px-6 py-4 font-bold text-gray-800">${row.full_name}</td>
                                <td class="px-6 py-4 text-gray-600">${row.subject} (${row.grade})</td>
                                <td class="px-6 py-4 text-center font-mono text-gray-500">${row.start_time.substring(0,5)} - ${row.end_time.substring(0,5)}</td>
                                <td class="px-6 py-4 text-center">${locationHtml}</td>
                                <td class="px-6 py-4 text-center font-bold text-teal-600">${row.duration}</td>
                            </tr>
                        `;
                    }).join('');
                    lucide.createIcons();
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-400">Tidak ada data jurnal pada periode ini.</td></tr>';
                }
            } catch (e) { tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-red-500">Gagal memuat data.</td></tr>'; }
        }
        loadRecap();
    </script>
</body>
</html>
