<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Akademik | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;}
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- HEADER MOBILE -->
    <div class="lg:hidden flex justify-between items-center bg-teal-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="font-bold text-xl flex items-center gap-2"><span>SADIGS 3.0</span></div>
        <button id="mobileMenuBtn" class="focus:outline-none p-1 rounded hover:bg-teal-700 transition"><i data-lucide="menu" class="w-7 h-7"></i></button>
    </div>

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col transition-transform transform -translate-x-full lg:translate-x-0 fixed lg:static h-full z-40 shadow-2xl lg:shadow-none">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6 border-b border-gray-100 bg-teal-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-teal-200 flex items-center justify-center text-teal-800 font-bold text-lg shadow-sm"><span id="userInitial">U</span></div>
                    <div class="overflow-hidden">
                        <p id="sidebarUsername" class="font-bold text-gray-800 text-sm truncate">Memuat...</p>
                        <p id="sidebarRole" class="text-xs text-gray-500 truncate font-medium">Role...</p>
                    </div>
                </div>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <!-- Menu Dinamis akan dimuat di sini oleh JS -->
            </nav>
        </aside>
        <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden lg:hidden backdrop-blur-sm"></div>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-7xl mx-auto">
                <div class="flex items-center gap-3 mb-6">
                    <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition lg:hidden"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Monitoring Akademik</h1>
                        <p class="text-sm text-gray-500">Pantau progres penyelesaian Buku Kerja dan Modul Ajar para ustadz.</p>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left font-bold text-gray-600 uppercase tracking-wider">Nama Ustadz/Ustadzah</th>
                                    <th class="px-6 py-3 text-center font-bold text-gray-600 uppercase tracking-wider">Buku Kerja Selesai</th>
                                    <th class="px-6 py-3 text-center font-bold text-gray-600 uppercase tracking-wider">Modul Ajar Dibuat</th>
                                </tr>
                            </thead>
                            <tbody id="monitoringTableBody" class="bg-white divide-y divide-gray-100">
                                <tr>
                                    <td colspan="3" class="px-6 py-10 text-center text-gray-400">
                                        <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>
                                        Memuat data progres...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // --- Standard Sidebar & Session Logic ---
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        function toggleSidebar() { sidebar.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); }
        mobileMenuBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        async function initPage() {
            try {
                const sessionRes = await fetch('sadigs_api_v3/session_check.php');
                const sessionData = await sessionRes.json();
                if (!sessionData.success) { window.location.href = 'index.html'; return; }

                document.getElementById('sidebarUsername').textContent = sessionData.username;
                document.getElementById('userInitial').textContent = sessionData.username.charAt(0).toUpperCase();
                const rawRoles = sessionData.raw_roles || [];
                document.getElementById('sidebarRole').textContent = rawRoles.length > 0 ? rawRoles.map(r => r.role_name).join(', ') : 'User';

                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                if (permData.success) {
                    renderSidebar(permData.permissions || []);
                }
                
                loadMonitoringData();

            } catch (e) { console.error(e); }
        }

        function renderSidebar(allowedMenus) {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = `
                <div class="bg-gray-50 rounded-lg p-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">UMUM</h3>
                    <a id="navDashboard" href="dashboard.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
                </div>
                <div class="bg-gray-50 rounded-lg p-2 mt-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KEPEGAWAIAN</h3>
                    <a id="navPerencanaanAkademik" href="academic_planning.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="book-check" class="w-5 h-5"></i> Buku Kerja Ustadz</a>
                    <a id="navMonitoringAkademik" href="academic_monitoring.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="monitor-check" class="w-5 h-5"></i> Monitoring Akademik</a>
                </div>
            `;
            allowedMenus.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            });
            lucide.createIcons();
        }

        async function loadMonitoringData() {
            const tbody = document.getElementById('monitoringTableBody');
            try {
                const res = await fetch('sadigs_api_v3/get_academic_monitoring_data.php');
                const result = await res.json();

                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(teacher => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-gray-50';
                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="font-bold text-gray-900">${teacher.full_name || teacher.username}</div>
                                <div class="text-xs text-gray-500">${teacher.username}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">
                                <span class="text-lg font-bold ${teacher.promes_count > 0 ? 'text-green-600' : 'text-gray-400'}">${teacher.promes_count}</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">
                                <span class="text-lg font-bold ${teacher.rpp_count > 0 ? 'text-blue-600' : 'text-gray-400'}">${teacher.rpp_count}</span>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-10 text-center text-gray-400">Tidak ada data ustadz/ustadzah yang ditemukan.</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>';
            }
        }

        initPage();
    </script>
</body>
</html>
