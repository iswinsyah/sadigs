<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Ibadah Saya | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-6xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Riwayat Ibadah Harian</h1>
                        <p class="text-sm text-gray-500">Pantau kedisiplinan ibadah Anda dalam 30 hari terakhir.</p>
                    </div>
                    <a href="daily_worship_form.html" class="bg-teal-600 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-teal-700 shadow-sm">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Input Hari Ini
                    </a>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-teal-50">
                                <tr>
                                    <th class="px-4 py-3 text-left font-bold text-teal-800 uppercase">Tanggal</th>
                                    <th class="px-4 py-3 text-center font-bold text-teal-800 uppercase">Sholat Wajib</th>
                                    <th class="px-4 py-3 text-center font-bold text-teal-800 uppercase">Sunnah</th>
                                    <th class="px-4 py-3 text-left font-bold text-teal-800 uppercase">Tilawah</th>
                                    <th class="px-4 py-3 text-center font-bold text-teal-800 uppercase">Status</th>
                                </tr>
                            </thead>
                            <tbody id="reportTableBody" class="bg-white divide-y divide-gray-200">
                                <tr><td colspan="5" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Cek Sesi
        fetch('sadigs_api_v3/session_check.php').then(r=>r.json()).then(d=>{
            if(!d.success) window.location.href = 'index.html';
            loadReports();
        });

        async function loadReports() {
            const tbody = document.getElementById('reportTableBody');
            try {
                const res = await fetch('sadigs_api_v3/get_my_worship_reports.php');
                const result = await res.json();
                
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition";
                        
                        // Format Tanggal
                        const date = new Date(row.report_date).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
                        
                        // Badge Sholat
                        const sholat = `
                            <div class="flex justify-center gap-1">
                                ${getBadge('S', row.subuh)}
                                ${getBadge('Z', row.zuhur)}
                                ${getBadge('A', row.ashar)}
                                ${getBadge('M', row.maghrib)}
                                ${getBadge('I', row.isya)}
                            </div>
                        `;

                        // Badge Sunnah
                        const sunnah = `
                            <span class="${row.dhuha == 1 ? 'text-green-600' : 'text-gray-300'} font-bold text-xs mr-2">Dhuha</span>
                            <span class="${row.tahajud == 1 ? 'text-blue-600' : 'text-gray-300'} font-bold text-xs">Tahajud</span>
                        `;

                        // Status
                        const statusColor = row.status === 'approved' ? 'bg-green-100 text-green-800' : (row.status === 'rejected' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800');
                        const statusLabel = row.status === 'approved' ? 'Divalidasi' : (row.status === 'rejected' ? 'Ditolak' : 'Menunggu');

                        tr.innerHTML = `
                            <td class="px-4 py-3 font-bold text-gray-700">${date}</td>
                            <td class="px-4 py-3 text-center">${sholat}</td>
                            <td class="px-4 py-3 text-center">${sunnah}</td>
                            <td class="px-4 py-3 text-gray-600">${row.quran_reading || '-'}</td>
                            <td class="px-4 py-3 text-center"><span class="px-2 py-1 rounded-full text-xs font-bold ${statusColor}">${statusLabel}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-gray-500">Belum ada laporan ibadah.</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>';
            }
        }

        function getBadge(label, status) {
            const color = status === 'Jamaah' ? 'bg-green-500' : (status === 'Munfarid' ? 'bg-yellow-500' : 'bg-red-500');
            const title = status || 'Tidak Sholat';
            return `<span class="w-6 h-6 flex items-center justify-center rounded text-white text-[10px] font-bold ${color}" title="${label}: ${title}">${label}</span>`;
        }
    </script>
</body>
</html>
