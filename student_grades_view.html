<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Rapot Santri | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar & Navigation -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center bg-teal-600 text-white font-bold text-xl tracking-wider">SADIGS</div>
            <div class="p-6">
                <button onclick="window.history.back()" class="flex items-center gap-2 text-gray-600 hover:text-teal-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali
                </button>
                <a href="dashboard.html" class="flex items-center gap-2 mt-4 text-gray-600 hover:text-teal-600">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2"></nav>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 lg:p-8 relative">
            <div class="max-w-5xl mx-auto">
                <!-- Header Mobile -->
                <div class="lg:hidden mb-6">
                    <button onclick="window.history.back()" class="flex items-center gap-2 text-gray-600 font-medium">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali
                    </button>
                </div>

                <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Nilai Rapot Santri</h1>
                        <p class="text-gray-500 text-sm mt-1">Capaian akademik berdasarkan penilaian ustadz.</p>
                    </div>
                    <div class="bg-blue-50 px-4 py-2 rounded-lg border border-blue-100 flex items-center gap-3">
                        <div class="bg-blue-200 p-2 rounded-full text-blue-700"><i data-lucide="graduation-cap" class="w-5 h-5"></i></div>
                        <div>
                            <span class="text-xs text-blue-600 font-bold uppercase tracking-wider block leading-none">Nama Santri</span>
                            <p class="font-bold text-blue-900 text-lg leading-tight" id="studentNameDisplay">Memuat...</p>
                        </div>
                    </div>
                </header>

                <!-- Kontainer Rapot -->
                <div id="gradesContainer" class="space-y-8">
                    <div class="text-center py-10 text-gray-500">
                        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2 text-blue-500"></i> Memuat nilai...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Ambil ID Santri dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student_id') || '';

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            // Redirect jika Walisantri tapi belum milih anak
            if (sessionData.roles.includes('Walisantri') && !studentId) {
                alert('Silakan pilih santri terlebih dahulu.');
                window.location.href = 'select_student.html';
                return;
            }

            // Muat Nilai
            loadGrades();
        }

        function getGradeColor(grade) {
            if(grade === 'A') return 'bg-green-100 text-green-800';
            if(grade === 'B' || grade === 'B+' || grade === 'B-') return 'bg-blue-100 text-blue-800';
            if(grade === 'C') return 'bg-yellow-100 text-yellow-800';
            return 'bg-red-100 text-red-800';
        }

        async function loadGrades() {
            const container = document.getElementById('gradesContainer');
            try {
                const res = await fetch(`sadigs_api_v3/get_student_grades.php?student_id=${studentId}`);
                const result = await res.json();
                
                if (result.success) {
                    document.getElementById('studentNameDisplay').textContent = result.student_name;

                    if (Object.keys(result.data).length > 0) {
                        container.innerHTML = '';
                        
                        // Render per Semester
                        for (const [period, grades] of Object.entries(result.data)) {
                            const periodCard = document.createElement('div');
                            periodCard.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden';
                            
                            let tableRows = grades.map((g, index) => `
                                <tr class="hover:bg-gray-50 transition border-b border-gray-100 last:border-0">
                                    <td class="px-6 py-4 text-sm text-gray-500 text-center w-12">${index + 1}</td>
                                    <td class="px-6 py-4 font-bold text-gray-800">${g.subject}</td>
                                    <td class="px-6 py-4 text-center font-mono font-bold text-gray-700">${parseFloat(g.score)}</td>
                                    <td class="px-6 py-4 text-center">
                                        <span class="px-3 py-1 rounded-full text-sm font-extrabold ${getGradeColor(g.grade)}">${g.grade}</span>
                                    </td>
                                    <td class="px-6 py-4 text-sm text-gray-500 italic max-w-xs truncate">${g.notes || '-'}</td>
                                </tr>
                            `).join('');

                            periodCard.innerHTML = `
                                <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                                    <h3 class="font-bold text-gray-800 uppercase tracking-wider text-sm">Tahun Ajaran ${period}</h3>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left text-sm">
                                        <thead class="bg-gray-100/50 text-gray-600 font-bold">
                                            <tr>
                                                <th class="px-6 py-3 text-center">No</th>
                                                <th class="px-6 py-3">Mata Pelajaran</th>
                                                <th class="px-6 py-3 text-center">Nilai (0-100)</th>
                                                <th class="px-6 py-3 text-center">Predikat</th>
                                                <th class="px-6 py-3">Catatan Ustadz</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${tableRows}
                                        </tbody>
                                    </table>
                                </div>
                            `;
                            container.appendChild(periodCard);
                        }
                    } else {
                        container.innerHTML = `<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-12 text-center text-gray-500"><i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 text-gray-300"></i><p>Belum ada data nilai yang diinputkan untuk santri ini.</p></div>`;
                        lucide.createIcons();
                    }
                }
            } catch (e) {
                container.innerHTML = '<div class="text-red-500 p-8 text-center bg-red-50 rounded-xl">Gagal memuat data nilai.</div>';
            }
        }

        initPage();
    </script>
</body>
</html>
