<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Perangkat Ajar | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR (Sama seperti halaman lain) -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col transition-transform transform -translate-x-full lg:translate-x-0 fixed lg:static h-full z-40 shadow-2xl lg:shadow-none">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6 border-b border-gray-100 bg-teal-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-teal-200 flex items-center justify-center text-teal-800 font-bold text-lg shadow-sm"><span id="userInitial">U</span></div>
                    <div class="overflow-hidden">
                        <p id="sidebarUsername" class="font-bold text-gray-800 text-sm truncate">Memuat...</p>
                        <p id="sidebarRole" class="text-xs text-gray-500 truncate font-medium">Role...</p>
                    </div>
                </div>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <!-- Menu akan di-inject via JS -->
            </nav>
        </aside>
        <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden lg:hidden backdrop-blur-sm"></div>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-7xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Album Perangkat Ajar</h1>
                        <p class="text-sm text-gray-500">Kumpulan Modul Ajar, LKPD, dan Asesmen yang telah Anda buat.</p>
                    </div>
                    <a href="academic_planning.html" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 shadow-sm">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Buat Baru
                    </a>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left font-bold text-gray-600 uppercase tracking-wider">Tanggal</th>
                                    <th class="px-6 py-3 text-left font-bold text-gray-600 uppercase tracking-wider">Jenis</th>
                                    <th class="px-6 py-3 text-left font-bold text-gray-600 uppercase tracking-wider">Mapel & Kelas</th>
                                    <th class="px-6 py-3 text-left font-bold text-gray-600 uppercase tracking-wider">Topik</th>
                                    <th class="px-6 py-3 text-center font-bold text-gray-600 uppercase tracking-wider">Status</th>
                                    <th class="px-6 py-3 text-center font-bold text-gray-600 uppercase tracking-wider">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="albumTableBody" class="bg-white divide-y divide-gray-100">
                                <tr>
                                    <td colspan="6" class="px-6 py-10 text-center text-gray-400">
                                        <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>
                                        Memuat data album...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal View Content -->
    <div id="viewModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h3 class="font-bold text-lg text-gray-800">Detail Perangkat Ajar</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 bg-gray-50">
                <textarea id="modalContent" class="w-full h-full min-h-[400px] p-4 border border-gray-300 rounded-lg font-mono text-sm bg-white" readonly></textarea>
            </div>
            <div class="p-4 border-t bg-white rounded-b-xl flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // Mobile Menu Logic
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        // (Tambahkan tombol mobile menu jika diperlukan di header, tapi untuk sekarang kita fokus ke logika sidebar)

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }
            
            // Update Sidebar Info
            document.getElementById('sidebarUsername').textContent = sessionData.username;
            document.getElementById('userInitial').textContent = sessionData.username.charAt(0).toUpperCase();
            const rawRoles = sessionData.raw_roles || [];
            document.getElementById('sidebarRole').textContent = rawRoles.length > 0 ? rawRoles.map(r => r.role_name).join(', ') : 'User';

            // Cek Izin Menu
            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                if (permData.success) {
                    const allowedMenus = permData.permissions || [];
                    
                    // 1. Cek apakah user boleh akses halaman ini
                    if (!allowedMenus.includes('navRppAlbum')) {
                        alert('Akses Ditolak. Anda tidak memiliki izin untuk mengakses halaman ini.');
                        window.location.href = 'dashboard.html';
                        return;
                    }

                    // 2. Render Sidebar
                    renderSidebar(allowedMenus);
                }
            } catch (e) { console.error("Gagal memuat izin menu:", e); }

            loadAlbum();
        }

        function renderSidebar(allowedMenus) {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = `
                <div class="bg-gray-50 rounded-lg p-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">UMUM</h3>
                    <a id="navDashboard" href="dashboard.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
                    <a id="navProfil" href="profile.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="user" class="w-5 h-5"></i> Profil Saya</a>
                </div>
                <div id="groupKepegawaian" class="hidden bg-gray-50 rounded-lg p-2 mt-2">
                    <h3 class="px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KEPEGAWAIAN</h3>
                    <a id="navAbsensi" href="attendance.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="map-pin" class="w-5 h-5"></i> Absensi Pegawai</a>
                    <a id="navIzinPegawai" href="leave_request.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="file-edit" class="w-5 h-5"></i> Formulir Izin</a>
                    <a id="navRppGenerator" href="rpp_generator.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="brain-circuit" class="w-5 h-5"></i> Generator Modul Ajar</a>
                    <a id="navRppAlbum" href="teaching_artifacts_album.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="folder-open" class="w-5 h-5"></i> Album Perangkat Ajar</a>
                    <a id="navPerencanaanAkademik" href="academic_planning.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm"><i data-lucide="book-check" class="w-5 h-5"></i> Buku Kerja Ustadz</a>
                </div>
                <div class="pt-2">
                    <button onclick="if(confirm('Keluar aplikasi?')) window.location.href='sadigs_api_v3/logout.php'" class="w-full flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition font-medium"><i data-lucide="log-out" class="w-5 h-5"></i> Keluar</button>
                </div>
            `;

            allowedMenus.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            });

            if (document.querySelector('#groupKepegawaian a:not(.hidden)')) {
                document.getElementById('groupKepegawaian').classList.remove('hidden');
            }
            lucide.createIcons();
        }

        async function loadAlbum() {
            const tbody = document.getElementById('albumTableBody');
            try {
                const res = await fetch('sadigs_api_v3/get_all_artifacts_api.php');
                const result = await res.json();

                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-gray-50 transition';
                        
                        let typeBadge = '';
                        if(item.type === 'modul') typeBadge = '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">Modul Ajar</span>';
                        else if(item.type === 'lkpd') typeBadge = '<span class="bg-orange-100 text-orange-800 px-2 py-1 rounded text-xs font-bold">LKPD</span>';
                        else if(item.type === 'soal') typeBadge = '<span class="bg-purple-100 text-purple-800 px-2 py-1 rounded text-xs font-bold">Asesmen</span>';

                        const statusBadge = item.status === 'submitted' 
                            ? '<span class="text-green-600 font-bold text-xs flex items-center justify-center gap-1"><i data-lucide="check-circle" class="w-3 h-3"></i> Diajukan</span>' 
                            : '<span class="text-yellow-600 font-bold text-xs flex items-center justify-center gap-1"><i data-lucide="edit-3" class="w-3 h-3"></i> Draft</span>';

                        const dateStr = new Date(item.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-gray-500">${dateStr}</td>
                            <td class="px-6 py-4 whitespace-nowrap">${typeBadge}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="font-bold text-gray-800">${item.subject}</div>
                                <div class="text-xs text-gray-500">Kelas ${item.grade} (Fase ${item.fase})</div>
                            </td>
                            <td class="px-6 py-4 text-gray-600 max-w-xs truncate" title="${item.topic}">${item.topic || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">${statusBadge}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">
                                <button onclick="viewContent(this)" data-content="${encodeURIComponent(item.content)}" class="text-blue-600 hover:text-blue-800 font-bold text-xs mr-3">Lihat</button>
                                <button onclick="deleteItem(${item.id})" class="text-red-600 hover:text-red-800 font-bold text-xs">Hapus</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                    lucide.createIcons();
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500 italic">Belum ada perangkat ajar yang disimpan.</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>';
                console.error(e);
            }
        }

        function viewContent(btn) {
            const content = decodeURIComponent(btn.dataset.content);
            document.getElementById('modalContent').value = content;
            document.getElementById('viewModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('viewModal').classList.add('hidden');
        }

        async function deleteItem(id) {
            if(!confirm("Hapus item ini secara permanen?")) return;
            try {
                const res = await fetch('sadigs_api_v3/delete_artifact_api.php', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({id}) 
                });
                const result = await res.json();
                if(result.success) {
                    alert("Berhasil dihapus.");
                    loadAlbum();
                } else {
                    alert("Gagal menghapus: " + result.message);
                }
            } catch(e) {
                alert("Error koneksi.");
            }
        }

        initPage();
    </script>
</body>
</html>
