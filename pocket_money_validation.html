<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi Uang Saku | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-kedua text-white">
                <img src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" alt="Logo" class="h-9">
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-utama transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2">
                <!-- Menu akan dimuat oleh JS -->
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">Validasi Deposit Uang Saku</h2>
                <p class="text-gray-500 text-sm mt-1">Verifikasi bukti transfer dan setujui deposit uang saku.</p>
            </header>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Walisantri</th>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Untuk Santri</th>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Jumlah</th>
                                <th class="px-4 py-3 text-left font-bold text-gray-500 uppercase">Tanggal</th>
                                <th class="px-4 py-3 text-center font-bold text-gray-500 uppercase">Bukti</th>
                                <th class="px-4 py-3 text-center font-bold text-gray-500 uppercase">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        function renderSidebar(allowedMenus) {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = `<div class="bg-gray-50 rounded-lg p-2"><h3 class="px-2 mb-2 text-xs font-bold text-gray-400">KEUANGAN</h3><a id="navPocketMoneyValidation" href="pocket_money_validation.html" class="flex items-center gap-3 px-3 py-2.5 text-utama bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="check-circle-2" class="w-5 h-5"></i> Validasi Uang Saku</a></div>`;
            lucide.createIcons();
        }

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                const allowedMenus = permData.success ? permData.permissions : [];

                if (!allowedMenus.includes('navPocketMoneyValidation')) {
                    alert('Anda tidak memiliki izin untuk mengakses halaman ini.');
                    window.location.href = 'dashboard.html';
                    return;
                }
                renderSidebar(allowedMenus);
                loadData();
            } catch (e) { 
                alert('Gagal memuat data halaman.');
            }
        }

        async function loadData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">Memuat data...</td></tr>';
            try {
                const res = await fetch('sadigs_api_v3/get_pocket_money_tx.php?status=pending');
                const result = await res.json();
                
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = \`
                            <td class="px-4 py-3 align-top font-medium text-gray-900">\${row.walisantri_name}</td>
                            <td class="px-4 py-3 align-top">\${row.santri_name}</td>
                            <td class="px-4 py-3 align-top font-bold text-utama">Rp \${parseInt(row.amount).toLocaleString('id-ID')}</td>
                            <td class="px-4 py-3 align-top">\${row.created_at_formatted}</td>
                            <td class="px-4 py-3 align-top text-center">
                                <a href="sadigs_api_v3/\${row.proof_file}" target="_blank" class="inline-flex items-center gap-1 text-blue-600 hover:underline text-xs font-medium">
                                    <i data-lucide="file-text" class="w-4 h-4"></i> Lihat
                                </a>
                            </td>
                            <td class="px-4 py-3 align-top text-center space-x-2">
                                <button onclick="validate(\${row.id}, 'approved')" class="bg-green-100 text-green-700 px-3 py-1 rounded-md font-semibold hover:bg-green-200 transition text-xs">Terima</button>
                                <button onclick="validate(\${row.id}, 'rejected')" class="bg-red-100 text-red-700 px-3 py-1 rounded-md font-semibold hover:bg-red-200 transition text-xs">Tolak</button>
                            </td>
                        \`;
                        tbody.appendChild(tr);
                    });
                    lucide.createIcons();
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">Tidak ada deposit yang perlu divalidasi.</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-red-500">Gagal memuat data.</td></tr>';
            }
        }

        window.validate = async function(id, status) {
            if (!confirm(\`Anda yakin ingin \${status === 'approved' ? 'menerima' : 'menolak'} deposit ini?\`)) return;
            try {
                const res = await fetch('sadigs_api_v3/validate_pocket_money.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ transaction_id: id, action: status })
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) loadData();
            } catch (e) { alert('Terjadi kesalahan koneksi.'); }
        }

        initPage();
    </script>
</body>
</html>
