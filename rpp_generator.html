<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul Ajar Generator | SADIGS 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'utama': '#4FB7B3',
                        'kedua': '#26667F',
                        'tombol-utama': '#3674B5',
                        'tombol-kedua': '#F93827',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .prose h2 { font-size: 1.25rem; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .prose h3 { font-size: 1.1rem; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; }
        .prose ul { list-style-type: disc; margin-left: 1.5rem; }
        .prose ol { list-style-type: decimal; margin-left: 1.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-kedua text-white">
                <img src="https://raw.githubusercontent.com/villaqurankotabatu-commits/gambarvqbm/f44bf009884af11aba2c967a2401026225f7b02b/vila%20quran.png" alt="Logo Villa Quran" class="h-9">
            </div>
            <div class="p-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-600 hover:text-utama transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Dashboard
                </a>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2">
                <!-- Menu akan dimuat oleh JS -->
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <header class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800 flex items-center gap-3">
                    <i data-lucide="brain-circuit" class="w-8 h-8 text-utama"></i>
                    Generator Modul Ajar
                </h2>
                <p class="text-gray-500 text-sm mt-1">Buat draf Modul Ajar dengan bantuan kecerdasan buatan.</p>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
                <!-- Kolom Formulir -->
                <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                    <form id="rppForm" class="space-y-6">
                        <div>
                            <label for="subject" class="block text-sm font-bold text-gray-700 mb-1">Mata Pelajaran</label>
                            <input type="text" id="subject" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-utama outline-none" placeholder="Contoh: Fiqih" required>
                        </div>
                        <div>
                            <label for="grade" class="block text-sm font-bold text-gray-700 mb-1">Kelas / Semester</label>
                            <input type="text" id="grade" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-utama outline-none" placeholder="Contoh: 10 / Ganjil" required>
                        </div>
                        <div>
                            <label for="topic" class="block text-sm font-bold text-gray-700 mb-1">Topik / Materi Pokok</label>
                            <input type="text" id="topic" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-utama outline-none" placeholder="Contoh: Thaharah (Bersuci)" required>
                        </div>
                        <div>
                            <label for="objectives" class="block text-sm font-bold text-gray-700 mb-1">Tujuan Pembelajaran</label>
                            <textarea id="objectives" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-utama outline-none" placeholder="Siswa mampu menjelaskan pengertian thaharah..." required></textarea>
                        </div>
                        <div class="pt-2">
                            <button type="submit" id="generateBtn" class="w-full bg-tombol-utama hover:bg-tombol-utama/90 text-white font-bold py-3 rounded-lg transition shadow-md flex justify-center items-center gap-2">
                                <i data-lucide="sparkles" class="w-5 h-5"></i> Generate Modul Ajar
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Kolom Hasil -->
                <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 min-h-[400px]">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-800">Modul Ajar Siap Pakai</h3>
                        <button id="saveToAlbumBtn" class="hidden bg-green-100 text-green-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-green-200 transition flex items-center gap-2">
                            <i data-lucide="book-plus" class="w-4 h-4"></i> Simpan ke Album
                        </button>
                    </div>
                    <div id="resultContainer" class="prose max-w-none bg-gray-50 p-4 rounded-lg border border-gray-200 min-h-[300px]" contenteditable="true">
                        <div id="placeholder" class="text-center text-gray-400 pt-20">Hasil akan muncul di sini...</div>
                        <div id="loading" class="hidden text-center text-gray-500 pt-20 animate-pulse">Memproses permintaan Anda...</div>
                        <div id="rppResult"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        let generatedRppContent = ''; // Store the raw generated content

        async function initPage() {
            const sessionRes = await fetch('sadigs_api_v3/session_check.php');
            const sessionData = await sessionRes.json();
            if (!sessionData.success) { window.location.href = 'index.html'; return; }

            try {
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                const allowedMenus = permData.success ? permData.permissions : [];

                if (!allowedMenus.includes('navRppGenerator')) {
                    alert('Anda tidak memiliki izin untuk mengakses halaman ini.');
                    window.location.href = 'dashboard.html';
                    return;
                }
                renderSidebar(allowedMenus);
            } catch (e) { 
                alert('Gagal memuat izin akses.');
                window.location.href = 'dashboard.html';
            }
        }

        function renderSidebar(allowedMenus) {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = `<div class="bg-gray-50 rounded-lg p-2"><h3 class="px-2 mb-2 text-xs font-bold text-gray-400">KEPEGAWAIAN</h3><a id="navRppGenerator" href="rpp_generator.html" class="flex items-center gap-3 px-3 py-2.5 text-utama bg-white rounded-md transition font-semibold text-sm shadow-sm"><i data-lucide="brain-circuit" class="w-5 h-5"></i> Generator Modul Ajar</a><a id="navRppAlbum" href="rpp_album.html" class="hidden flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-utama rounded-md transition font-medium text-sm"><i data-lucide="book-copy" class="w-5 h-5"></i> Album Modul Ajar</a></div>`;
            allowedMenus.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            });
            lucide.createIcons();
        }

        document.getElementById('rppForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('generateBtn');
            const placeholder = document.getElementById('placeholder');
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('rppResult');
            const saveBtn = document.getElementById('saveToAlbumBtn');

            const data = {
                subject: document.getElementById('subject').value,
                grade: document.getElementById('grade').value,
                topic: document.getElementById('topic').value,
                objectives: document.getElementById('objectives').value,
            };

            // UI update
            btn.disabled = true;
            placeholder.classList.add('hidden');
            loading.classList.remove('hidden');
            resultDiv.innerHTML = '';
            saveBtn.classList.add('hidden');
            generatedRppContent = '';

            try {
                const res = await fetch('sadigs_api_v3/generate_rpp.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    generatedRppContent = result.rpp;
                    resultDiv.innerHTML = generatedRppContent.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                    saveBtn.classList.remove('hidden');
                } else {
                    resultDiv.innerHTML = `<p class="text-red-500">Error: ${result.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="text-red-500">Terjadi kesalahan koneksi.</p>`;
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        });

        document.getElementById('saveToAlbumBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveToAlbumBtn');
            if (!generatedRppContent) {
                alert('Tidak ada Modul Ajar untuk disimpan.');
                return;
            }

            const dataToSave = {
                subject: document.getElementById('subject').value,
                grade: document.getElementById('grade').value,
                topic: document.getElementById('topic').value,
                rpp_content: generatedRppContent
            };

            const originalBtnHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';

            try {
                const res = await fetch('sadigs_api_v3/save_rpp_to_album.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSave)
                });
                const result = await res.json();
                alert(result.message);
            } catch (error) {
                alert('Gagal menyimpan Modul Ajar karena kesalahan koneksi.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnHTML;
                lucide.createIcons();
            }
        });

        initPage();
    </script>
</body>
</html>
