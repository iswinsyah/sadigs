<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terbitkan Peraturan | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;}
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden lg:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-200 bg-teal-600 text-white">
                <h1 class="text-2xl font-extrabold tracking-wider">SADIGS</h1>
            </div>
            <div class="p-6 border-b border-gray-100 bg-teal-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-teal-200 flex items-center justify-center text-teal-800 font-bold text-lg shadow-sm"><span id="userInitial">U</span></div>
                    <div class="overflow-hidden">
                        <p id="sidebarUsername" class="font-bold text-gray-800 text-sm truncate">Memuat...</p>
                        <p id="sidebarRole" class="text-xs text-gray-500 truncate font-medium">Role...</p>
                    </div>
                </div>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
                <!-- Menu akan dimuat oleh JS -->
                <div class="p-4 text-center text-gray-400 text-sm">Memuat menu...</div>
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-8 w-full relative">
            <div class="max-w-2xl mx-auto">
        <div class="flex items-center gap-3 mb-6">
            <a href="dashboard.html" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i></a>
            <h1 class="text-2xl font-bold text-gray-800">Terbitkan Peraturan Baru</h1>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <form id="regForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Judul / Perihal</label>
                    <input type="text" name="title" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Kebijakan Libur Semester" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Ditujukan Kepada</label>
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-3 max-h-60 overflow-y-auto custom-scrollbar">
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-teal-50 p-2 rounded transition bg-teal-50 border border-teal-200 md:col-span-2">
                            <input type="checkbox" name="target_role" value="Umum" class="w-5 h-5 text-teal-600 rounded focus:ring-teal-500 border-gray-300">
                            <span class="text-sm font-bold text-teal-800 flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> UMUM (Semua Warga Sekolah)</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-blue-50 p-2 rounded transition bg-blue-50 border border-blue-200 md:col-span-2">
                            <input type="checkbox" name="target_role" value="Staf" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm font-bold text-blue-800 flex items-center gap-2"><i data-lucide="briefcase" class="w-4 h-4"></i> STAF (Guru & Karyawan)</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Kepala Sekolah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Kepala Sekolah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Sekretaris Sekolah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Sekretaris Sekolah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Bendahara Sekolah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Bendahara Sekolah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Admin Sekolah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Admin Sekolah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Kepala Asrama Putra" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Kepala Asrama Putra</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Kepala Asrama Putri" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Kepala Asrama Putri</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Musyrif" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Musyrif</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Musyrifah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Musyrifah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Ustadz" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Ustadz</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Ustadzah" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Ustadzah</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Santri Rijal" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Santri Rijal</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Santri Nisa'" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Santri Nisa'</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition">
                            <input type="checkbox" name="target_role" value="Walisantri" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <span class="text-sm text-gray-700">Walisantri</span>
                        </label>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Pilih satu atau lebih peran yang akan menerima amanah/peraturan ini.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Isi Peraturan / Pengumuman</label>
                    <textarea name="content" rows="6" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Tulis detail peraturan di sini..." required></textarea>
                </div>

                <div class="bg-yellow-50 p-3 rounded-lg text-sm text-yellow-800 flex gap-2">
                    <i data-lucide="info" class="w-5 h-5 flex-shrink-0"></i>
                    <p>Peraturan yang dibuat akan berstatus <strong>Pending</strong> dan tidak akan tampil sebelum divalidasi oleh Ketua Yayasan.</p>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md mt-4 flex justify-center items-center gap-2">
                    <i data-lucide="send" class="w-5 h-5"></i> Terbitkan Peraturan
                </button>
            </form>
        </div>
    </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // --- SIDEBAR LOGIC ---
        async function initSidebar() {
            try {
                // 1. Cek Sesi
                const sessionRes = await fetch('sadigs_api_v3/session_check.php');
                const sessionData = await sessionRes.json();
                if (!sessionData.success) { window.location.href = 'index.html'; return; }

                // 2. Update Info User di Sidebar
                document.getElementById('sidebarUsername').textContent = sessionData.username;
                document.getElementById('userInitial').textContent = sessionData.username.charAt(0).toUpperCase();
                const rawRoles = sessionData.raw_roles || [];
                let rolesText = 'User';
                if (rawRoles.length > 0) {
                    const uniqueRoles = [...new Set(rawRoles.map(r => r.status === 'approved' ? r.role_name : `${r.role_name} (Pending)`))];
                    rolesText = uniqueRoles.join(', ');
                }
                document.getElementById('sidebarRole').textContent = rolesText;

                // 3. Ambil dan Terapkan Hak Akses Menu
                const permRes = await fetch('sadigs_api_v3/get_menu_permissions.php');
                const permData = await permRes.json();
                if (permData.success) {
                    const sidebarNav = document.getElementById('sidebarNav');
                    sidebarNav.innerHTML = '';

                    const allowedMenus = permData.permissions || [];
                    const categories = permData.categories || {};
                    const menuNames = permData.menu_names || {};
                    const menuIcons = permData.menu_icons || {};
                    const menuLinks = permData.menu_links || {};

                    for (const [catId, cat] of Object.entries(categories)) {
                        const visibleMenus = cat.menus.filter(mId => allowedMenus.includes(mId));
                        
                        if (visibleMenus.length > 0) {
                            const groupDiv = document.createElement('div');
                            groupDiv.className = "bg-gray-50 rounded-lg p-2 mt-2";
                            
                            const title = document.createElement('h3');
                            title.className = "px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider";
                            title.textContent = cat.label;
                            groupDiv.appendChild(title);
                            
                            visibleMenus.forEach(menuId => {
                                if (menuId === 'navYayasanWidget' || menuId === 'navMusyrifWidget') return;

                                const link = document.createElement('a');
                                link.href = menuLinks[menuId] || '#';
                                const isActive = window.location.pathname.includes(link.href) && link.href !== '#';
                                
                                link.className = isActive 
                                    ? "flex items-center gap-3 px-3 py-2.5 text-teal-700 bg-white rounded-md transition font-semibold text-sm shadow-sm"
                                    : "flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-white hover:text-teal-600 rounded-md transition font-medium text-sm";
                                
                                const iconName = menuIcons[menuId] || 'circle';
                                link.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5"></i> ${menuNames[menuId] || menuId}`;
                                groupDiv.appendChild(link);
                            });
                            sidebarNav.appendChild(groupDiv);
                        }
                    }
                    
                    // Tombol Logout
                    const logoutDiv = document.createElement('div');
                    logoutDiv.className = "pt-2";
                    logoutDiv.innerHTML = `<button onclick="if(confirm('Keluar aplikasi?')) window.location.href='sadigs_api_v3/logout.php'" class="w-full flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition font-medium"><i data-lucide="log-out" class="w-5 h-5"></i> Keluar</button>`;
                    sidebarNav.appendChild(logoutDiv);
                    lucide.createIcons();
                }
            } catch (e) { console.error(e); }
        }

        initSidebar();

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';

            const formData = new FormData(e.target);
            const roles = formData.getAll('target_role');

            if (roles.length === 0) {
                alert('Harap pilih setidaknya satu tujuan penerima.');
                btn.disabled = false;
                btn.innerHTML = originalText;
                return;
            }

            const data = {
                title: formData.get('title'),
                content: formData.get('content'),
                target_role: roles.join(', ') // Gabungkan array menjadi string koma
            };

            try {
                const res = await fetch('sadigs_api_v3/create_regulation.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) window.location.href = 'dashboard.html';
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
