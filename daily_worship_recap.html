<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Ibadah Santri | SADIGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar & Navigation -->
        <!-- Sidebar akan dimuat oleh JS (jika ada), atau tombol kembali -->
        <aside class="hidden lg:flex flex-col w-64 bg-white border-r border-gray-200">
            <div class="h-16 flex items-center justify-center bg-teal-600 text-white font-bold text-xl">SADIGS</div>
            <div class="p-4">
                <a href="select_student.html" class="flex items-center gap-2 text-gray-600 hover:text-teal-600">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Ganti Santri
                </a>
                <a href="dashboard.html" class="flex items-center gap-2 mt-4 text-gray-600 hover:text-teal-600">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 lg:p-8">
            <div class="max-w-5xl mx-auto">
                <!-- Header Mobile -->
                <div class="lg:hidden mb-6">
                    <a href="select_student.html" class="flex items-center gap-2 text-gray-600 font-medium">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali
                    </a>
                </div>

                <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Rekap Ibadah Harian</h1>
                        <p class="text-gray-500 text-sm mt-1">Memantau perkembangan ibadah ananda tercinta.</p>
                    </div>
                    <div class="bg-teal-50 px-4 py-2 rounded-lg border border-teal-100">
                        <span class="text-xs text-teal-600 font-bold uppercase tracking-wider">Santri</span>
                        <p class="font-bold text-teal-800 text-lg" id="studentNameDisplay">Memuat...</p>
                    </div>
                </header>

                <!-- Tabel Rekap -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-gray-50 text-gray-600 font-bold border-b border-gray-200">
                                <tr>
                                    <th class="px-4 py-3">Tanggal</th>
                                    <th class="px-4 py-3 text-center">Subuh</th>
                                    <th class="px-4 py-3 text-center">Zuhur</th>
                                    <th class="px-4 py-3 text-center">Ashar</th>
                                    <th class="px-4 py-3 text-center">Maghrib</th>
                                    <th class="px-4 py-3 text-center">Isya</th>
                                    <th class="px-4 py-3 text-center">Tahajud</th>
                                    <th class="px-4 py-3 text-center">Dhuha</th>
                                    <th class="px-4 py-3">Tilawah</th>
                                    <th class="px-4 py-3 text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody id="recapTableBody" class="divide-y divide-gray-100">
                                <tr><td colspan="10" class="px-4 py-8 text-center text-gray-400">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Ambil ID Santri dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student_id');

        if (!studentId) {
            alert('Pilih santri terlebih dahulu.');
            window.location.href = 'select_student.html';
        }

        // Fetch Data
        fetch(`sadigs_api_v3/get_my_worship_reports.php?student_id=${studentId}`)
            .then(r => r.json())
            .then(res => {
                const tbody = document.getElementById('recapTableBody');
                
                if (res.success && res.data && res.data.length > 0) {
                    tbody.innerHTML = '';
                    
                    // Ambil nama santri dari data pertama (jika ada di API, atau placeholder)
                    // Idealnya API mengembalikan nama santri juga, tapi kita bisa ambil dari select_student sebelumnya
                    // Untuk sekarang kita biarkan user melihat data dulu.
                    
                    res.data.forEach(row => {
                        const date = new Date(row.report_date).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
                        
                        // Helper badge status shalat
                        const badge = (val) => {
                            if(val === 'Jamaah') return `<span class="text-green-600 font-bold text-xs">J</span>`;
                            if(val === 'Munfarid') return `<span class="text-yellow-600 font-bold text-xs">M</span>`;
                            if(val === 'Masbuk') return `<span class="text-blue-600 font-bold text-xs">Ms</span>`;
                            if(val === 'Uzur') return `<span class="text-gray-400 font-bold text-xs">U</span>`;
                            return `<span class="text-red-400 font-bold text-xs">-</span>`;
                        };

                        const check = (val) => val == 1 ? `<i data-lucide="check" class="w-4 h-4 text-green-500 mx-auto"></i>` : `<span class="text-gray-300">-</span>`;

                        const statusBadge = row.status === 'approved' 
                            ? `<span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-bold">Valid</span>`
                            : `<span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full text-xs font-bold">Pending</span>`;

                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition";
                        tr.innerHTML = `
                            <td class="px-4 py-3 font-medium text-gray-700 whitespace-nowrap">${date}</td>
                            <td class="px-4 py-3 text-center">${badge(row.subuh)}</td>
                            <td class="px-4 py-3 text-center">${badge(row.zuhur)}</td>
                            <td class="px-4 py-3 text-center">${badge(row.ashar)}</td>
                            <td class="px-4 py-3 text-center">${badge(row.maghrib)}</td>
                            <td class="px-4 py-3 text-center">${badge(row.isya)}</td>
                            <td class="px-4 py-3 text-center">${check(row.tahajud)}</td>
                            <td class="px-4 py-3 text-center">${check(row.dhuha)}</td>
                            <td class="px-4 py-3 text-gray-600 truncate max-w-[150px]" title="${row.quran_reading}">${row.quran_reading || '-'}</td>
                            <td class="px-4 py-3 text-center">${statusBadge}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                    lucide.createIcons();
                    
                    // Update Nama (Optional: Fetch nama santri terpisah jika perlu)
                    document.getElementById('studentNameDisplay').textContent = "Putra/Putri Anda"; 

                } else {
                    tbody.innerHTML = `<tr><td colspan="10" class="px-4 py-12 text-center text-gray-400 flex flex-col items-center gap-2"><i data-lucide="clipboard-x" class="w-8 h-8"></i> Belum ada laporan ibadah yang masuk.</td></tr>`;
                    lucide.createIcons();
                    document.getElementById('studentNameDisplay').textContent = "Putra/Putri Anda";
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('recapTableBody').innerHTML = `<tr><td colspan="10" class="px-4 py-4 text-center text-red-500">Gagal memuat data.</td></tr>`;
            });
    </script>
</body>
</html>
